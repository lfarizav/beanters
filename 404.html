<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Beanters</title>
<meta name="robots" content="noindex">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0f18;color:#eef1f7;font:400 17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  main{max-width:34rem;padding:24px}
  h1{font-size:2rem;margin:0 0 .5rem}
  p{color:#9aa5ba;margin:0 0 1rem}
  a{color:#7ea1ff}
</style>
</head>
<body>
<main>
  <h1>Page not found</h1>
  <p>That page does not exist on beanters.com. <a href="/">Go to the home page</a>.</p>
</main>
<script>
  // Sites that used to be served under beanters.com/<repo>/ now live at lfarizav.github.io/<repo>/.
  (function () {
    var p = location.pathname;
    var moved = /^\/(NSGA-III|pseudorandomnumbergenerators|hdd-gsd2-hybrid-framework|helm-charts|lfs269-helm-charts)(\/.*)?$/;
    if (moved.test(p)) {
      location.replace("https://lfarizav.github.io" + p + location.search + location.hash);
    } else if (/^\/luis-ariza(\/|$)/.test(p)) {
      location.replace("https://lfarizav.github.io/" + (/^\/luis-ariza\/es(\/|$)/.test(p) ? "es/" : ""));
    }
  })();
</script>
</body>
</html>
