<script type="text/babel">
// ─── primitives.jsx ─────────────────────────────────────────────────────────
// Aurora blobs, Sparkles, Logo, ThemeToggle, useTheme, useIntersection
// Exposed on `window` so other scripts share scope.

const { useState, useEffect, useRef, useCallback, useMemo } = React;

// ─── HOOKS ──────────────────────────────────────────────────────────────────
function useIntersection(ref, options = { threshold: 0.1 }) {
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    if (!ref.current) return;
    const obs = new IntersectionObserver(
      ([e]) => { if (e.isIntersecting) setVisible(true); },
      options
    );
    obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return visible;
}

function useTheme() {
  const getInitial = () => {
    try {
      const stored = localStorage.getItem('beanters-theme');
      if (stored === 'light' || stored === 'dark') return stored;
    } catch (e) {}
    return 'dark';
  };
  const [theme, setTheme] = useState(getInitial);
  useEffect(() => {
    document.body.setAttribute('data-theme', theme);
    try { localStorage.setItem('beanters-theme', theme); } catch (e) {}
  }, [theme]);
  const toggle = useCallback(() => {
    setTheme(t => t === 'dark' ? 'light' : 'dark');
  }, []);
  return [theme, setTheme, toggle];
}

// ─── AURORA BLOB ─────────────────────────────────────────────────────────────
// Soft, blurred gradient orbs in the Scribe AI style.
// Each blob has its own color, position, size, and float animation.
function AuroraField({ blobs }) {
  return (
    <div style={{
      position: 'absolute',
      inset: 0,
      overflow: 'hidden',
      pointerEvents: 'none',
      zIndex: 0,
    }}>
      {blobs.map((b, i) => (
        <div
          key={i}
          className="aurora-blob"
          style={{
            background: `radial-gradient(circle at 50% 50%, ${b.color} 0%, transparent 65%)`,
            width: b.size,
            height: b.size,
            top: b.top,
            left: b.left,
            right: b.right,
            bottom: b.bottom,
            animation: `${b.anim || 'float'} ${b.duration || '14s'} ease-in-out infinite`,
            animationDelay: b.delay || '0s',
          }}
        />
      ))}
    </div>
  );
}

// ─── SPARKLE ─────────────────────────────────────────────────────────────────
// 4-point AI sparkle (Scribe-style). Used as accents.
function Sparkle({ size = 14, color = 'currentColor', style = {} }) {
  return (
    <svg
      width={size}
      height={size}
      viewBox="0 0 24 24"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
      style={style}
      aria-hidden="true"
    >
      <path
        d="M12 0 L13.5 9 Q14 11 16 11.5 L24 12 L16 12.5 Q14 13 13.5 15 L12 24 L10.5 15 Q10 13 8 12.5 L0 12 L8 11.5 Q10 11 10.5 9 Z"
        fill={color}
      />
    </svg>
  );
}

function SparkleCluster({ children }) {
  return (
    <div style={{ position: 'absolute', inset: 0, pointerEvents: 'none', overflow: 'hidden' }}>
      {children}
    </div>
  );
}

function FloatingSparkles({ items }) {
  return (
    <SparkleCluster>
      {items.map((s, i) => (
        <div
          key={i}
          style={{
            position: 'absolute',
            top: s.top,
            left: s.left,
            right: s.right,
            bottom: s.bottom,
            color: s.color,
            opacity: s.opacity || 0.85,
            animation: `twinkle ${s.duration || '3s'} ease-in-out infinite`,
            animationDelay: s.delay || '0s',
            filter: s.glow ? `drop-shadow(0 0 8px ${s.color})` : 'none',
          }}
        >
          <Sparkle size={s.size || 14} color={s.color} />
        </div>
      ))}
    </SparkleCluster>
  );
}

// ─── LOGO ────────────────────────────────────────────────────────────────────
function BeantersLogo({ size = 1.25 }) {
  return (
    <span style={{
      fontFamily: 'var(--font-head)',
      fontWeight: 700,
      fontSize: `${size}rem`,
      letterSpacing: '-0.025em',
      display: 'inline-flex',
      alignItems: 'center',
      gap: '0.18em',
    }}>
      <span style={{
        background: 'linear-gradient(135deg, var(--teal) 0%, var(--magenta) 100%)',
        WebkitBackgroundClip: 'text',
        backgroundClip: 'text',
        WebkitTextFillColor: 'transparent',
      }}>bean</span>
      <span style={{ color: 'var(--text)' }}>ters</span>
      <span style={{
        display: 'inline-block',
        color: 'var(--gold)',
        animation: 'twinkle 2.5s ease-in-out infinite',
        marginLeft: '0.15em',
        marginTop: `-${size * 0.35}rem`,
      }}>
        <Sparkle size={size * 8} color="var(--gold)" />
      </span>
    </span>
  );
}

// ─── THEME TOGGLE ────────────────────────────────────────────────────────────
function ThemeToggle({ theme, onToggle }) {
  const isDark = theme === 'dark';
  return (
    <button
      onClick={onToggle}
      aria-label={`Switch to ${isDark ? 'light' : 'dark'} theme`}
      style={{
        position: 'relative',
        width: '58px',
        height: '30px',
        borderRadius: '100px',
        background: isDark
          ? 'linear-gradient(135deg, oklch(0.30 0.05 270), oklch(0.18 0.04 250))'
          : 'linear-gradient(135deg, oklch(0.85 0.10 80), oklch(0.92 0.07 60))',
        border: '1px solid var(--border-strong)',
        cursor: 'pointer',
        padding: 0,
        display: 'flex',
        alignItems: 'center',
        transition: 'background 0.4s ease',
        overflow: 'hidden',
      }}
    >
      {/* track stars (dark) or rays (light) */}
      <span style={{
        position: 'absolute',
        inset: 0,
        opacity: isDark ? 0.9 : 0,
        transition: 'opacity 0.3s',
        pointerEvents: 'none',
      }}>
        <span style={{ position:'absolute', top:'7px', left:'10px', color:'oklch(0.9 0.05 80)' }}>
          <Sparkle size={6} color="oklch(0.95 0.1 80)" />
        </span>
        <span style={{ position:'absolute', top:'14px', left:'22px', width:'2px', height:'2px', background:'white', borderRadius:'50%' }}/>
        <span style={{ position:'absolute', top:'18px', left:'14px', width:'1.5px', height:'1.5px', background:'white', borderRadius:'50%' }}/>
      </span>

      {/* thumb */}
      <span style={{
        position: 'absolute',
        top: '3px',
        left: isDark ? '3px' : 'calc(100% - 27px)',
        width: '24px',
        height: '24px',
        borderRadius: '50%',
        background: isDark
          ? 'radial-gradient(circle at 35% 30%, oklch(0.95 0.05 80) 0%, oklch(0.78 0.10 60) 70%)'
          : 'radial-gradient(circle at 35% 30%, oklch(1 0 0) 0%, oklch(0.95 0.08 80) 80%)',
        boxShadow: isDark
          ? '0 0 8px oklch(0.85 0.10 60 / 0.5), inset -3px -3px 0 oklch(0.55 0.08 60)'
          : '0 0 12px oklch(0.85 0.16 80 / 0.6)',
        transition: 'left 0.35s cubic-bezier(0.4, 0, 0.2, 1), background 0.4s, box-shadow 0.3s',
      }}/>
    </button>
  );
}

// ─── GENERIC LOGO PLACEHOLDER ───────────────────────────────────────────────
// SVG-rendered placeholder logos for the customer wall.
// Designed to look like real corporate logos so the user can swap them later.

        <text x="32" y="21" fontFamily="'Space Grotesk',sans-serif" fontSize="14" fontWeight="600" fill="currentColor" letterSpacing="-0.02em">{name}</text>
      </svg>
    ),
    telco: (
      <svg viewBox="0 0 120 32" width="100%" height="100%" fill="none">
        <rect x="6" y="9" width="14" height="14" rx="3" fill="currentColor"/>
        <text x="28" y="21" fontFamily="'Space Grotesk',sans-serif" fontSize="14" fontWeight="700" fill="currentColor" letterSpacing="-0.02em">{name}</text>
      </svg>
    ),
    gov: (
      <svg viewBox="0 0 120 32" width="100%" height="100%" fill="none">
        <path d="M14 5 L24 11 L24 23 L4 23 L4 11 Z" stroke="currentColor" strokeWidth="2" fill="none"/>
        <line x1="8" y1="14" x2="8" y2="20" stroke="currentColor" strokeWidth="2"/>
        <line x1="14" y1="14" x2="14" y2="20" stroke="currentColor" strokeWidth="2"/>
        <line x1="20" y1="14" x2="20" y2="20" stroke="currentColor" strokeWidth="2"/>
        <text x="32" y="21" fontFamily="'Space Grotesk',sans-serif" fontSize="11" fontWeight="600" fill="currentColor" letterSpacing="0.02em">{name}</text>
      </svg>
    ),
    research: (
      <svg viewBox="0 0 120 32" width="100%" height="100%" fill="none">
        <circle cx="14" cy="16" r="8" stroke="currentColor" strokeWidth="2" fill="none"/>
        <ellipse cx="14" cy="16" rx="11" ry="4" stroke="currentColor" strokeWidth="1.5" fill="none"/>
        <text x="30" y="21" fontFamily="'JetBrains Mono',monospace" fontSize="11" fontWeight="700" fill="currentColor" letterSpacing="0.04em">{name}</text>
      </svg>
    ),
    industrial: (
      <svg viewBox="0 0 120 32" width="100%" height="100%" fill="none">
        <path d="M4 23 L4 10 L11 14 L11 10 L18 14 L18 10 L25 14 L25 23 Z" fill="currentColor"/>

      </svg>
    ),
    ngo: (
      <svg viewBox="0 0 120 32" width="100%" height="100%" fill="none">

        <text x="30" y="21" fontFamily="'Space Grotesk',sans-serif" fontSize="13" fontWeight="600" fill="currentColor" fontStyle="italic">{name}</text>
      </svg>
    ),
    satellite: (
      <svg viewBox="0 0 120 32" width="100%" height="100%" fill="none">
        <circle cx="14" cy="16" r="3.5" fill="currentColor"/>
        <ellipse cx="14" cy="16" rx="10" ry="3" stroke="currentColor" strokeWidth="1.5" fill="none" transform="rotate(-25 14 16)"/>
        <ellipse cx="14" cy="16" rx="10" ry="3" stroke="currentColor" strokeWidth="1.5" fill="none" transform="rotate(25 14 16)"/>
        <text x="30" y="21" fontFamily="'Space Grotesk',sans-serif" fontSize="13" fontWeight="700" fill="currentColor" letterSpacing="0.02em">{name}</text>
      </svg>
    ),
    cloud: (
      <svg viewBox="0 0 120 32" width="100%" height="100%" fill="none">
        <path d="M8 20 C5 20 4 17 6 15 C5 12 8 9 11 11 C13 8 18 8 19 13 C24 12 24 18 21 20 Z" stroke="currentColor" strokeWidth="2" fill="none"/>
        <text x="30" y="21" fontFamily="'Space Grotesk',sans-serif" fontSize="14" fontWeight="600" fill="currentColor" letterSpacing="-0.02em">{name}</text>
      </svg>
    ),
  };
  return (
    <div style={{
      width: '100%', height: '36px', color: 'var(--text-mid)',

    onMouseEnter={e => { e.currentTarget.style.opacity = 1; e.currentTarget.style.color = 'var(--text)'; }}
    onMouseLeave={e => { e.currentTarget.style.opacity = 0.75; e.currentTarget.style.color = 'var(--text-mid)'; }}

      {shapes[kind] || shapes.telco}

}

// expose for other scripts
Object.assign(window, {
  useIntersection,
  useTheme,
  AuroraField,
  Sparkle,
  FloatingSparkles,
  BeantersLogo,
  ThemeToggle,
  PlaceholderLogo,
});
</script>
<script type="text/babel">
// ─── header-hero.jsx ────────────────────────────────────────────────────────
// Nav, Hero with aurora field, animated CLI, Networks ribbon

// ─── NAV ────────────────────────────────────────────────────────────────────
function Nav({ theme, onThemeToggle }) {
  const [scrolled, setScrolled] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);

  useEffect(() => {
    const h = () => setScrolled(window.scrollY > 30);
    window.addEventListener('scroll', h);
    return () => window.removeEventListener('scroll', h);
  }, []);

  const links = [
    { id: 'products',  label: 'Products' },
    { id: 'solutions', label: 'Solutions' },
    { id: 'tech',      label: 'Technology' },
    { id: 'mission',   label: 'Mission' },
    { id: 'speaking',  label: 'Speaking' },

      display: 'flex',

      background: scrolled
        ? 'color-mix(in oklab, var(--bg) 80%, transparent)'
        : 'transparent',
      backdropFilter: scrolled ? 'blur(18px) saturate(140%)' : 'none',
      WebkitBackdropFilter: scrolled ? 'blur(18px) saturate(140%)' : 'none',
      borderBottom: scrolled ? '1px solid var(--border)' : '1px solid transparent',

    }}>

        <BeantersLogo size={1.4}/>

      <div className="desktop-only" style={{ display: 'flex', gap: '2.5rem', alignItems: 'center' }}>
        {links.map(l => (
          <a key={l.label} href={l.href || `#${l.id}`} style={{

          onMouseLeave={e => e.target.style.color = l.href ? 'var(--teal)' : 'var(--text-mid)'}

      <div style={{ display: 'flex', gap: '0.75rem', alignItems: 'center' }}>

        <a href="#contact" className="btn btn-primary" style={{

function CLIWindow({ animate = true }) {
  const [shown, setShown] = useState(animate ? 0 : CLI_LINES.length);

  useEffect(() => {
    if (!animate) { setShown(CLI_LINES.length); return; }
    setShown(0);
    let i = 0;
    const iv = setInterval(() => {
      i++;
      setShown(i);
      if (i >= CLI_LINES.length) clearInterval(iv);
    }, 220);
    return () => clearInterval(iv);
  }, [animate]);

  const colorFor = {
    comment: 'var(--text-dim)',
    cmd:     'var(--teal)',
    arg:     'var(--aqua)',
    out:     'var(--text-mid)',
    ai:      'var(--magenta)',
    blank:   'transparent',
    success: 'var(--gold)',
  };

  return (
    <div style={{
      background: 'var(--cli-bg)',
      border: '1px solid var(--border-strong)',
      borderRadius: 'var(--radius-md)',
      overflow: 'hidden',
      boxShadow: 'var(--shadow-card), 0 0 0 1px color-mix(in oklab, var(--teal) 22%, transparent), 0 30px 100px -40px color-mix(in oklab, var(--magenta) 60%, transparent)',

      fontSize: '0.78rem',
      lineHeight: 1.75,
      position: 'relative',

          marginLeft: 'auto',
          color: 'oklch(0.65 0.02 270)',
          fontSize: '0.66rem',
          fontFamily: 'var(--font-mono)',

              ? <><span style={{ color: 'oklch(0.55 0.02 270)' }}>{'$ '}</span>{l.text}</>
              : (l.text || '\u00A0')}

        ))}
        {shown < CLI_LINES.length && (

            animation: 'blink 0.9s steps(1) infinite',

    </div>
  );
}

<script type="text/babel">
// ─── animations.jsx ────────────────────────────────────────────────────────

// animations.jsx
// Reusable animation starter: Stage, Timeline, Sprite, easing helpers.
// Usage (in an HTML file that loads React + Babel):
//
//   <Stage width={1280} height={720} duration={10} background="#f6f4ef">
//     <MyScene />
//   </Stage>
//
// Inside <Stage>, any child can call useTime() to read the current
// playhead (seconds). Or wrap content in <Sprite start={1} end={4}>...</Sprite>
// to only render during that window -- children receive a `localTime` and
// `progress` via the useSprite() hook.
//
// ─────────────────────────────────────────────────────────────────────────────

// ── Easing functions (hand-rolled, Popmotion-style) ─────────────────────────
// All easings take t ∈ [0,1] and return eased t ∈ [0,1] (may overshoot for back/elastic).
const Easing = {
  linear: (t) => t,

  // Quad
  easeInQuad:    (t) => t * t,
  easeOutQuad:   (t) => t * (2 - t),
  easeInOutQuad: (t) => (t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t),

  // Cubic
  easeInCubic:    (t) => t * t * t,
  easeOutCubic:   (t) => (--t) * t * t + 1,
  easeInOutCubic: (t) => (t < 0.5 ? 4 * t * t * t : (t - 1) * (2 * t - 2) * (2 * t - 2) + 1),

  // Quart
  easeInQuart:    (t) => t * t * t * t,
  easeOutQuart:   (t) => 1 - (--t) * t * t * t,
  easeInOutQuart: (t) => (t < 0.5 ? 8 * t * t * t * t : 1 - 8 * (--t) * t * t * t),

  // Expo
  easeInExpo:  (t) => (t === 0 ? 0 : Math.pow(2, 10 * (t - 1))),
  easeOutExpo: (t) => (t === 1 ? 1 : 1 - Math.pow(2, -10 * t)),
  easeInOutExpo: (t) => {
    if (t === 0) return 0;
    if (t === 1) return 1;
    if (t < 0.5) return 0.5 * Math.pow(2, 20 * t - 10);
    return 1 - 0.5 * Math.pow(2, -20 * t + 10);
  },

  // Sine
  easeInSine:    (t) => 1 - Math.cos((t * Math.PI) / 2),
  easeOutSine:   (t) => Math.sin((t * Math.PI) / 2),
  easeInOutSine: (t) => -(Math.cos(Math.PI * t) - 1) / 2,

  // Back (overshoot)
  easeOutBack: (t) => {
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  },
  easeInBack: (t) => {
    const c1 = 1.70158, c3 = c1 + 1;
    return c3 * t * t * t - c1 * t * t;
  },
  easeInOutBack: (t) => {
    const c1 = 1.70158, c2 = c1 * 1.525;
    return t < 0.5
      ? (Math.pow(2 * t, 2) * ((c2 + 1) * 2 * t - c2)) / 2
      : (Math.pow(2 * t - 2, 2) * ((c2 + 1) * (t * 2 - 2) + c2) + 2) / 2;
  },

  // Elastic
  easeOutElastic: (t) => {
    const c4 = (2 * Math.PI) / 3;
    if (t === 0) return 0;
    if (t === 1) return 1;
    return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1;
  },
};

// ── Core interpolation helpers ──────────────────────────────────────────────

// Clamp a value to [min, max]
const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

// interpolate([0, 0.5, 1], [0, 100, 50], ease?) -> fn(t)
// Popmotion-style: linearly maps t across input keyframes to output values,
// with optional easing per segment (single fn or array of fns).
function interpolate(input, output, ease = Easing.linear) {
  return (t) => {
    if (t <= input[0]) return output[0];
    if (t >= input[input.length - 1]) return output[output.length - 1];
    for (let i = 0; i < input.length - 1; i++) {
      if (t >= input[i] && t <= input[i + 1]) {
        const span = input[i + 1] - input[i];
        const local = span === 0 ? 0 : (t - input[i]) / span;
        const easeFn = Array.isArray(ease) ? (ease[i] || Easing.linear) : ease;
        const eased = easeFn(local);
        return output[i] + (output[i + 1] - output[i]) * eased;
      }
    }
    return output[output.length - 1];
  };
}

// animate({from, to, start, end, ease})(t) — simpler single-segment tween.
// Returns `from` before `start`, `to` after `end`.
function animate({ from = 0, to = 1, start = 0, end = 1, ease = Easing.easeInOutCubic }) {
  return (t) => {
    if (t <= start) return from;
    if (t >= end) return to;
    const local = (t - start) / (end - start);
    return from + (to - from) * ease(local);
  };
}

// ── Timeline context ────────────────────────────────────────────────────────

const TimelineContext = React.createContext({ time: 0, duration: 10, playing: false });

const useTime = () => React.useContext(TimelineContext).time;
const useTimeline = () => React.useContext(TimelineContext);

// ── Sprite ──────────────────────────────────────────────────────────────────
// Renders children only when the playhead is inside [start, end]. Provides
// a sub-context with `localTime` (seconds since start) and `progress` (0..1).
//
//   <Sprite start={2} end={5}>
//     {({ localTime, progress }) => <Thing x={progress * 100} />}
//   </Sprite>
//
// Or as a plain wrapper — children can call useSprite() themselves.

const SpriteContext = React.createContext({ localTime: 0, progress: 0, duration: 0 });
const useSprite = () => React.useContext(SpriteContext);

function Sprite({ start = 0, end = Infinity, children, keepMounted = false }) {
  const { time } = useTimeline();
  const visible = time >= start && time <= end;
  if (!visible && !keepMounted) return null;

  const duration = end - start;
  const localTime = Math.max(0, time - start);
  const progress = duration > 0 && isFinite(duration)
    ? clamp(localTime / duration, 0, 1)
    : 0;

  const value = { localTime, progress, duration, visible };

  return (
    <SpriteContext.Provider value={value}>
      {typeof children === 'function' ? children(value) : children}
    </SpriteContext.Provider>
  );
}

// ── Sample sprite components ────────────────────────────────────────────────

// TextSprite: fades/slides text in on entry, holds, then fades out on exit.
// Props: text, x, y, size, color, font, entryDur, exitDur, align
function TextSprite({
  text,
  x = 0, y = 0,
  size = 48,
  color = '#111',
  font = 'Inter, system-ui, sans-serif',
  weight = 600,
  entryDur = 0.45,
  exitDur = 0.35,
  entryEase = Easing.easeOutBack,
  exitEase = Easing.easeInCubic,
  align = 'left',
  letterSpacing = '-0.01em',
}) {
  const { localTime, duration } = useSprite();
  const exitStart = Math.max(0, duration - exitDur);

  let opacity = 1;
  let ty = 0;

  if (localTime < entryDur) {
    const t = entryEase(clamp(localTime / entryDur, 0, 1));
    opacity = t;
    ty = (1 - t) * 16;
  } else if (localTime > exitStart) {
    const t = exitEase(clamp((localTime - exitStart) / exitDur, 0, 1));
    opacity = 1 - t;
    ty = -t * 8;
  }

  const translateX = align === 'center' ? '-50%' : align === 'right' ? '-100%' : '0';

  return (
    <div style={{
      position: 'absolute',
      left: x, top: y,
      transform: `translate(${translateX}, ${ty}px)`,
      opacity,
      fontFamily: font,
      fontSize: size,
      fontWeight: weight,
      color,
      letterSpacing,
      whiteSpace: 'pre',
      lineHeight: 1.1,
      willChange: 'transform, opacity',
    }}>
      {text}
    </div>
  );
}

// ImageSprite: scales + fades in; optional Ken Burns drift during hold.
function ImageSprite({
  src,
  x = 0, y = 0,
  width = 400, height = 300,
  entryDur = 0.6,
  exitDur = 0.4,
  kenBurns = false,
  kenBurnsScale = 1.08,
  radius = 12,
  fit = 'cover',
  placeholder = null, // {label: string} for striped placeholder
}) {
  const { localTime, duration } = useSprite();
  const exitStart = Math.max(0, duration - exitDur);

  let opacity = 1;
  let scale = 1;

  if (localTime < entryDur) {
    const t = Easing.easeOutCubic(clamp(localTime / entryDur, 0, 1));
    opacity = t;
    scale = 0.96 + 0.04 * t;
  } else if (localTime > exitStart) {
    const t = Easing.easeInCubic(clamp((localTime - exitStart) / exitDur, 0, 1));
    opacity = 1 - t;
    scale = (kenBurns ? kenBurnsScale : 1) + 0.02 * t;
  } else if (kenBurns) {
    const holdSpan = exitStart - entryDur;
    const holdT = holdSpan > 0 ? (localTime - entryDur) / holdSpan : 0;
    scale = 1 + (kenBurnsScale - 1) * holdT;
  }

  const content = placeholder ? (
    <div style={{
      width: '100%', height: '100%',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      background: 'repeating-linear-gradient(135deg, #e9e6df 0 10px, #dcd8cf 10px 20px)',
      color: '#6b6458',
      fontFamily: 'JetBrains Mono, ui-monospace, monospace',
      fontSize: 13,
      letterSpacing: '0.04em',
      textTransform: 'uppercase',
    }}>
      {placeholder.label || 'image'}
    </div>
  ) : (
    <img src={src} alt="" style={{ width: '100%', height: '100%', objectFit: fit, display: 'block' }} />
  );

  return (
    <div style={{
      position: 'absolute',
      left: x, top: y,
      width, height,
      opacity,
      transform: `scale(${scale})`,
      transformOrigin: 'center',
      borderRadius: radius,
      overflow: 'hidden',
      willChange: 'transform, opacity',
    }}>
      {content}
    </div>
  );
}

// RectSprite: simple rectangle that animates position/size/color via props.
// Useful demo primitive — takes a `render` fn for per-frame customization.
function RectSprite({
  x = 0, y = 0,
  width = 100, height = 100,
  color = '#111',
  radius = 8,
  entryDur = 0.4,
  exitDur = 0.3,
  render, // optional: (ctx) => style overrides
}) {
  const spriteCtx = useSprite();
  const { localTime, duration } = spriteCtx;
  const exitStart = Math.max(0, duration - exitDur);

  let opacity = 1;
  let scale = 1;

  if (localTime < entryDur) {
    const t = Easing.easeOutBack(clamp(localTime / entryDur, 0, 1));
    opacity = clamp(localTime / entryDur, 0, 1);
    scale = 0.4 + 0.6 * t;
  } else if (localTime > exitStart) {
    const t = Easing.easeInQuad(clamp((localTime - exitStart) / exitDur, 0, 1));
    opacity = 1 - t;
    scale = 1 - 0.15 * t;
  }

  const overrides = render ? render(spriteCtx) : {};

  return (
    <div style={{
      position: 'absolute',
      left: x, top: y,
      width, height,
      background: color,
      borderRadius: radius,
      opacity,
      transform: `scale(${scale})`,
      transformOrigin: 'center',
      willChange: 'transform, opacity',
      ...overrides,
    }} />
  );
}


function Stage({
  width = 1280,
  height = 720,
  duration = 10,
  background = '#f6f4ef',
  fps = 60,
  loop = true,
  autoplay = true,
  persistKey = 'animstage',
  children,
}) {
  const [time, setTime] = React.useState(() => {
    try {
      const v = parseFloat(localStorage.getItem(persistKey + ':t') || '0');
      return isFinite(v) ? clamp(v, 0, duration) : 0;
    } catch { return 0; }
  });
  const [playing, setPlaying] = React.useState(autoplay);
  const [hoverTime, setHoverTime] = React.useState(null);
  const [scale, setScale] = React.useState(1);

  const stageRef = React.useRef(null);
  const canvasRef = React.useRef(null);
  const rafRef = React.useRef(null);
  const lastTsRef = React.useRef(null);

  // Persist playhead
  React.useEffect(() => {
    try { localStorage.setItem(persistKey + ':t', String(time)); } catch {}
  }, [time, persistKey]);

  // Auto-scale to fit viewport
  React.useEffect(() => {
    if (!stageRef.current) return;
    const el = stageRef.current;
    const measure = () => {
      const barH = 44; // playback bar height
      const s = Math.min(
        el.clientWidth / width,
        (el.clientHeight - barH) / height
      );
      setScale(Math.max(0.05, s));
    };
    measure();
    const ro = new ResizeObserver(measure);
    ro.observe(el);
    window.addEventListener('resize', measure);
    return () => {
      ro.disconnect();
      window.removeEventListener('resize', measure);
    };
  }, [width, height]);

  // Animation loop
  React.useEffect(() => {
    if (!playing) {
      lastTsRef.current = null;
      return;
    }
    const step = (ts) => {
      if (lastTsRef.current == null) lastTsRef.current = ts;
      const dt = (ts - lastTsRef.current) / 1000;
      lastTsRef.current = ts;
      setTime((t) => {
        let next = t + dt;
        if (next >= duration) {
          if (loop) next = next % duration;
          else { next = duration; setPlaying(false); }
        }
        return next;
      });
      rafRef.current = requestAnimationFrame(step);
    };
    rafRef.current = requestAnimationFrame(step);
    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      lastTsRef.current = null;
    };
  }, [playing, duration, loop]);

  // Keyboard: space = play/pause, ← → = seek
  React.useEffect(() => {
    const onKey = (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      if (e.code === 'Space') {
        e.preventDefault();
        setPlaying(p => !p);
      } else if (e.code === 'ArrowLeft') {
        setTime(t => clamp(t - (e.shiftKey ? 1 : 0.1), 0, duration));
      } else if (e.code === 'ArrowRight') {
        setTime(t => clamp(t + (e.shiftKey ? 1 : 0.1), 0, duration));
      } else if (e.key === '0' || e.code === 'Home') {
        setTime(0);
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [duration]);

  const displayTime = hoverTime != null ? hoverTime : time;

  const ctxValue = React.useMemo(
    () => ({ time: displayTime, duration, playing, setTime, setPlaying }),
    [displayTime, duration, playing]
  );

  return (
    <div
      ref={stageRef}
      style={{
        position: 'absolute', inset: 0,
        display: 'flex', flexDirection: 'column',
        alignItems: 'center',
        background: '#0a0a0a',
        fontFamily: 'Inter, system-ui, sans-serif',
      }}
    >
      {/* Canvas area — vertically centered in remaining space */}
      <div style={{
        flex: 1,
        width: '100%',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        overflow: 'hidden',
        minHeight: 0,
      }}>
        <div
          ref={canvasRef}
          style={{
            width, height,
            background,
            position: 'relative',
            transform: `scale(${scale})`,
            transformOrigin: 'center',
            flexShrink: 0,
            boxShadow: '0 20px 60px rgba(0,0,0,0.4)',
            overflow: 'hidden',
          }}
        >
          <TimelineContext.Provider value={ctxValue}>
            {children}
          </TimelineContext.Provider>
        </div>
      </div>

      {/* Playback bar — stacked below canvas, never overlapping */}
      <PlaybackBar
        time={displayTime}
        actualTime={time}
        duration={duration}
        playing={playing}
        onPlayPause={() => setPlaying(p => !p)}
        onReset={() => { setTime(0); }}
        onSeek={(t) => setTime(t)}
        onHover={(t) => setHoverTime(t)}
      />
    </div>
  );
}

// ── Playback bar ────────────────────────────────────────────────────────────
// Play/pause, return-to-begin, scrub track, time display.
// Uses fixed-width time fields so layout doesn't thrash.

function PlaybackBar({ time, duration, playing, onPlayPause, onReset, onSeek, onHover }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);

  const timeFromEvent = React.useCallback((e) => {
    const rect = trackRef.current.getBoundingClientRect();
    const x = clamp((e.clientX - rect.left) / rect.width, 0, 1);
    return x * duration;
  }, [duration]);

  const onTrackMove = (e) => {
    if (!trackRef.current) return;
    const t = timeFromEvent(e);
    if (dragging) {
      onSeek(t);
    } else {
      onHover(t);
    }
  };

  const onTrackLeave = () => {
    if (!dragging) onHover(null);
  };

  const onTrackDown = (e) => {
    setDragging(true);
    const t = timeFromEvent(e);
    onSeek(t);
    onHover(null);
  };

  React.useEffect(() => {
    if (!dragging) return;
    const onUp = () => setDragging(false);
    const onMove = (e) => {
      if (!trackRef.current) return;
      const t = timeFromEvent(e);
      onSeek(t);
    };
    window.addEventListener('mouseup', onUp);
    window.addEventListener('mousemove', onMove);
    return () => {
      window.removeEventListener('mouseup', onUp);
      window.removeEventListener('mousemove', onMove);
    };
  }, [dragging, timeFromEvent, onSeek]);

  const pct = duration > 0 ? (time / duration) * 100 : 0;
  const fmt = (t) => {
    const total = Math.max(0, t);
    const m = Math.floor(total / 60);
    const s = Math.floor(total % 60);
    const cs = Math.floor((total * 100) % 100);
    return `${String(m).padStart(1, '0')}:${String(s).padStart(2, '0')}.${String(cs).padStart(2, '0')}`;
  };

  const mono = 'JetBrains Mono, ui-monospace, SFMono-Regular, monospace';

  return (
    <div style={{
      display: 'flex', alignItems: 'center', gap: 12,
      padding: '8px 16px',
      background: 'rgba(20,20,20,0.92)',
      borderTop: '1px solid rgba(255,255,255,0.08)',
      width: '100%',
      maxWidth: 680,
      alignSelf: 'center',

      borderRadius: 8,
      color: '#f6f4ef',
      fontFamily: 'Inter, system-ui, sans-serif',
      userSelect: 'none',
      flexShrink: 0,
    }}>
      <IconButton onClick={onReset} title="Return to start (0)">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M3 2v10M12 2L5 7l7 5V2z" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round"/>
        </svg>
      </IconButton>
      <IconButton onClick={onPlayPause} title="Play/pause (space)">
        {playing ? (
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <rect x="3" y="2" width="3" height="10" fill="currentColor"/>
            <rect x="8" y="2" width="3" height="10" fill="currentColor"/>
          </svg>
        ) : (
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M3 2l9 5-9 5V2z" fill="currentColor"/>
          </svg>
        )}
      </IconButton>

      {/* Current time: fixed width so it doesn't thrash */}
      <div style={{
        fontFamily: mono,
        fontSize: 12,
        fontVariantNumeric: 'tabular-nums',
        width: 64, textAlign: 'right',
        color: '#f6f4ef',
      }}>
        {fmt(time)}
      </div>

      {/* Scrub track */}
      <div
        ref={trackRef}
        onMouseMove={onTrackMove}
        onMouseLeave={onTrackLeave}
        onMouseDown={onTrackDown}
        style={{
          flex: 1,
          height: 22,
          position: 'relative',
          cursor: 'pointer',
          display: 'flex', alignItems: 'center',
        }}
      >
        <div style={{
          position: 'absolute',
          left: 0, right: 0, height: 4,
          background: 'rgba(255,255,255,0.12)',
          borderRadius: 2,
        }}/>
        <div style={{
          position: 'absolute',
          left: 0, width: `${pct}%`, height: 4,
          background: 'oklch(72% 0.12 250)',
          borderRadius: 2,
        }}/>
        <div style={{
          position: 'absolute',
          left: `${pct}%`, top: '50%',
          width: 12, height: 12,
          marginLeft: -6, marginTop: -6,
          background: '#fff',
          borderRadius: 6,
          boxShadow: '0 2px 4px rgba(0,0,0,0.4)',
        }}/>
      </div>

      {/* Duration: fixed width */}
      <div style={{
        fontFamily: mono,
        fontSize: 12,
        fontVariantNumeric: 'tabular-nums',
        width: 64, textAlign: 'left',
        color: 'rgba(246,244,239,0.55)',
      }}>
        {fmt(duration)}
      </div>
    </div>
  );
}

function IconButton({ children, onClick, title }) {
  const [hover, setHover] = React.useState(false);
  return (
    <button
      onClick={onClick}
      title={title}
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      style={{
        width: 28, height: 28,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        background: hover ? 'rgba(255,255,255,0.12)' : 'rgba(255,255,255,0.04)',
        border: '1px solid rgba(255,255,255,0.1)',
        borderRadius: 6,
        color: '#f6f4ef',
        cursor: 'pointer',
        padding: 0,
        transition: 'background 120ms',
      }}
    >
      {children}
    </button>
  );
}


Object.assign(window, {
  Easing, interpolate, animate, clamp,
  TimelineContext, useTime, useTimeline,
  Sprite, SpriteContext, useSprite,
  TextSprite, ImageSprite, RectSprite,
  Stage, PlaybackBar,
});


</script>
<script type="text/babel">
// ─── scene.jsx (6G Fusion) ──────────────────────────────────────────────────
// scene.jsx — 6G Base Station Fusion animation
// Two forces (Cloud-Native + AI-Native) converge on a standard 3GPP 6G base
// station and fuse it into a smart, AI-driven 6G node with a brain and limbs.

// ── Color palette (oklch) ───────────────────────────────────────────────────
const C = {
  bg0:        '#02060f',
  bg1:        '#0a1326',
  gridLine:   'oklch(55% 0.06 230 / 0.35)',
  oldMetal0:  '#9aa3ad',
  oldMetal1:  '#5a6470',
  oldMetal2:  '#2b323d',
  oldAccent:  'oklch(72% 0.16 150)', // standard green status LED
  // Cloud force — cyan/azure
  cloud0:     'oklch(85% 0.12 230)',
  cloud1:     'oklch(72% 0.18 230)',
  cloud2:     'oklch(55% 0.20 240)',
  // AI force — violet/magenta
  ai0:        'oklch(85% 0.14 310)',
  ai1:        'oklch(70% 0.22 310)',
  ai2:        'oklch(55% 0.24 320)',
  // New station — chrome + cyan accents + violet brain
  chromeHi:   'oklch(94% 0.02 230)',
  chromeMid:  'oklch(72% 0.03 230)',
  chromeLo:   'oklch(32% 0.04 240)',
  accent:     'oklch(80% 0.18 200)',
  accent2:    'oklch(75% 0.22 290)',
};

const FusionThemeCtx = React.createContext('dark');
const useFusionTheme = () => React.useContext(FusionThemeCtx);

// ── Reusable filters (glow, etc) ────────────────────────────────────────────
function SceneDefs() {
  const ft = useFusionTheme();
  const isLight = ft === 'light';
  return (
    <defs>
      <filter id="glowSoft" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="4" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="glowStrong" x="-100%" y="-100%" width="300%" height="300%">
        <feGaussianBlur stdDeviation="10" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="cyanGlow" x="-100%" y="-100%" width="300%" height="300%">
        <feGaussianBlur stdDeviation="3" result="b"/>
        <feFlood floodColor={C.accent} result="c"/>
        <feComposite in="c" in2="b" operator="in" result="cb"/>
        <feMerge><feMergeNode in="cb"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>

      <radialGradient id="bgVignette" cx="50%" cy="55%" r="70%">

        <stop offset="100%" stopColor={isLight ? "rgba(160,185,230,0.25)" : "rgba(0,0,0,0.95)"}/>

      <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">

        <stop offset="100%" stopColor={isLight ? "rgba(80,110,200,0.12)" : "rgba(20,40,80,0.5)"}/>

      <linearGradient id="cloudBeam" x1="0" y1="0.5" x2="1" y2="0.5">
        <stop offset="0%"  stopColor={C.cloud2} stopOpacity="0"/>
        <stop offset="50%" stopColor={C.cloud0} stopOpacity="1"/>
        <stop offset="100%" stopColor={C.cloud1} stopOpacity="0.9"/>
      </linearGradient>
      <linearGradient id="aiBeam" x1="1" y1="0.5" x2="0" y2="0.5">
        <stop offset="0%"  stopColor={C.ai2} stopOpacity="0"/>
        <stop offset="50%" stopColor={C.ai0} stopOpacity="1"/>
        <stop offset="100%" stopColor={C.ai1} stopOpacity="0.9"/>
      </linearGradient>

      <linearGradient id="chromeBody" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"  stopColor={C.chromeHi}/>
        <stop offset="35%" stopColor={C.chromeMid}/>
        <stop offset="55%" stopColor={C.chromeLo}/>
        <stop offset="100%" stopColor={C.chromeMid}/>
      </linearGradient>
      <linearGradient id="chromeSide" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"  stopColor={C.chromeLo}/>
        <stop offset="50%" stopColor={C.chromeHi}/>
        <stop offset="100%" stopColor={C.chromeLo}/>
      </linearGradient>

      <radialGradient id="brainGrad" cx="45%" cy="35%" r="65%">
        <stop offset="0%"  stopColor="oklch(95% 0.08 290)" stopOpacity="0.95"/>
        <stop offset="50%" stopColor="oklch(75% 0.22 290)" stopOpacity="0.6"/>
        <stop offset="100%" stopColor="oklch(40% 0.20 280)" stopOpacity="0.15"/>
      </radialGradient>

      <linearGradient id="oldMetalGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stopColor={C.oldMetal2}/>
        <stop offset="50%" stopColor={C.oldMetal0}/>
        <stop offset="100%" stopColor={C.oldMetal2}/>
      </linearGradient>
    </defs>
  );
}

// ── Background: deep tech void with grid + horizon ─────────────────────────
function Background() {
  const t = useTime();
  const ft = useFusionTheme();
  const isLight = ft === 'light';
  const bgFill    = isLight ? '#f0f5ff' : C.bg0;
  const gridColor = isLight ? 'oklch(45% 0.14 230 / 0.35)' : C.gridLine;
  const starFill  = isLight ? 'rgba(30,50,140,0.5)' : 'white';
  const starOpMul = isLight ? 0.22 : 0.18;
  return (
    <g>
      <rect x="0" y="0" width="1280" height="720" fill={bgFill}/>
      {/* perspective floor grid */}
      <g opacity="0.55">
        {Array.from({ length: 18 }).map((_, i) => {
          const y = 500 + i * 14 + (i*i)*0.6;
          if (y > 720) return null;
          return <line key={'h'+i} x1="0" y1={y} x2="1280" y2={y}
            stroke={gridColor} strokeWidth="0.6"/>;
        })}
        {Array.from({ length: 21 }).map((_, i) => {
          const px = i / 20;
          const x0 = 640;
          const x1 = px * 1280;
          return <line key={'v'+i} x1={x0} y1="500" x2={x1} y2="720"
            stroke={gridColor} strokeWidth="0.6"/>;
        })}
      </g>
      <rect x="0" y="500" width="1280" height="220" fill="url(#floorGrad)"/>
      <rect x="0" y="0" width="1280" height="720" fill="url(#bgVignette)"/>

      {/* drifting "stars" / particles */}
      {Array.from({ length: 60 }).map((_, i) => {
        const seed = i * 137.5;
        const x = (seed % 1280);
        const y = ((seed * 1.7) % 460);
        const tw = 0.4 + 0.6 * Math.abs(Math.sin(t * 0.8 + i));
        return <circle key={i} cx={x} cy={y} r={0.6 + (i % 3) * 0.3}
                       fill={starFill} opacity={starOpMul * tw}/>;
      })}
    </g>
  );
}

// ── Old 3GPP-style base station (gNodeB sector site) ────────────────────────
function OldBaseStation({ cx, cy, opacity, scale = 1, shakeAmp = 0, dissolve = 0 }) {
  const t = useTime();
  const sx = shakeAmp ? Math.sin(t * 60) * shakeAmp : 0;
  const sy = shakeAmp ? Math.cos(t * 55) * shakeAmp * 0.6 : 0;
  // dissolve 0..1: pieces float up & fade
  const d = dissolve;
  const drift = d * 60;
  const op = opacity * (1 - d * 0.85);

  return (
    <g transform={`translate(${cx + sx}, ${cy + sy}) scale(${scale})`} opacity={op}>
      {/* ground shadow */}
      <ellipse cx="0" cy="0" rx="90" ry="9" fill="rgba(0,0,0,0.55)"/>

      {/* equipment cabinet */}
      <g transform={`translate(0, ${d * 5})`}>
        <rect x="-44" y="-46" width="88" height="46" fill="url(#oldMetalGrad)" stroke={C.oldMetal2} strokeWidth="1"/>
        <rect x="-40" y="-42" width="80" height="38" fill={C.oldMetal2}/>
        {/* status LEDs */}

// ── Cloud-Native force (incoming from the LEFT) ─────────────────────────────
function CloudForce({ x0, x1, y, intensity, t, converge }) {
  // intensity 0..1, converge 0..1 — head of stream moves toward (x1, y)
  // head x progresses from x0 → x1 as converge goes 0→1
  const headX = x0 + (x1 - x0) * converge;
  return (
    <g opacity={intensity}>
      {/* large translucent cloud blob anchor */}
      <g transform={`translate(${x0 - 40}, ${y})`}>
        <ellipse cx="0" cy="0" rx={130 * intensity} ry={90 * intensity}
                 fill={C.cloud2} opacity="0.18" filter="url(#glowStrong)"/>
        <ellipse cx="-30" cy="-15" rx={70 * intensity} ry={55 * intensity}
                 fill={C.cloud1} opacity="0.22" filter="url(#glowSoft)"/>
        <ellipse cx="30" cy="10" rx={60 * intensity} ry={45 * intensity}
                 fill={C.cloud0} opacity="0.28" filter="url(#glowSoft)"/>
      </g>

      {/* beam shaft */}
      <path
        d={`M ${x0} ${y} Q ${(x0 + headX) / 2} ${y + Math.sin(t * 3) * 18} ${headX} ${y}`}
        stroke="url(#cloudBeam)" strokeWidth={5 + intensity * 6} strokeLinecap="round"
        fill="none" filter="url(#glowSoft)"/>

      {/* streaming hex 'container' particles along the beam */}
      {Array.from({ length: 14 }).map((_, i) => {
        const phase = ((t * 0.7) + i / 14) % 1;
        const px = x0 + (headX - x0) * phase;
        const wob = Math.sin(t * 2 + i) * 14 * (1 - phase * 0.5);
        const py = y + wob;
        const op = Math.sin(phase * Math.PI) * intensity;
        return (
          <g key={i} transform={`translate(${px}, ${py}) rotate(${i * 25 + t * 30})`}
             opacity={op}>
            <polygon points="0,-8 7,-4 7,4 0,8 -7,4 -7,-4"
                     fill="none" stroke={C.cloud0} strokeWidth="1.4"/>
            <polygon points="0,-4 3.5,-2 3.5,2 0,4 -3.5,2 -3.5,-2"
                     fill={C.cloud0} opacity="0.7"/>
          </g>
        );
      })}

      {/* label */}
      <g transform={`translate(${x0 - 10}, ${y - 190})`} opacity={intensity}>
        <rect x="-4" y="-22" width="232" height="34" rx="2"
              fill="rgba(8,18,38,0.6)" stroke={C.cloud1} strokeWidth="1"/>
        <circle cx="14" cy="-5" r="4" fill={C.cloud0} filter="url(#glowSoft)"/>
        <text x="30" y="-1" fontSize="20" fontWeight="700" fill={C.cloud0}
              fontFamily="Inter, sans-serif" letterSpacing="0.14em">CLOUD-NATIVE</text>
        <text x="30" y="11" fontSize="9" fill={C.cloud1}
              fontFamily="JetBrains Mono, monospace" letterSpacing="0.18em">CONTAINERS · K8S · CI/CD</text>
      </g>
    </g>
  );
}

// ── AI-Native force (incoming from the RIGHT) ───────────────────────────────

    <g opacity={intensity}>

// ── Fusion flash + particle burst at center ─────────────────────────────────
function FusionBurst({ cx, cy, intensity, t }) {
  if (intensity <= 0) return null;
  const flash = intensity;
  return (
    <g>
      {/* central white-hot flash */}
      <circle cx={cx} cy={cy} r={40 + flash * 240} fill="white"
              opacity={flash * 0.85} filter="url(#glowStrong)"/>
      <circle cx={cx} cy={cy} r={20 + flash * 120} fill={C.accent}
              opacity={flash * 0.7} filter="url(#glowStrong)"/>
      <circle cx={cx} cy={cy} r={10 + flash * 60} fill={C.accent2}
              opacity={flash * 0.7} filter="url(#glowStrong)"/>

      {/* shockwave rings */}
      {[0, 0.25, 0.5].map((delay, k) => {
        const local = clamp(intensity - delay, 0, 1);
        if (local <= 0) return null;
        const r = local * 360;
        return (
          <circle key={k} cx={cx} cy={cy} r={r} fill="none"
                  stroke={k === 0 ? 'white' : k === 1 ? C.accent : C.accent2}
                  strokeWidth={3 * (1 - local)}
                  opacity={1 - local} filter="url(#glowSoft)"/>
        );
      })}

      {/* radial sparks */}
      {Array.from({ length: 36 }).map((_, i) => {
        const ang = (i / 36) * Math.PI * 2;
        const r = 60 + intensity * 260 + (i % 4) * 18;
        const px = cx + Math.cos(ang) * r;
        const py = cy + Math.sin(ang) * r;
        const isCloud = i % 2 === 0;
        return (
          <circle key={i} cx={px} cy={py} r={1.5 + (i % 3)}
                  fill={isCloud ? C.cloud0 : C.ai0}
                  opacity={1 - intensity * 0.6}
                  filter="url(#glowSoft)"/>
        );
      })}
    </g>
  );
}

// ── NEW smart 6G base station ───────────────────────────────────────────────

function NeuralBrain({ t, pulse }) {
  const nodes = [
    [-26, 4], [-12, -12], [4, -6], [18, -16], [26, 0],
    [-18, 12], [-2, 16], [14, 14], [-8, -2], [10, 2],
  ];
  return (
    <g>
      {nodes.map(([nx, ny], i) =>
        nodes.slice(i + 1).map(([mx, my], j) => {
          const d = Math.hypot(mx - nx, my - ny);
          if (d > 28) return null;
          const op = 0.18 + 0.5 * Math.abs(Math.sin(t * 1.8 + i + j));
          return (
            <line key={`${i}-${j}`} x1={nx} y1={ny} x2={mx} y2={my}
                  stroke="oklch(92% 0.10 290)" strokeWidth="0.7" opacity={op}/>
          );
        })
      )}
      {nodes.map(([nx, ny], i) => {
        const r = 1.6 + Math.abs(Math.sin(t * 2.2 + i * 0.7)) * 1.5;
        return (
          <circle key={i} cx={nx} cy={ny} r={r}
                  fill="oklch(95% 0.12 290)" opacity={0.85}
                  filter="url(#glowSoft)"/>
        );
      })}
      {/* pulse ripple */}
      <circle cx="0" cy="0" r={6 + pulse * 26} fill="none"
              stroke="oklch(90% 0.15 290)" strokeWidth={1 + pulse * 1.5}
              opacity={1 - pulse} filter="url(#glowSoft)"/>
    </g>
  );
}

function Limb({ rootX, rootY, baseAngle, length1, length2, t, phase, deploy, accent = C.accent }) {
  // deploy 0..1 controls extension; idle wobble afterward
  const wobble = Math.sin(t * 1.2 + phase) * 4;
  const ang1 = (baseAngle + wobble) * Math.PI / 180;
  const seg1Len = length1 * deploy;
  const jx = rootX + Math.cos(ang1) * seg1Len;
  const jy = rootY + Math.sin(ang1) * seg1Len;

  const bend = 32 + Math.sin(t * 1.5 + phase + 1) * 6;
  const ang2 = (baseAngle + wobble + bend) * Math.PI / 180;
  const seg2Len = length2 * deploy;
  const ex = jx + Math.cos(ang2) * seg2Len;
  const ey = jy + Math.sin(ang2) * seg2Len;

  if (deploy <= 0.01) return null;

  return (
    <g opacity={Math.min(1, deploy * 1.5)}>
      {/* shoulder */}
      <circle cx={rootX} cy={rootY} r="6" fill={C.chromeMid} stroke={C.chromeLo} strokeWidth="0.8"/>
      <circle cx={rootX} cy={rootY} r="3" fill={C.chromeLo}/>

      {/* upper segment */}
      <line x1={rootX} y1={rootY} x2={jx} y2={jy}
            stroke={C.chromeLo} strokeWidth="9" strokeLinecap="round"/>
      <line x1={rootX} y1={rootY} x2={jx} y2={jy}
            stroke="url(#chromeSide)" strokeWidth="6" strokeLinecap="round"/>
      <line x1={rootX} y1={rootY} x2={jx} y2={jy}
            stroke={accent} strokeWidth="1" strokeLinecap="round" opacity="0.7"/>

      {/* elbow joint */}
      <circle cx={jx} cy={jy} r="5" fill={C.chromeMid} stroke={C.chromeLo} strokeWidth="0.8"/>
      <circle cx={jx} cy={jy} r="2.5" fill={accent} filter="url(#glowSoft)"/>

      {/* lower segment */}
      <line x1={jx} y1={jy} x2={ex} y2={ey}
            stroke={C.chromeLo} strokeWidth="7" strokeLinecap="round"/>
      <line x1={jx} y1={jy} x2={ex} y2={ey}
            stroke="url(#chromeSide)" strokeWidth="4.5" strokeLinecap="round"/>

      {/* end-effector: modular antenna panel */}
      <g transform={`translate(${ex}, ${ey}) rotate(${(ang2 * 180 / Math.PI) + 90})`}>
        <rect x="-6" y="-14" width="12" height="28" rx="2.5"
              fill="url(#chromeBody)" stroke={C.chromeLo} strokeWidth="0.8"/>
        <rect x="-4" y="-11" width="8" height="2" fill={accent} opacity="0.9"/>
        <rect x="-4" y="-6"  width="8" height="2" fill={accent} opacity="0.6"/>
        <rect x="-4" y="-1"  width="8" height="2" fill={accent} opacity="0.9"/>
        <rect x="-4" y="4"   width="8" height="2" fill={accent} opacity="0.6"/>
        <circle cx="0" cy="-18" r="2" fill={accent} filter="url(#cyanGlow)"/>
      </g>
    </g>
  );
}

function ShineSweep({ x, y, width, height, t, active }) {
  // animated specular highlight sweeping across body — "new car" shine
  if (!active) return null;
  const period = 4;
  const phase = ((t % period) / period); // 0..1
  const sweepX = -width * 0.4 + phase * width * 1.6;
  return (
    <g clipPath="url(#bodyClip)">
      <rect x={x + sweepX - 30} y={y} width="40" height={height}
            fill="white" opacity="0.25" transform={`skewX(-18)`}
            style={{ mixBlendMode: 'screen' }}/>
      <rect x={x + sweepX - 12} y={y} width="14" height={height}
            fill="white" opacity="0.45" transform={`skewX(-18)`}
            style={{ mixBlendMode: 'screen' }}/>
    </g>
  );
}

      ].map((s, i) => {

        const py = -150 + Math.sin(a) * s.r * 0.4;

// ── MAIN SCENE — timeline orchestration ─────────────────────────────────────
function FusionScene() {
  const t = useTime();
  const CX = 640;
  const CY = 600;  // base of station sits here

  // Animation segments (seconds)
  // 0.0 – 2.5  : intro — title + old station rises in
  // 2.5 – 6.5  : two forces stream in toward the station
  // 6.5 – 8.5  : forces converge, fusion burst, old station dissolves
  // 8.5 – 11.5 : new station materializes
  // 11.5 – 16  : reveal & shine
  //
  // Old base station opacity & scale
  const oldOpacity   = animate({ from: 0, to: 1, start: 0.2, end: 1.6 })(t)
                     * (1 - animate({ from: 0, to: 1, start: 7.2, end: 8.2 })(t));
  const oldScale     = animate({ from: 0.92, to: 1, start: 0.2, end: 1.6 })(t);
  const oldShake     = animate({ from: 0, to: 4, start: 5.5, end: 7.4 })(t);
  const oldDissolve  = animate({ from: 0, to: 1, start: 6.6, end: 8.3 })(t);

  // Cloud + AI forces
  const cloudIntensity = interpolate(
    [0, 2.6, 4.0, 6.6, 7.4, 7.7],
    [0, 1.0, 1.0, 1.0, 0.0, 0.0],
    Easing.easeOutCubic
  )(t);
  const aiIntensity = cloudIntensity; // mirror

  const cloudConverge = animate({ from: 0.08, to: 0.78, start: 2.6, end: 6.8,
                                  ease: Easing.easeInOutCubic })(t);
  const aiConverge    = cloudConverge;

  // Fusion burst
  const fusionFlash = interpolate(
    [6.7, 7.2, 7.9, 8.6],
    [0,   1.0, 0.4, 0],
    Easing.easeOutCubic
  )(t);

  // New station materialize, shine, brain pulse
  const newMaterialize = animate({ from: 0, to: 1, start: 8.2, end: 11.2,
                                   ease: Easing.easeOutCubic })(t);
  const newOpacity = animate({ from: 0, to: 1, start: 8.0, end: 9.2 })(t);
  const brainPulse = 0.4 + 0.6 * Math.max(0, Math.sin(t * 1.8));
  const shineActive = t > 10.8;

  // Final banner
  const bannerOp = animate({ from: 0, to: 1, start: 12.0, end: 13.0 })(t);

  // HUD phase
  let phase = 0;
  if (t > 2.4)  phase = 1;
  if (t > 6.5)  phase = 2;
  if (t > 8.2)  phase = 3;
  if (t > 11.0) phase = 4;

  return (
    <svg width="1280" height="720" viewBox="0 0 1280 720"
         style={{ position: 'absolute', inset: 0 }}>
      <SceneDefs/>
      <Background/>

      {/* Old station (visible until fusion completes) */}
      {oldOpacity > 0.01 && (
        <OldBaseStation cx={CX} cy={CY} opacity={oldOpacity} scale={oldScale}
                        shakeAmp={oldShake} dissolve={oldDissolve}/>
      )}

      {/* Cloud-Native force — comes from the left, targets center mast */}
      {cloudIntensity > 0.01 && (
        <CloudForce
          x0={130} x1={CX - 30}
          y={CY - 130}
          intensity={cloudIntensity}
          t={t}
          converge={cloudConverge}/>
      )}

      {/* AI-Native force — comes from the right */}
      {aiIntensity > 0.01 && (
        <AIForce
          x0={1150} x1={CX + 30}
          y={CY - 130}
          intensity={aiIntensity}
          t={t}
          converge={aiConverge}/>
      )}

      {/* Fusion burst */}
      <FusionBurst cx={CX} cy={CY - 140} intensity={fusionFlash} t={t}/>

      {/* New smart station */}
      {newOpacity > 0.01 && (
        <NewBaseStation cx={CX} cy={CY} opacity={newOpacity}
                        materialize={newMaterialize}
                        brainPulse={brainPulse} shine={shineActive} t={t}/>
      )}

      {/* Final reveal banner */}
      <FinalBanner opacity={bannerOp}/>

      {/* HUD chrome */}
      <HUD phase={phase} t={t}/>
    </svg>
  );
}

// ── Mount ───────────────────────────────────────────────────────────────────
function FusionStage({ theme = 'dark' }) {
  const isLight = theme === 'light';
  return (

      <Stage width={1280} height={720} duration={16}
             background={isLight ? '#f0f5ff' : '#02060f'}
             persistKey="6g-fusion">
        <FusionScene/>

  );
}

}

    </footer>
  );
}

// ─── TWEAKS PANEL ───────────────────────────────────────────────────────────
function TweaksPanel({ visible, theme, setTheme }) {
  if (!visible) return null;
  return (
    <div style={{
      position: 'fixed',
      bottom: '24px', right: '24px',
      zIndex: 9999,
      background: 'var(--surface)',
      border: '1px solid var(--border-strong)',
      borderRadius: 'var(--radius-md)',
      padding: '1.25rem',
      width: '260px',
      fontFamily: 'var(--font-body)',
      boxShadow: 'var(--shadow-pop), 0 24px 60px -20px rgba(0,0,0,0.4)',
    }}>
      <div style={{
        display: 'flex', alignItems: 'center', gap: '0.5rem',
        marginBottom: '1.25rem',
      }}>
        <Sparkle size={14} color="var(--teal)"/>
        <p style={{
          fontFamily: 'var(--font-head)', fontWeight: 700,
          fontSize: '0.9rem',
          background: 'linear-gradient(135deg, var(--teal), var(--magenta))',
          WebkitBackgroundClip: 'text',
          backgroundClip: 'text',
          WebkitTextFillColor: 'transparent',
        }}>Tweaks</p>
      </div>

      <label className="label" style={{ marginBottom: '0.5rem' }}>Theme</label>
      <div style={{ display: 'flex', gap: '0.4rem' }}>
        {[
          { key: 'dark',  label: '◐ Dark' },
          { key: 'light', label: '◑ Light' },
        ].map(o => (
          <button key={o.key}
            onClick={() => {
              setTheme(o.key);
              window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { theme: o.key } }, '*');
            }}
            style={{
              flex: 1,
              background: theme === o.key ? 'var(--text)' : 'transparent',
              color: theme === o.key ? 'var(--bg)' : 'var(--text-mid)',
              border: '1px solid var(--border-strong)',
              borderRadius: '100px',
              padding: '0.5rem 0.75rem',
              fontFamily: 'var(--font-head)',
              fontSize: '0.78rem',
              fontWeight: 600,
              cursor: 'pointer',
              transition: 'all 0.2s',
            }}>{o.label}</button>
        ))}
      </div>
    </div>
  );
}

// ─── APP ────────────────────────────────────────────────────────────────────
function App() {
  const [theme, setTheme, toggleTheme] = useTheme();
  const [tweaksVisible, setTweaksVisible] = useState(false);

  // edit-mode protocol
  useEffect(() => {
    const handler = e => {
      if (e.data?.type === '__activate_edit_mode')   setTweaksVisible(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksVisible(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  return (
    <>
      <Nav theme={theme} onThemeToggle={toggleTheme}/>
      <Hero/>
      <NetworksRibbon/>
      <LogoWall/>
      <Products/>
      <Solutions/>
      <Technology/>
      <FusionSection theme={theme}/>
      <Mission/>
      <Testimonials/>
      <About/>
      <Speaking/>
      <Training/>
      <Contact/>
      <Footer/>
      <TweaksPanel visible={tweaksVisible} theme={theme} setTheme={setTheme}/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

Object.assign(window, { Contact, Footer, TweaksPanel, App });
</script>
</body></html>
