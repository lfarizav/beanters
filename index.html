  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      /* ── Single accent: indigo ───────────────────────────────────── */
      --teal:        #818cf8;
      --teal-strong: #6366f1;
      --aqua:        #a5b4fc;
      --magenta:     #c084fc;
      --gold:        #818cf8;
      --violet:      #8b5cf6;
      --coral:       #a78bfa;
      /* ── Typography ──────────────────────────────────────────────── */
      --font-head:   'Space Grotesk', sans-serif;
      --font-body:   'Inter', sans-serif;
      --font-mono:   'JetBrains Mono', monospace;
      --font-serif:  Georgia, 'Times New Roman', serif;
      /* ── Radii ────────────────────────────────────────────────────── */
      --radius-sm:  6px;
      --radius-md:  10px;
      --radius-lg:  16px;
      --radius-xl:  24px;
    }
    [data-theme="dark"] {
      --bg:          #07080f;
      --bg-2:        #0c0d1a;
      --bg-3:        #10111e;
      --surface:     #12142a;
      --surface-2:   #181a35;
      --border:      rgba(255,255,255,0.06);
      --border-strong: rgba(255,255,255,0.11);
      --text:        #eef0f8;
      --text-mid:    #8892b0;
      --text-dim:    #5c6488;
      --cli-bg:      #05060e;
      --cli-titlebar:#09091c;
      --shadow-card: 0 24px 60px -20px rgba(0,0,0,0.8);
      --shadow-pop:  0 10px 30px -10px rgba(0,0,0,0.6);
      --aurora-opacity: 0;
    }
    [data-theme="light"] {
      --bg:          #f8f9fc;
      --bg-2:        #f1f3f8;
      --bg-3:        #e9ebf4;
      --surface:     #ffffff;
      --surface-2:   #f5f6fb;
      --border:      rgba(15,20,50,0.07);
      --border-strong: rgba(15,20,50,0.13);
      --text:        #09101e;
      --text-mid:    #46516e;
      --text-dim:    #7d879e;
      --cli-bg:      #0c0e1e;
      --cli-titlebar:#131528;
      --shadow-card: 0 20px 50px -20px rgba(15,20,60,0.14);
      --shadow-pop:  0 8px 24px -6px rgba(15,20,60,0.10);
      --aurora-opacity: 0;
    }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.6;
      overflow-x: hidden;
      transition: background 0.4s ease, color 0.3s ease;
    }
    ::selection { background: color-mix(in oklab, var(--teal) 30%, transparent); color: var(--text); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-2); }
    ::-webkit-scrollbar-thumb { background: color-mix(in oklab, var(--text-dim) 60%, transparent); border-radius: 8px; }
    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    @keyframes slide { from { transform: translateX(0) } to { transform: translateX(-50%) } }
    @keyframes pulse { 0%,100%{opacity:1; transform:scale(1)} 50%{opacity:.55; transform:scale(.8)} }
    @keyframes spin { from { transform: rotate(0) } to { transform: rotate(360deg) } }
    @keyframes float { 0%,100%{transform:translate(0,0)} 50%{transform:translate(30px,-30px)} }
    @keyframes float2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-40px,20px)} }
    @keyframes float3 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(20px,40px)} }
    @keyframes twinkle { 0%,100%{opacity:0.4; transform:scale(0.9)} 50%{opacity:1; transform:scale(1.1)} }
    @keyframes shimmer { 0%{background-position:0% 50%} 100%{background-position:200% 50%} }
    .gradient-text {
      background: linear-gradient(135deg, var(--aqua) 0%, var(--teal) 50%, var(--magenta) 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .gradient-text-warm {
      background: linear-gradient(135deg, var(--aqua) 0%, var(--teal) 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .section-eyebrow {
      font-family: var(--font-mono);
      font-size: 0.72rem; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--text-dim);
      display: inline-flex; align-items: center; gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .section-eyebrow .num {
      font-family: var(--font-mono);
      font-size: 0.68rem; color: var(--teal);
      letter-spacing: 0.08em; font-weight: 600;
    }
    .section-title {
      font-family: var(--font-head); font-weight: 700;
      font-size: clamp(2rem, 3.6vw, 3rem);
      line-height: 1.05; letter-spacing: -0.025em; margin-bottom: 1rem;
    }
    .section-title .serif {
      font-family: var(--font-serif); font-weight: 400;
      font-style: italic; letter-spacing: -0.01em;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 0.55rem;
      font-family: var(--font-head); font-weight: 600; font-size: 0.95rem;
      padding: 0.85rem 1.6rem; border-radius: 100px;
      text-decoration: none; border: none; cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s, border-color 0.2s, color 0.2s;
      white-space: nowrap;
    }
    .btn-primary { background: var(--text); color: var(--bg); letter-spacing: -0.01em; }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: var(--shadow-pop); }
    .btn-ghost { background: transparent; color: var(--text-mid); border: 1px solid var(--border-strong); }
    .btn-ghost:hover { background: color-mix(in oklab, var(--text) 5%, transparent); color: var(--text); border-color: var(--border-strong); }
    /* Hero subtle dot grid */
    #hero::before {
      content: '';
      position: absolute; inset: 0; pointer-events: none; z-index: 0;
      background-image: radial-gradient(circle, rgba(129,140,248,0.09) 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: radial-gradient(ellipse 80% 70% at 50% 0%, black 40%, transparent 100%);
      -webkit-mask-image: radial-gradient(ellipse 80% 70% at 50% 0%, black 40%, transparent 100%);
    }
    [data-theme="light"] #hero::before {
      background-image: radial-gradient(circle, rgba(99,102,241,0.08) 1px, transparent 1px);
    }
    .aurora-blob {
      position: absolute; border-radius: 50%; filter: blur(80px);
      pointer-events: none; opacity: var(--aurora-opacity);
      mix-blend-mode: screen; will-change: transform;
    }
    [data-theme="light"] .aurora-blob { mix-blend-mode: multiply; filter: blur(70px); }
    .input {
      width: 100%; padding: 0.85rem 1.05rem;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text);
      font-family: var(--font-body); font-size: 0.95rem;
      outline: none; transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 4px color-mix(in oklab, var(--teal) 18%, transparent);
    }
    .label {
      font-family: var(--font-body); font-size: 0.8rem; font-weight: 500;
      color: var(--text-mid); display: block; margin-bottom: 0.4rem;
    }
    section { position: relative; padding: 7rem 2rem; }
    .container { max-width: 1200px; margin: 0 auto; position: relative; }
    @media (max-width: 860px) {
      section { padding: 5rem 1.25rem; }
      .desktop-only { display: none !important; }
    }
    @media (min-width: 861px) { .mobile-only { display: none !important; } }

    /* ── Accessibility: skip link ────────────────────────────────────────── */
    .skip-link {
      position: absolute; top: -100px; left: 1rem; z-index: 9999;
      background: var(--teal); color: #000; padding: 0.5rem 1rem;
      border-radius: 0 0 8px 8px; font-family: var(--font-body); font-size: 0.9rem;
      font-weight: 600; text-decoration: none; transition: top 0.2s;
    }
    .skip-link:focus { top: 0; }

    /* ── Footer link hover via CSS (no inline JS) ────────────────────────── */
    .footer-link:hover { color: var(--text) !important; }

    /* ── Accessibility: respect reduced-motion preference ────────────────── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
