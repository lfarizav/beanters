// ─── UTILS ───────────────────────────────────────────────────────────────────
const useIntersection = (ref, options) => {
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) setVisible(true); }, options);
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return visible;
};

function CLIWindow({ animate }) {
  const [shown, setShown] = useState(animate ? 0 : CLI_LINES.length);

    if (!animate) { setShown(CLI_LINES.length); return; }
    setShown(0);
    let i = 0;

    return () => clearInterval(iv);
  }, [animate]);

  const colorMap = {

    cmd: 'var(--teal)',
    arg: '#7ec8e3',
    out: 'var(--text-mid)',
    blank: 'transparent',

// ─── TWEAKS PANEL ─────────────────────────────────────────────────────────────
function TweaksPanel({ tweaks, setTweaks, visible }) {
  const persist = (key, val) => {
    const next = {...tweaks, [key]: val};
    setTweaks(next);
    window.parent.postMessage({ type:'__edit_mode_set_keys', edits: {[key]: val} }, '*');
  };
  return (
    <div style={{
      position:'fixed', bottom:'24px', right:'24px', zIndex:9999,
      background:'var(--bg2)', border:'1px solid var(--border)',
      borderRadius:'12px', padding:'1.25rem', width:'240px',
      fontFamily:'var(--font-body)',
      display: visible ? 'block' : 'none',
      boxShadow:'0 16px 48px rgba(0,0,0,0.5)',
    }}>
      <p style={{fontFamily:'var(--font-head)', fontWeight:700, fontSize:'0.85rem', marginBottom:'1rem', color:'var(--teal)'}}>Tweaks</p>
      
      <label style={{fontSize:'0.8rem', color:'var(--text-mid)', display:'block', marginBottom:'0.4rem'}}>Accent Color</label>
      <div style={{display:'flex', gap:'0.5rem', marginBottom:'1rem'}}>
        {[['teal','var(--teal)'],['amber','var(--amber)'],['purple','oklch(0.72 0.16 270)']].map(([k,c]) => (
          <div key={k} onClick={()=>persist('accentColor',k)} style={{
            width:28, height:28, borderRadius:'50%', background:c,
            cursor:'pointer', border: tweaks.accentColor===k ? '3px solid white' : '3px solid transparent',
            transition:'border 0.2s',
          }}/>
        ))}
      </div>

      <label style={{fontSize:'0.8rem', color:'var(--text-mid)', display:'block', marginBottom:'0.4rem'}}>Show Stats</label>
      <input type="checkbox" checked={tweaks.showStats} onChange={e=>persist('showStats', e.target.checked)} style={{marginBottom:'1rem'}}/>

      <label style={{fontSize:'0.8rem', color:'var(--text-mid)', display:'block', marginBottom:'0.4rem'}}>Animate CLI</label>
      <input type="checkbox" checked={tweaks.animateCLI} onChange={e=>persist('animateCLI', e.target.checked)} style={{marginBottom:'0.5rem'}}/>
    </div>
  );
}

// ─── APP ──────────────────────────────────────────────────────────────────────
function App() {
  const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);
  const [tweaksVisible, setTweaksVisible] = useState(false);

  useEffect(() => {
    window.addEventListener('message', e => {
      if (e.data?.type === '__activate_edit_mode') setTweaksVisible(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksVisible(false);
    });
    window.parent.postMessage({ type:'__edit_mode_available' }, '*');
  }, []);

  return (
    <>
      <Nav tweaks={tweaks}/>
      <Hero tweaks={tweaks}/>
      <NetworksRibbon/>
      <Products/>
      <Solutions/>
      <Technology/>
      <GlobalSouth/>
      <About/>
      <Contact/>
      <Footer/>
      <TweaksPanel tweaks={tweaks} setTweaks={setTweaks} visible={tweaksVisible}/>
    </>
  );
}
