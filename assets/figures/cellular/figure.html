<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mástil celular</title>
<script>
  // Theme and language before first paint: ?theme= / ?lang=, else the embedding page, else the site keys.
  (function () {
    var d = document.documentElement, q = new URLSearchParams(location.search), t = q.get("theme"), l = q.get("lang");
    try { if (!t && window.parent !== window) t = window.parent.document.documentElement.getAttribute("data-theme"); } catch (e) {}
    try { if (!t) t = localStorage.getItem("bk-theme"); if (!l) l = localStorage.getItem("bk-lang"); } catch (e) {}
    if (t === "dark" || t === "light") d.setAttribute("data-theme", t);
    if (l === "en" || l === "es") d.lang = l;
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&display=swap">

<link rel="stylesheet" href="embed.css">
<link rel="stylesheet" href="figure.css">
</head>

<div data-mast-embed></div>
<script type="module" src="embed.js"></script>
</body>
</html>
