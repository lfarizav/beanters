# Beanters anonymous counters (page visits, books opened).
# database_id is the D1 id of beanters-counter in the beantagecoffeeroaster Cloudflare account (an identifier, not a secret).
# See README-DEPLOY.md. This file holds no secrets.
name = "beanters-counter"
main = "index.mjs"
compatibility_date = "2026-10-01"

# Served only through the route below, not on a workers.dev address.
workers_dev = false

[[routes]]
pattern = "beanters.com/api/counter/*"
zone_name = "beanters.com"

[[d1_databases]]
binding = "DB"
database_name = "beanters-counter"
database_id = "9e63d132-bd54-472e-9bbb-00f114e604b3"
