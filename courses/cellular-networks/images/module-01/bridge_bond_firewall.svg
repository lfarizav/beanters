<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="gcyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8"/><stop offset="100%" style="stop-color:#0369a1"/></linearGradient>
    <linearGradient id="gyellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/><stop offset="100%" style="stop-color:#b45309"/></linearGradient>
    <linearGradient id="gred" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f87171"/><stop offset="100%" style="stop-color:#be123c"/></linearGradient>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/></marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.4"/></pattern>
  </defs>
  <rect width="800" height="500" fill="#0a0f1d"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <rect x="15" y="15" width="770" height="470" rx="8" fill="none" stroke="#1e293b" stroke-width="1.5" opacity="0.6"/>
  <text x="400" y="42" text-anchor="middle" fill="#38bdf8" font-size="17" font-weight="bold" font-family="sans-serif">Bridge · Bond · Firewall</text>
  <text x="400" y="62" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="sans-serif">Network Bridge · Link Aggregation · Packet Filtering | LFCS Essential</text>
  <!-- Panel 1: Bridge (cyan) -->
  <rect x="22" y="78" width="238" height="300" rx="6" fill="url(#gcyan)" filter="url(#glow)" opacity="0.9"/>
  <text x="141" y="98" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold" font-family="sans-serif">
    <tspan x="141" dy="0">Network Bridge</tspan>
    <tspan x="141" dy="15" font-size="9" font-family="monospace" fill="#e0f2fe">ip link add br0 type bridge</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">ip link set eth0 master br0</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">ip link set br0 up</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">ip link set eth0 up</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">bridge link show</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">bridge fdb show</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">brctl show (legacy)</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">nmcli con add type bridge</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">veth pair: ip link add</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe"> veth0 type veth peer veth1</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">VLAN: ip link add vlan10</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe"> link eth0 type vlan id 10</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">STP: bridge stp br0 on</tspan>
  </text>
  <!-- Arrow 1→2 -->
  <line x1="260" y1="228" x2="270" y2="228" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arw)"/>
  <!-- Panel 2: Bonding (yellow) -->
  <rect x="280" y="78" width="238" height="300" rx="6" fill="url(#gyellow)" filter="url(#glow)" opacity="0.9"/>
  <text x="399" y="98" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold" font-family="sans-serif">
    <tspan x="399" dy="0">Bonding / Teaming</tspan>
    <tspan x="399" dy="15" font-size="9" font-family="monospace" fill="#fef3c7">nmcli con add type bond</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#fef3c7"> con-name bond0 mode 802.3ad</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">nmcli con add type bond-slave</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">Modes:</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#fef3c7"> 0=balance-rr (round-robin)</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#fef3c7"> 1=active-backup (HA)</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#fef3c7"> 2=balance-xor</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#fef3c7"> 4=802.3ad (LACP)</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#fef3c7"> 5=balance-tlb</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#fef3c7"> 6=balance-alb</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">cat /proc/net/bonding/bond0</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">/etc/modprobe.d/bonding.conf</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">ip link show bond0</tspan>
  </text>
  <!-- Arrow 2→3 -->
  <line x1="518" y1="228" x2="528" y2="228" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arw)"/>
  <!-- Panel 3: Firewall (red) -->
  <rect x="538" y="78" width="238" height="300" rx="6" fill="url(#gred)" filter="url(#glow)" opacity="0.9"/>
  <text x="657" y="98" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold" font-family="sans-serif">
    <tspan x="657" dy="0">firewalld · iptables · nft</tspan>
    <tspan x="657" dy="15" font-size="9" font-family="monospace" fill="#fecaca">firewall-cmd --list-all</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fecaca">firewall-cmd --add-port=80/tcp</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fecaca"> --permanent --reload</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fecaca">firewall-cmd --add-service=ssh</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fecaca">firewall-cmd --zone=drop</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fecaca">iptables -L -n -v</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fecaca">iptables -A INPUT -p tcp</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fecaca"> --dport 443 -j ACCEPT</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fecaca">iptables -A INPUT -j DROP</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fecaca">iptables-save/-restore</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fecaca">nft list ruleset</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fecaca">ufw allow 22/tcp</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fecaca">ufw status verbose</tspan>
  </text>
  <!-- Footer -->
  <rect x="22" y="393" width="756" height="78" rx="6" fill="url(#gcyan)" filter="url(#glow)" opacity="0.9"/>
  <text x="400" y="411" text-anchor="middle" fill="#e2e8f0" font-size="10" font-family="monospace">
    <tspan x="400" dy="0">Bridge=L2 switch in kernel | Bond=link aggregation (HA+bandwidth) | Firewall=netfilter hooks</tspan>
    <tspan x="400" dy="15">LFCS: ip link add type bridge | nmcli bond | firewall-cmd --permanent --reload | iptables -L</tspan>
    <tspan x="400" dy="15">Chains: INPUT FORWARD OUTPUT | Tables: filter nat mangle raw | nftables replaces iptables</tspan>
  </text>
</svg>
