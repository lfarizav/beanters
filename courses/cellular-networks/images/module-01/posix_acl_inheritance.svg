<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 330">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.3"/>
    </pattern>
    <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="440" height="330" fill="url(#grid)" rx="6"/>
  <text x="15" y="22" fill="#38bdf8" font-size="8" font-family="monospace" letter-spacing="1">SEC.ACLS // POSIX ACCESS &amp; DEFAULT ACL INHERITANCE</text>
  <line x1="15" y1="26" x2="425" y2="26" stroke="#38bdf8" stroke-width="1" opacity="0.2"/>

  <!-- Parent Directory -->
  <g transform="translate(15, 110)">
    <rect width="110" height="62" rx="4" fill="url(#grad-cyan)" stroke="#06b6d4" stroke-width="1.5" filter="url(#glow-cyan)"/>
    <text x="55" y="18" fill="#e2e8f0" font-size="8.5" font-weight="bold" font-family="sans-serif" text-anchor="middle">/var/log/5g/</text>
    <text x="55" y="32" fill="#cbd5e1" font-size="6.5" font-family="monospace" text-anchor="middle">root:root  750</text>
    <text x="55" y="44" fill="#0891b2" font-size="5.5" font-family="monospace" text-anchor="middle">setfacl -d -m</text>
    <text x="55" y="54" fill="#0891b2" font-size="5.5" font-family="monospace" text-anchor="middle">g:noc-eng:rwX</text>
  </g>

  <!-- Access ACL -->
  <g transform="translate(145, 60)">
    <rect width="110" height="42" rx="3" fill="#0b1329" stroke="#334155" stroke-width="1"/>
    <text x="55" y="16" fill="#cbd5e1" font-size="8" font-weight="bold" font-family="sans-serif" text-anchor="middle">Access ACL</text>
    <text x="55" y="28" fill="#cbd5e1" font-size="6.5" font-family="monospace" text-anchor="middle">g:noc-eng:rwx</text>
    <text x="55" y="36" fill="#64748b" font-size="5.5" font-family="sans-serif" text-anchor="middle">Existing files</text>
  </g>

  <!-- Default Inherited ACL -->
  <g transform="translate(145, 140)">
    <rect width="110" height="42" rx="3" fill="url(#grad-green)" stroke="#10b981" stroke-width="1.2"/>
    <text x="55" y="16" fill="#a7f3d0" font-size="8" font-weight="bold" font-family="sans-serif" text-anchor="middle">Default ACL</text>
    <text x="55" y="28" fill="#cbd5e1" font-size="6.5" font-family="monospace" text-anchor="middle">g:noc-eng:rwX</text>
    <text x="55" y="36" fill="#34d399" font-size="5.5" font-family="sans-serif" text-anchor="middle">New files inherit</text>
  </g>

  <!-- Auto Inherited items -->
  <g transform="translate(295, 105)">
    <rect width="130" height="34" rx="3" fill="url(#grad-green)" stroke="#10b981" stroke-width="1"/>
    <text x="65" y="14" fill="#a7f3d0" font-size="7.5" font-weight="bold" font-family="sans-serif" text-anchor="middle">nuevo-log.txt</text>
    <text x="65" y="26" fill="#cbd5e1" font-size="6.5" font-family="monospace" text-anchor="middle">Inherited: noc-eng (rw)</text>
  </g>
  <g transform="translate(295, 155)">
    <rect width="130" height="34" rx="3" fill="url(#grad-green)" stroke="#10b981" stroke-width="1"/>
    <text x="65" y="14" fill="#a7f3d0" font-size="7.5" font-weight="bold" font-family="sans-serif" text-anchor="middle">nuevo-subdir/</text>
    <text x="65" y="26" fill="#cbd5e1" font-size="6.5" font-family="monospace" text-anchor="middle">Inherited: noc-eng (rwx)</text>
  </g>

  <!-- Connectors -->
  <path d="M 125,125 L 135,125 L 135,81 L 145,81" fill="none" stroke="#475569" stroke-width="1"/>
  <path d="M 125,145 L 145,145" fill="none" stroke="#10b981" stroke-width="1.2"/>

  <path d="M 255,161 L 275,161 L 275,122 L 295,122" fill="none" stroke="#10b981" stroke-width="1.2"/>
  <path d="M 255,161 L 275,161 L 275,172 L 295,172" fill="none" stroke="#10b981" stroke-width="1.2"/>

  <!-- CLI command sample -->
  <g transform="translate(15, 215)">
    <rect width="410" height="34" rx="3" fill="#0b1329" stroke="#334155" stroke-width="1"/>
    <text x="15" y="16" fill="#22d3ee" font-size="7" font-family="monospace"># ls -la /var/log/ | grep 5g  ➡  drwxr-x---+  (world block with + for ACL)</text>
    <text x="15" y="26" fill="#64748b" font-size="6.5" font-family="sans-serif">POSIX ACL extension allows fine-grained, dynamic group settings bypassing Unix limits</text>
  </g>

  <text x="15" y="310" fill="#475569" font-size="7" font-family="monospace">BLUEPRINT // POSIX FILE SYSTEM ACL EXTENSIONS</text>
  <text x="425" y="310" fill="#475569" font-size="7" font-family="monospace" text-anchor="end">POSIX.1e DRAFT STANDARD</text>
</svg>