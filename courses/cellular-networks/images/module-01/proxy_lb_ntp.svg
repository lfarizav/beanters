<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="gcyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8"/><stop offset="100%" style="stop-color:#0369a1"/></linearGradient>
    <linearGradient id="ggreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399"/><stop offset="100%" style="stop-color:#047857"/></linearGradient>
    <linearGradient id="gyellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/><stop offset="100%" style="stop-color:#b45309"/></linearGradient>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/></marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.4"/></pattern>
  </defs>
  <rect width="800" height="500" fill="#0a0f1d"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <rect x="15" y="15" width="770" height="470" rx="8" fill="none" stroke="#1e293b" stroke-width="1.5" opacity="0.6"/>
  <text x="400" y="42" text-anchor="middle" fill="#38bdf8" font-size="17" font-weight="bold" font-family="sans-serif">Reverse Proxy · Load Balancer · NTP</text>
  <text x="400" y="62" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="sans-serif">nginx/HAProxy · Traffic Distribution · Time Sync | LFCS Essential</text>
  <!-- Panel 1: Reverse Proxy (cyan) -->
  <rect x="22" y="78" width="238" height="300" rx="6" fill="url(#gcyan)" filter="url(#glow)" opacity="0.9"/>
  <text x="141" y="98" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold" font-family="sans-serif">
    <tspan x="141" dy="0">Reverse Proxy (nginx)</tspan>
    <tspan x="141" dy="15" font-size="9" font-family="monospace" fill="#e0f2fe">nginx -t (test config)</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">nginx -s reload</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">/etc/nginx/nginx.conf</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">/etc/nginx/conf.d/</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">server {</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe"> listen 443 ssl;</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe"> location / {</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">  proxy_pass http://back;</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">  proxy_set_header Host $h;</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe"> }</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">SSL: ssl_certificate .pem</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">certbot --nginx -d host</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">access_log / error_log</tspan>
  </text>
  <!-- Arrow 1→2 -->
  <line x1="260" y1="228" x2="270" y2="228" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arw)"/>
  <!-- Panel 2: Load Balancer (green) -->
  <rect x="280" y="78" width="238" height="300" rx="6" fill="url(#ggreen)" filter="url(#glow)" opacity="0.9"/>
  <text x="399" y="98" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold" font-family="sans-serif">
    <tspan x="399" dy="0">Load Balancer (HAProxy)</tspan>
    <tspan x="399" dy="15" font-size="9" font-family="monospace" fill="#d1fae5">haproxy -f /etc/haproxy.cfg</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">haproxy -c -f cfg (check)</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">frontend web</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#d1fae5"> bind *:80</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#d1fae5"> default_backend servers</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">backend servers</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#d1fae5"> balance roundrobin</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#d1fae5"> server s1 10.0.0.1:80 check</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#d1fae5"> server s2 10.0.0.2:80 check</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">Algos: roundrobin leastconn</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#d1fae5"> source (IP hash)</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">stats socket /run/haproxy.sock</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">nginx upstream{} also works</tspan>
  </text>
  <!-- Arrow 2→3 -->
  <line x1="518" y1="228" x2="528" y2="228" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arw)"/>
  <!-- Panel 3: NTP/Chrony (yellow) -->
  <rect x="538" y="78" width="238" height="300" rx="6" fill="url(#gyellow)" filter="url(#glow)" opacity="0.9"/>
  <text x="657" y="98" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold" font-family="sans-serif">
    <tspan x="657" dy="0">NTP / Chrony</tspan>
    <tspan x="657" dy="15" font-size="9" font-family="monospace" fill="#fef3c7">timedatectl status</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">timedatectl set-ntp true</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">timedatectl set-timezone</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">chronyc tracking</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">chronyc sources -v</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">chronyc makestep (force)</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">/etc/chrony.conf</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fef3c7"> server pool.ntp.org iburst</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fef3c7"> allow 192.168.0.0/16</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">ntpq -p (legacy ntpd)</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">date +"%Y-%m-%d %H:%M:%S"</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">hwclock --systohc</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">UDP port 123 (NTP)</tspan>
  </text>
  <!-- Footer -->
  <rect x="22" y="393" width="756" height="78" rx="6" fill="url(#gcyan)" filter="url(#glow)" opacity="0.9"/>
  <text x="400" y="411" text-anchor="middle" fill="#e2e8f0" font-size="10" font-family="monospace">
    <tspan x="400" dy="0">Proxy=SSL termination+cache | LB=distribute load across backends | NTP=time sync via UDP 123</tspan>
    <tspan x="400" dy="15">LFCS: nginx -t/-s reload | haproxy -c | timedatectl set-ntp true | chronyc sources | chrony.conf</tspan>
    <tspan x="400" dy="15">nginx: static+proxy | HAProxy: L4/L7 LB, health checks | chronyd: drift correction, step, slew</tspan>
  </text>
</svg>
