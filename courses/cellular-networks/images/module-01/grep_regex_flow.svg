<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="gcyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8"/><stop offset="100%" style="stop-color:#0369a1"/></linearGradient>
    <linearGradient id="ggreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399"/><stop offset="100%" style="stop-color:#047857"/></linearGradient>
    <linearGradient id="gyellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/><stop offset="100%" style="stop-color:#b45309"/></linearGradient>
    <linearGradient id="gpurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa"/><stop offset="100%" style="stop-color:#4338ca"/></linearGradient>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/></marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.4"/></pattern>
  </defs>
  <rect width="800" height="500" fill="#0a0f1d"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <rect x="15" y="15" width="770" height="470" rx="8" fill="none" stroke="#1e293b" stroke-width="1.5" opacity="0.6"/>
  <text x="400" y="42" text-anchor="middle" fill="#38bdf8" font-size="17" font-weight="bold" font-family="sans-serif">grep · find · sed · awk</text>
  <text x="400" y="62" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="sans-serif">Text Search · File Find · Stream Edit · Field Processing | LFCS Essential</text>
  <!-- Panel 1: grep (cyan) x=22,y=78,w=178,h=300 -->
  <rect x="22" y="78" width="178" height="300" rx="6" fill="url(#gcyan)" filter="url(#glow)" opacity="0.9"/>
  <text x="111" y="98" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold" font-family="sans-serif">
    <tspan x="111" dy="0">grep — Pattern Search</tspan>
    <tspan x="111" dy="15" font-size="9" font-family="monospace" fill="#e0f2fe">grep 'pattern' file</tspan>
    <tspan x="111" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">grep -i case_insensitive</tspan>
    <tspan x="111" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">grep -r dir/  (recursive)</tspan>
    <tspan x="111" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">grep -v invert_match</tspan>
    <tspan x="111" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">grep -n show_line_nums</tspan>
    <tspan x="111" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">grep -c count_matches</tspan>
    <tspan x="111" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">grep -l list_files</tspan>
    <tspan x="111" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">grep -E 'a|b' (ERE)</tspan>
    <tspan x="111" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">grep -P '\d+' (PCRE)</tspan>
    <tspan x="111" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">grep -A3 -B3 context</tspan>
    <tspan x="111" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">grep -o only_match</tspan>
    <tspan x="111" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">grep '^start\|end$'</tspan>
    <tspan x="111" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">grep -w whole_word</tspan>
  </text>
  <!-- Arrow 1→2 -->
  <line x1="200" y1="228" x2="210" y2="228" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arw)"/>
  <!-- Panel 2: find (green) x=212,y=78,w=178,h=300 -->
  <rect x="212" y="78" width="178" height="300" rx="6" fill="url(#ggreen)" filter="url(#glow)" opacity="0.9"/>
  <text x="301" y="98" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold" font-family="sans-serif">
    <tspan x="301" dy="0">find — File Locator</tspan>
    <tspan x="301" dy="15" font-size="9" font-family="monospace" fill="#d1fae5">find /path -name '*.log'</tspan>
    <tspan x="301" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">find . -type f/d/l</tspan>
    <tspan x="301" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">find . -size +100M</tspan>
    <tspan x="301" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">find . -mtime -7 (days)</tspan>
    <tspan x="301" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">find . -newer ref_file</tspan>
    <tspan x="301" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">find . -user bob</tspan>
    <tspan x="301" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">find . -perm 644</tspan>
    <tspan x="301" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">find . -perm /4000</tspan>
    <tspan x="301" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">find . -exec rm {} \;</tspan>
    <tspan x="301" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">find . -exec {} +</tspan>
    <tspan x="301" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">find . -maxdepth 2</tspan>
    <tspan x="301" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">find . -not -name '*.sh'</tspan>
    <tspan x="301" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">find . -empty -delete</tspan>
  </text>
  <!-- Arrow 2→3 -->
  <line x1="390" y1="228" x2="400" y2="228" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arw)"/>
  <!-- Panel 3: sed (yellow) x=402,y=78,w=178,h=300 -->
  <rect x="402" y="78" width="178" height="300" rx="6" fill="url(#gyellow)" filter="url(#glow)" opacity="0.9"/>
  <text x="491" y="98" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold" font-family="sans-serif">
    <tspan x="491" dy="0">sed — Stream Editor</tspan>
    <tspan x="491" dy="15" font-size="9" font-family="monospace" fill="#fef3c7">sed 's/old/new/' file</tspan>
    <tspan x="491" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">sed 's/old/new/g' (all)</tspan>
    <tspan x="491" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">sed -i 's/x/y/g' file</tspan>
    <tspan x="491" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">sed -n '5,10p' (print)</tspan>
    <tspan x="491" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">sed '3d' (delete line 3)</tspan>
    <tspan x="491" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">sed '/pattern/d' file</tspan>
    <tspan x="491" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">sed '1i\first line'</tspan>
    <tspan x="491" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">sed '$a\last line'</tspan>
    <tspan x="491" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">sed 's/^/  /' (indent)</tspan>
    <tspan x="491" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">sed '/^#/d' (rm comments)</tspan>
    <tspan x="491" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">sed -n '/start/,/end/p'</tspan>
    <tspan x="491" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">sed 'y/abc/ABC/' (tr)</tspan>
    <tspan x="491" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">sed -e 's/a/b/' -e 's/c/d/'</tspan>
  </text>
  <!-- Arrow 3→4 -->
  <line x1="580" y1="228" x2="590" y2="228" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arw)"/>
  <!-- Panel 4: awk (purple) x=592,y=78,w=178,h=300 -->
  <rect x="592" y="78" width="178" height="300" rx="6" fill="url(#gpurple)" filter="url(#glow)" opacity="0.9"/>
  <text x="681" y="98" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold" font-family="sans-serif">
    <tspan x="681" dy="0">awk — Field Processor</tspan>
    <tspan x="681" dy="15" font-size="9" font-family="monospace" fill="#ede9fe">awk '{print $1}' file</tspan>
    <tspan x="681" dy="13" font-size="9" font-family="monospace" fill="#ede9fe">awk -F: '{print $1,$3}'</tspan>
    <tspan x="681" dy="13" font-size="9" font-family="monospace" fill="#ede9fe">awk 'NR==3' (line 3)</tspan>
    <tspan x="681" dy="13" font-size="9" font-family="monospace" fill="#ede9fe">awk 'NF&gt;4' (4+ fields)</tspan>
    <tspan x="681" dy="13" font-size="9" font-family="monospace" fill="#ede9fe">awk '/pat/{print $0}'</tspan>
    <tspan x="681" dy="13" font-size="9" font-family="monospace" fill="#ede9fe">awk '{sum+=$2}END{print sum}'</tspan>
    <tspan x="681" dy="13" font-size="9" font-family="monospace" fill="#ede9fe">awk 'BEGIN{FS=":"}'</tspan>
    <tspan x="681" dy="13" font-size="9" font-family="monospace" fill="#ede9fe">awk '{gsub(/a/,"b")}'</tspan>
    <tspan x="681" dy="13" font-size="9" font-family="monospace" fill="#ede9fe">awk -v x=5 '$1&gt;x'</tspan>
    <tspan x="681" dy="13" font-size="9" font-family="monospace" fill="#ede9fe">awk '{a[$1]++}END{for(k in a) print k,a[k]}'</tspan>
    <tspan x="681" dy="13" font-size="9" font-family="monospace" fill="#ede9fe">awk 'NR%2==0'(even)</tspan>
    <tspan x="681" dy="13" font-size="9" font-family="monospace" fill="#ede9fe">awk '{print NR,$0}'</tspan>
    <tspan x="681" dy="13" font-size="9" font-family="monospace" fill="#ede9fe">awk 'length($0)&gt;80'</tspan>
  </text>
  <!-- Footer -->
  <rect x="22" y="393" width="756" height="78" rx="6" fill="url(#gcyan)" filter="url(#glow)" opacity="0.9"/>
  <text x="400" y="411" text-anchor="middle" fill="#e2e8f0" font-size="10" font-family="monospace">
    <tspan x="400" dy="0">Regex: . any  * zero+  + one+  ? opt  ^ start  $ end  [] class  | or  () group  \ escape</tspan>
    <tspan x="400" dy="15">LFCS: grep -rn | find -exec | sed -i 's/old/new/g' | awk -F: '{print $1}' /etc/passwd</tspan>
    <tspan x="400" dy="15">Pipeline: grep ERROR /var/log/syslog | awk '{print $5}' | sort | uniq -c | sort -rn</tspan>
  </text>
</svg>
