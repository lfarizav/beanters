<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="gcyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8"/><stop offset="100%" style="stop-color:#0369a1"/></linearGradient>
    <linearGradient id="gyellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/><stop offset="100%" style="stop-color:#b45309"/></linearGradient>
    <linearGradient id="gred" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f87171"/><stop offset="100%" style="stop-color:#be123c"/></linearGradient>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/></marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.4"/></pattern>
  </defs>
  <rect width="800" height="500" fill="#0a0f1d"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <rect x="15" y="15" width="770" height="470" rx="8" fill="none" stroke="#1e293b" stroke-width="1.5" opacity="0.6"/>
  <text x="400" y="42" text-anchor="middle" fill="#38bdf8" font-size="17" font-weight="bold" font-family="sans-serif">Environment · Limits · sudo</text>
  <text x="400" y="62" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="sans-serif">Env Variables · Resource Limits · Privilege Escalation | LFCS Essential</text>
  <!-- Panel 1: Environment (cyan) -->
  <rect x="22" y="78" width="238" height="300" rx="6" fill="url(#gcyan)" filter="url(#glow)" opacity="0.9"/>
  <text x="141" y="98" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold" font-family="sans-serif">
    <tspan x="141" dy="0">Environment Variables</tspan>
    <tspan x="141" dy="15" font-size="9" font-family="monospace" fill="#e0f2fe">export VAR=value</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">env / printenv</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">printenv HOME PATH</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">unset VAR</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">VAR=x cmd (local to cmd)</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">~/.bashrc (interactive)</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">~/.bash_profile (login)</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">/etc/environment (system)</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">/etc/profile.d/*.sh</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">PATH=$PATH:/opt/bin</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">source ~/.bashrc</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">env -i cmd (clean env)</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">set (show all shell vars)</tspan>
  </text>
  <!-- Arrow 1→2 -->
  <line x1="260" y1="228" x2="270" y2="228" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arw)"/>
  <!-- Panel 2: Limits (yellow) -->
  <rect x="280" y="78" width="238" height="300" rx="6" fill="url(#gyellow)" filter="url(#glow)" opacity="0.9"/>
  <text x="399" y="98" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold" font-family="sans-serif">
    <tspan x="399" dy="0">Resource Limits</tspan>
    <tspan x="399" dy="15" font-size="9" font-family="monospace" fill="#fef3c7">ulimit -a (show all)</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">ulimit -n 65535 (open fds)</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">ulimit -u 1000 (procs)</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">ulimit -s unlimited (stack)</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">ulimit -c unlimited (core)</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">/etc/security/limits.conf</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#fef3c7"> user soft nofile 65535</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#fef3c7"> user hard nofile 65535</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">/etc/security/limits.d/</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">systemd: LimitNOFILE=</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">cat /proc/&lt;pid&gt;/limits</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">OOM: /proc/&lt;p&gt;/oom_adj</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">cgroup MemoryMax=1G</tspan>
  </text>
  <!-- Arrow 2→3 -->
  <line x1="518" y1="228" x2="528" y2="228" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arw)"/>
  <!-- Panel 3: sudo (red) -->
  <rect x="538" y="78" width="238" height="300" rx="6" fill="url(#gred)" filter="url(#glow)" opacity="0.9"/>
  <text x="657" y="98" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold" font-family="sans-serif">
    <tspan x="657" dy="0">sudo · sudoers</tspan>
    <tspan x="657" dy="15" font-size="9" font-family="monospace" fill="#fecaca">sudo cmd (run as root)</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fecaca">sudo -u user cmd</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fecaca">sudo -l (allowed cmds)</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fecaca">sudo -i (root login shell)</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fecaca">sudo -e file (sudoedit)</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fecaca">sudo -k (invalidate cache)</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fecaca">visudo (safe edit)</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fecaca">/etc/sudoers syntax:</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fecaca"> bob ALL=(ALL) ALL</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fecaca"> bob ALL=(ALL) NOPASSWD:ALL</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fecaca"> %wheel ALL=(ALL) ALL</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fecaca">/etc/sudoers.d/ drop-ins</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fecaca">su - user (switch user)</tspan>
  </text>
  <!-- Footer -->
  <rect x="22" y="393" width="756" height="78" rx="6" fill="url(#gcyan)" filter="url(#glow)" opacity="0.9"/>
  <text x="400" y="411" text-anchor="middle" fill="#e2e8f0" font-size="10" font-family="monospace">
    <tspan x="400" dy="0">LFCS: export | printenv | /etc/profile.d/ | ulimit -n | limits.conf | visudo | sudo -l</tspan>
    <tspan x="400" dy="15">Persist limits: /etc/security/limits.d/99-custom.conf | systemd LimitNOFILE | cgroup MemoryMax</tspan>
    <tspan x="400" dy="15">sudo audit: /var/log/auth.log | /var/log/secure | journalctl _COMM=sudo</tspan>
  </text>
</svg>
