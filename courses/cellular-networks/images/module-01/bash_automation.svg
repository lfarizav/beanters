<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="gcyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8"/><stop offset="100%" style="stop-color:#0369a1"/></linearGradient>
    <linearGradient id="ggreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399"/><stop offset="100%" style="stop-color:#047857"/></linearGradient>
    <linearGradient id="gyellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/><stop offset="100%" style="stop-color:#b45309"/></linearGradient>
    <linearGradient id="gpurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa"/><stop offset="100%" style="stop-color:#4338ca"/></linearGradient>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/></marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.4"/></pattern>
  </defs>
  <rect width="800" height="500" fill="#0a0f1d"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <rect x="15" y="15" width="770" height="470" rx="8" fill="none" stroke="#1e293b" stroke-width="1.5" opacity="0.6"/>
  <text x="400" y="42" text-anchor="middle" fill="#38bdf8" font-size="17" font-weight="bold" font-family="sans-serif">Bash Automation</text>
  <text x="400" y="62" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="sans-serif">Variables · Control Flow · Functions · Cron | LFCS Essential</text>
  <!-- Panel 1: Variables+Strings (cyan) -->
  <rect x="22" y="78" width="178" height="300" rx="6" fill="url(#gcyan)" filter="url(#glow)" opacity="0.9"/>
  <text x="111" y="98" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold" font-family="sans-serif">
    <tspan x="111" dy="0">Variables &amp; Strings</tspan>
    <tspan x="111" dy="15" font-size="9" font-family="monospace" fill="#e0f2fe">NAME=value</tspan>
    <tspan x="111" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">echo "${NAME}"</tspan>
    <tspan x="111" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">export VAR=val</tspan>
    <tspan x="111" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">${VAR:-default}</tspan>
    <tspan x="111" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">${VAR:=assign}</tspan>
    <tspan x="111" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">${#VAR} (length)</tspan>
    <tspan x="111" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">${VAR%suffix}</tspan>
    <tspan x="111" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">${VAR#prefix}</tspan>
    <tspan x="111" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">${VAR/old/new}</tspan>
    <tspan x="111" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">arr=(a b c)</tspan>
    <tspan x="111" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">${arr[0]} ${arr[@]}</tspan>
    <tspan x="111" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">$1 $2 $@ $# $?</tspan>
    <tspan x="111" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">readonly / unset</tspan>
  </text>
  <!-- Arrow 1→2 -->
  <line x1="200" y1="228" x2="210" y2="228" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arw)"/>
  <!-- Panel 2: Control Flow (green) -->
  <rect x="212" y="78" width="178" height="300" rx="6" fill="url(#ggreen)" filter="url(#glow)" opacity="0.9"/>
  <text x="301" y="98" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold" font-family="sans-serif">
    <tspan x="301" dy="0">Control Flow</tspan>
    <tspan x="301" dy="15" font-size="9" font-family="monospace" fill="#d1fae5">if [ cond ]; then</tspan>
    <tspan x="301" dy="13" font-size="9" font-family="monospace" fill="#d1fae5"> ... elif ... else fi</tspan>
    <tspan x="301" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">[[ -f file ]] / [[ -d ]]</tspan>
    <tspan x="301" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">[[ -z str ]] / [[ -n ]]</tspan>
    <tspan x="301" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">[[ $a == $b ]]</tspan>
    <tspan x="301" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">for i in {1..5}; do</tspan>
    <tspan x="301" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">for f in *.log; do</tspan>
    <tspan x="301" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">while read line; do</tspan>
    <tspan x="301" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">until ping -c1 host; do</tspan>
    <tspan x="301" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">case $VAR in</tspan>
    <tspan x="301" dy="13" font-size="9" font-family="monospace" fill="#d1fae5"> pat) cmd;; *) default;;</tspan>
    <tspan x="301" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">break / continue</tspan>
    <tspan x="301" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">set -euo pipefail</tspan>
  </text>
  <!-- Arrow 2→3 -->
  <line x1="390" y1="228" x2="400" y2="228" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arw)"/>
  <!-- Panel 3: Functions+Scripts (yellow) -->
  <rect x="402" y="78" width="178" height="300" rx="6" fill="url(#gyellow)" filter="url(#glow)" opacity="0.9"/>
  <text x="491" y="98" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold" font-family="sans-serif">
    <tspan x="491" dy="0">Functions &amp; Scripts</tspan>
    <tspan x="491" dy="15" font-size="9" font-family="monospace" fill="#fef3c7">#!/usr/bin/env bash</tspan>
    <tspan x="491" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">myfunc() { echo "$1"; }</tspan>
    <tspan x="491" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">return 0/1 (exit code)</tspan>
    <tspan x="491" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">local var=val</tspan>
    <tspan x="491" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">$(myfunc arg)</tspan>
    <tspan x="491" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">source ./lib.sh</tspan>
    <tspan x="491" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">chmod +x script.sh</tspan>
    <tspan x="491" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">bash -n script (syntax)</tspan>
    <tspan x="491" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">bash -x script (trace)</tspan>
    <tspan x="491" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">getopts "hv:" opt</tspan>
    <tspan x="491" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">shift / "$@"</tspan>
    <tspan x="491" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">mapfile -t arr &lt;file</tspan>
    <tspan x="491" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">declare -A map</tspan>
  </text>
  <!-- Arrow 3→4 -->
  <line x1="580" y1="228" x2="590" y2="228" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arw)"/>
  <!-- Panel 4: Cron+Traps (purple) -->
  <rect x="592" y="78" width="178" height="300" rx="6" fill="url(#gpurple)" filter="url(#glow)" opacity="0.9"/>
  <text x="681" y="98" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold" font-family="sans-serif">
    <tspan x="681" dy="0">Cron &amp; Traps</tspan>
    <tspan x="681" dy="15" font-size="9" font-family="monospace" fill="#ede9fe">crontab -e (edit)</tspan>
    <tspan x="681" dy="13" font-size="9" font-family="monospace" fill="#ede9fe">crontab -l (list)</tspan>
    <tspan x="681" dy="13" font-size="9" font-family="monospace" fill="#ede9fe">mm hh dd mm dow cmd</tspan>
    <tspan x="681" dy="13" font-size="9" font-family="monospace" fill="#ede9fe">*/5 * * * * /script.sh</tspan>
    <tspan x="681" dy="13" font-size="9" font-family="monospace" fill="#ede9fe">@reboot /startup.sh</tspan>
    <tspan x="681" dy="13" font-size="9" font-family="monospace" fill="#ede9fe">/etc/cron.d/ drop-ins</tspan>
    <tspan x="681" dy="13" font-size="9" font-family="monospace" fill="#ede9fe">systemd timer: .timer</tspan>
    <tspan x="681" dy="13" font-size="9" font-family="monospace" fill="#ede9fe">trap 'cleanup' EXIT</tspan>
    <tspan x="681" dy="13" font-size="9" font-family="monospace" fill="#ede9fe">trap 'handler' SIGTERM</tspan>
    <tspan x="681" dy="13" font-size="9" font-family="monospace" fill="#ede9fe">trap - SIGINT (reset)</tspan>
    <tspan x="681" dy="13" font-size="9" font-family="monospace" fill="#ede9fe">signal: HUP INT TERM QUIT</tspan>
    <tspan x="681" dy="13" font-size="9" font-family="monospace" fill="#ede9fe">at 15:30 (one-time)</tspan>
    <tspan x="681" dy="13" font-size="9" font-family="monospace" fill="#ede9fe">atq / atrm (list/remove)</tspan>
  </text>
  <!-- Footer -->
  <rect x="22" y="393" width="756" height="78" rx="6" fill="url(#gcyan)" filter="url(#glow)" opacity="0.9"/>
  <text x="400" y="411" text-anchor="middle" fill="#e2e8f0" font-size="10" font-family="monospace">
    <tspan x="400" dy="0">LFCS: set -euo pipefail | bash -x debug | crontab -e | systemd timer | trap EXIT cleanup</tspan>
    <tspan x="400" dy="15">Test: [[ -f ]] file exists | [[ -d ]] dir | [[ -z ]] empty | [[ -n ]] not empty | $? exit code</tspan>
    <tspan x="400" dy="15">Best: #!/usr/bin/env bash | quote "$vars" | readonly consts | local in functions | log with tee</tspan>
  </text>
</svg>
