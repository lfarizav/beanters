<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 330">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.3"/>
    </pattern>
    <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="440" height="330" fill="url(#grid)" rx="6"/>
  <text x="15" y="22" fill="#38bdf8" font-size="8" font-family="monospace" letter-spacing="1">NET.NMCLI // PERSISTENT INTERFACE TOPOLOGY</text>
  <line x1="15" y1="26" x2="425" y2="26" stroke="#38bdf8" stroke-width="1" opacity="0.2"/>

  <!-- Left: Nodes -->
  <g transform="translate(15, 75)">
    <rect width="70" height="34" rx="3" fill="#0b1329" stroke="#06b6d4" stroke-width="1"/>
    <text x="35" y="16" fill="#22d3ee" font-size="8" font-weight="bold" font-family="sans-serif" text-anchor="middle">🗼 gNB</text>
    <text x="35" y="26" fill="#cbd5e1" font-size="6" font-family="monospace" text-anchor="middle">10.0.0.10</text>
  </g>
  <g transform="translate(15, 145)">
    <rect width="70" height="34" rx="3" fill="#0b1329" stroke="#06b6d4" stroke-width="1"/>
    <text x="35" y="16" fill="#22d3ee" font-size="8" font-weight="bold" font-family="sans-serif" text-anchor="middle">📱 UE</text>
    <text x="35" y="26" fill="#cbd5e1" font-size="6" font-family="monospace" text-anchor="middle">GTP-U N3</text>
  </g>
  <g transform="translate(15, 215)">
    <rect width="70" height="34" rx="3" fill="#0b1329" stroke="#334155" stroke-width="1"/>
    <text x="35" y="16" fill="#cbd5e1" font-size="8" font-weight="bold" font-family="sans-serif" text-anchor="middle">💻 NOC</text>
    <text x="35" y="26" fill="#64748b" font-size="6" font-family="monospace" text-anchor="middle">10.0.100.0/24</text>
  </g>

  <!-- Center: Bond/VLAN layers -->
  <g transform="translate(145, 95)">
    <rect width="110" height="42" rx="4" fill="url(#grad-cyan)" stroke="#06b6d4" stroke-width="1.2" filter="url(#glow-cyan)"/>
    <text x="55" y="18" fill="#e2e8f0" font-size="8.5" font-weight="bold" font-family="sans-serif" text-anchor="middle">bond0</text>
    <text x="55" y="28" fill="#cbd5e1" font-size="6.5" font-family="sans-serif" text-anchor="middle">active-backup HA</text>
    <text x="55" y="36" fill="#0891b2" font-size="5.5" font-family="monospace" text-anchor="middle">10.0.0.1 (AMF N2)</text>
  </g>

  <!-- Physical Ports under bond -->
  <g transform="translate(295, 65)">
    <rect width="120" height="24" rx="3" fill="#0b1329" stroke="#334155" stroke-width="1"/>
    <text x="60" y="14" fill="#cbd5e1" font-size="7.5" font-family="sans-serif" text-anchor="middle">eth0 (Primary)</text>
  </g>
  <g transform="translate(295, 95)">
    <rect width="120" height="24" rx="3" fill="#0b1329" stroke="#334155" stroke-width="1"/>
    <text x="60" y="14" fill="#cbd5e1" font-size="7.5" font-family="sans-serif" text-anchor="middle">eth2 (Backup)</text>
  </g>
  
  <!-- Other interfaces -->
  <g transform="translate(145, 160)">
    <rect width="110" height="34" rx="3" fill="url(#grad-cyan)" stroke="#06b6d4" stroke-width="1"/>
    <text x="55" y="16" fill="#e2e8f0" font-size="8" font-weight="bold" font-family="sans-serif" text-anchor="middle">eth1</text>
    <text x="55" y="26" fill="#cbd5e1" font-size="6" font-family="monospace" text-anchor="middle">192.168.100.1 (N3)</text>
  </g>
  
  <g transform="translate(145, 215)">
    <rect width="110" height="34" rx="3" fill="url(#grad-green)" stroke="#10b981" stroke-width="1"/>
    <text x="55" y="16" fill="#a7f3d0" font-size="8" font-weight="bold" font-family="sans-serif" text-anchor="middle">bond0.100</text>
    <text x="55" y="26" fill="#a7f3d0" font-size="6" font-family="monospace" text-anchor="middle">VLAN 100 (10.0.100.10)</text>
  </g>

  <!-- Connectors -->
  <path d="M 85,92 L 115,92 L 115,116 L 145,116" fill="none" stroke="#06b6d4" stroke-width="1"/>
  <path d="M 85,162 L 145,162" fill="none" stroke="#06b6d4" stroke-width="1"/>
  <path d="M 85,232 L 145,232" fill="none" stroke="#10b981" stroke-width="1"/>

  <line x1="255" y1="107" x2="295" y2="77" stroke="#475569" stroke-width="1"/>
  <line x1="255" y1="120" x2="295" y2="107" stroke="#475569" stroke-width="1"/>

  <path d="M 255,232 L 275,232 L 275,130 L 255,130" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="2 2"/>

  <text x="15" y="310" fill="#475569" font-size="7" font-family="monospace">BLUEPRINT // PERSISTENT CARRIER ROUTING CONNECTIONS</text>
  <text x="425" y="310" fill="#475569" font-size="7" font-family="monospace" text-anchor="end">3GPP N2/N3 STANDARDS</text>
</svg>