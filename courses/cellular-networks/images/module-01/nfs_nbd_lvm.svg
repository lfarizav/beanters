<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="gcyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8"/><stop offset="100%" style="stop-color:#0369a1"/></linearGradient>
    <linearGradient id="ggreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399"/><stop offset="100%" style="stop-color:#047857"/></linearGradient>
    <linearGradient id="gyellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/><stop offset="100%" style="stop-color:#b45309"/></linearGradient>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/></marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.4"/></pattern>
  </defs>
  <rect width="800" height="500" fill="#0a0f1d"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <rect x="15" y="15" width="770" height="470" rx="8" fill="none" stroke="#1e293b" stroke-width="1.5" opacity="0.6"/>
  <text x="400" y="42" text-anchor="middle" fill="#38bdf8" font-size="17" font-weight="bold" font-family="sans-serif">NFS · NBD · LVM</text>
  <text x="400" y="62" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="sans-serif">Network Storage · Block Device · Logical Volume Management | LFCS Essential</text>
  <!-- Panel 1: NFS (cyan) -->
  <rect x="22" y="78" width="238" height="300" rx="6" fill="url(#gcyan)" filter="url(#glow)" opacity="0.9"/>
  <text x="141" y="98" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold" font-family="sans-serif">
    <tspan x="141" dy="0">NFS — Network Filesystem</tspan>
    <tspan x="141" dy="15" font-size="9" font-family="monospace" fill="#e0f2fe">Server: /etc/exports</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe"> /data 192.168.1.0/24(rw,sync)</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe"> /share *(ro,no_subtree_check)</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">exportfs -rav (apply)</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">exportfs -v (list)</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">systemctl start nfs-server</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">Client: mount server:/path</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe"> mount -t nfs4 srv:/d /mnt</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">showmount -e server</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">autofs /etc/auto.master</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">/etc/fstab: _netdev flag</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">NFS port: 2049/tcp/udp</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">Kerberos: sec=krb5p</tspan>
  </text>
  <!-- Arrow 1→2 -->
  <line x1="260" y1="228" x2="270" y2="228" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arw)"/>
  <!-- Panel 2: LVM (yellow) -->
  <rect x="280" y="78" width="238" height="300" rx="6" fill="url(#gyellow)" filter="url(#glow)" opacity="0.9"/>
  <text x="399" y="98" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold" font-family="sans-serif">
    <tspan x="399" dy="0">LVM — Logical Volumes</tspan>
    <tspan x="399" dy="15" font-size="9" font-family="monospace" fill="#fef3c7">pvcreate /dev/sdb</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">pvdisplay / pvs</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">vgcreate vg0 /dev/sdb</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">vgextend vg0 /dev/sdc</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">vgdisplay / vgs</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">lvcreate -L 10G -n lv0 vg0</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">lvcreate -l 100%FREE vg0</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">lvextend -L +5G /dev/vg0/lv0</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">resize2fs /dev/vg0/lv0</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">lvdisplay / lvs</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">lvcreate -s -n snap lv (snap)</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">pvmove /dev/sdb (migrate)</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">vgreduce vg0 /dev/sdb</tspan>
  </text>
  <!-- Arrow 2→3 -->
  <line x1="518" y1="228" x2="528" y2="228" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arw)"/>
  <!-- Panel 3: NBD+iSCSI (green) -->
  <rect x="538" y="78" width="238" height="300" rx="6" fill="url(#ggreen)" filter="url(#glow)" opacity="0.9"/>
  <text x="657" y="98" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold" font-family="sans-serif">
    <tspan x="657" dy="0">NBD · iSCSI</tspan>
    <tspan x="657" dy="15" font-size="9" font-family="monospace" fill="#d1fae5">NBD: Network Block Device</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">nbd-server 10809 /img.qcow2</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">modprobe nbd max_part=8</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">qemu-nbd -c /dev/nbd0 img</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">nbd-client srv 10809 /dev/nbd1</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">qemu-nbd -d /dev/nbd0</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">iSCSI target: targetcli</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">iSCSI initiator: iscsiadm</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">iscsiadm -m discovery</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">iscsiadm -m node -L all</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">Samba/CIFS: smb.conf</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">mount -t cifs //srv/share</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">smbclient -L server</tspan>
  </text>
  <!-- Footer -->
  <rect x="22" y="393" width="756" height="78" rx="6" fill="url(#gcyan)" filter="url(#glow)" opacity="0.9"/>
  <text x="400" y="411" text-anchor="middle" fill="#e2e8f0" font-size="10" font-family="monospace">
    <tspan x="400" dy="0">LVM stack: PV(disk) → VG(pool) → LV(volume) → mkfs → mount | Online resize: lvextend+resize2fs</tspan>
    <tspan x="400" dy="15">LFCS: pvcreate | vgcreate | lvcreate -L | lvextend | resize2fs | exportfs -rav | showmount</tspan>
    <tspan x="400" dy="15">NFS options: rw/ro sync/async no_subtree_check root_squash no_root_squash | sec=krb5p</tspan>
  </text>
</svg>
