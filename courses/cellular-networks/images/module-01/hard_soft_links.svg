<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="gcyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8"/><stop offset="100%" style="stop-color:#0369a1"/></linearGradient>
    <linearGradient id="ggreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399"/><stop offset="100%" style="stop-color:#047857"/></linearGradient>
    <linearGradient id="gyellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/><stop offset="100%" style="stop-color:#b45309"/></linearGradient>
    <linearGradient id="gpurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa"/><stop offset="100%" style="stop-color:#4338ca"/></linearGradient>
    <linearGradient id="gred" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f87171"/><stop offset="100%" style="stop-color:#be123c"/></linearGradient>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/></marker>
    <marker id="arwg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399"/></marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.4"/></pattern>
  </defs>
  <rect width="800" height="500" fill="#0a0f1d"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <rect x="15" y="15" width="770" height="470" rx="8" fill="none" stroke="#1e293b" stroke-width="1.5" opacity="0.6"/>
  <rect x="310" y="90" width="180" height="60" rx="6" fill="url(#gcyan)" filter="url(#glow)" opacity="0.9"/>
  <text x="400" y="117" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold" font-family="sans-serif">Inode #4821</text>
  <text x="400" y="133" text-anchor="middle" fill="#e2e8f0" font-size="10" font-family="monospace">data: file content</text>
  <rect x="80" y="200" width="155" height="55" rx="6" fill="url(#ggreen)" filter="url(#glow)" opacity="0.9"/>
  <text x="157" y="222" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" font-family="sans-serif">file_a.txt</text>
  <text x="157" y="238" text-anchor="middle" fill="#d1fae5" font-size="10" font-family="monospace">→ Inode #4821</text>
  <rect x="265" y="200" width="155" height="55" rx="6" fill="url(#ggreen)" filter="url(#glow)" opacity="0.9"/>
  <text x="342" y="222" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" font-family="sans-serif">file_b.txt  (hard)</text>
  <text x="342" y="238" text-anchor="middle" fill="#d1fae5" font-size="10" font-family="monospace">→ Inode #4821</text>
  <rect x="460" y="200" width="155" height="55" rx="6" fill="url(#gyellow)" filter="url(#glow)" opacity="0.9"/>
  <text x="537" y="222" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" font-family="sans-serif">symlink.txt (soft)</text>
  <text x="537" y="238" text-anchor="middle" fill="#fef3c7" font-size="10" font-family="monospace">→ /path/file_a.txt</text>
  <line x1='157' y1='200' x2='360' y2='152' stroke='#34d399' stroke-width='2' marker-end='url(#arwg)'/>
  <line x1='342' y1='200' x2='395' y2='152' stroke='#34d399' stroke-width='2' marker-end='url(#arwg)'/>
  <line x1='537' y1='200' x2='450' y2='152' stroke='#fbbf24' stroke-width='2' stroke-dasharray='6,3' marker-end='url(#arw)'/>
  <text x="240" y="192" text-anchor="middle" fill="#34d399" font-size="9" font-family="monospace">ln src hard</text>
  <text x="500" y="192" text-anchor="middle" fill="#fbbf24" font-size="9" font-family="monospace">ln -s src sym</text>
  <text x="400" y="40" text-anchor="middle" fill="#38bdf8" font-size="18" font-weight="bold" font-family="sans-serif">Hard Links vs Soft Links</text>
  <text x="400" y="60" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="sans-serif">Inode-based vs Path-based resolution</text>
  <rect x="40" y="295" width="330" height="165" rx="6" fill="url(#gcyan)" filter="url(#glow)" opacity="0.9"/>
  <text x="205" y="320" text-anchor="middle" fill="#e2e8f0" font-size="10" font-family="sans-serif">
    <tspan x="205" dy="0">HARD LINK</tspan>
    <tspan x="205" dy="15">  ln file_a file_b</tspan>
    <tspan x="205" dy="15">· Same inode — both names equal</tspan>
    <tspan x="205" dy="15">· Survives original file deletion</tspan>
    <tspan x="205" dy="15">· Link count (nlink) increases</tspan>
    <tspan x="205" dy="15">· Cannot cross filesystem boundaries</tspan>
    <tspan x="205" dy="15">  ls -li (show inode numbers)</tspan>
  </text>
  <rect x="400" y="295" width="355" height="165" rx="6" fill="url(#gyellow)" filter="url(#glow)" opacity="0.9"/>
  <text x="577" y="320" text-anchor="middle" fill="#fff" font-size="10" font-family="sans-serif">
    <tspan x="577" dy="0">SOFT LINK (symlink)</tspan>
    <tspan x="577" dy="15">  ln -s /path/file_a symlink</tspan>
    <tspan x="577" dy="15">· Points to a path, not an inode</tspan>
    <tspan x="577" dy="15">· Breaks if target is deleted</tspan>
    <tspan x="577" dy="15">· Can cross filesystems</tspan>
    <tspan x="577" dy="15">· Shows lrwxrwxrwx in ls -l</tspan>
    <tspan x="577" dy="15">  readlink symlink (show target)</tspan>
  </text>
  <text x="400" y="480" text-anchor="middle" fill="#64748b" font-size="9" font-family="monospace">stat file (inode, links) | find / -inum 4821 (find by inode) | unlink file (delete)</text>
</svg>