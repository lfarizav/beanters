<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="gcyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8"/><stop offset="100%" style="stop-color:#0369a1"/></linearGradient>
    <linearGradient id="ggreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399"/><stop offset="100%" style="stop-color:#047857"/></linearGradient>
    <linearGradient id="gyellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/><stop offset="100%" style="stop-color:#b45309"/></linearGradient>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/></marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.4"/></pattern>
  </defs>
  <rect width="800" height="500" fill="#0a0f1d"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <rect x="15" y="15" width="770" height="470" rx="8" fill="none" stroke="#1e293b" stroke-width="1.5" opacity="0.6"/>
  <text x="400" y="42" text-anchor="middle" fill="#38bdf8" font-size="17" font-weight="bold" font-family="sans-serif">I/O Redirection &amp; Pipelines</text>
  <text x="400" y="62" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="sans-serif">stdin/stdout/stderr · Redirects · Pipes · Here-Doc | LFCS Essential</text>
  <!-- Panel 1: Redirects (cyan) -->
  <rect x="22" y="78" width="238" height="300" rx="6" fill="url(#gcyan)" filter="url(#glow)" opacity="0.9"/>
  <text x="141" y="98" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold" font-family="sans-serif">
    <tspan x="141" dy="0">Redirects</tspan>
    <tspan x="141" dy="15" font-size="9" font-family="monospace" fill="#e0f2fe">fd: 0=stdin 1=stdout 2=stderr</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">cmd &gt; file  (stdout overwrite)</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">cmd &gt;&gt; file  (stdout append)</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">cmd 2&gt; err.log (stderr)</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">cmd 2&gt;&gt; err.log (append)</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">cmd &amp;&gt; all.log (both)</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">cmd 2&gt;&amp;1 (merge err→out)</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">cmd &gt; /dev/null 2&gt;&amp;1</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">cmd &lt; infile (stdin)</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">cmd &lt;&gt; file (r/w)</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">exec 3&gt;file; echo &gt;&amp;3</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">exec 3&lt;&amp;-  (close fd)</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">noclobber: set -o</tspan>
  </text>
  <!-- Arrow 1→2 -->
  <line x1="260" y1="228" x2="270" y2="228" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arw)"/>
  <!-- Panel 2: Pipes (green) -->
  <rect x="280" y="78" width="238" height="300" rx="6" fill="url(#ggreen)" filter="url(#glow)" opacity="0.9"/>
  <text x="399" y="98" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold" font-family="sans-serif">
    <tspan x="399" dy="0">Pipes &amp; Filters</tspan>
    <tspan x="399" dy="15" font-size="9" font-family="monospace" fill="#d1fae5">cmd1 | cmd2 (pipe stdout)</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">cmd1 |&amp; cmd2 (stdout+err)</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">tee file (split stream)</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">tee -a file (append)</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">xargs cmd (args from pipe)</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">xargs -n1 (one at a time)</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">xargs -I{} cmd {}</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">xargs -P4 (parallel)</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">sort | uniq -c | sort -rn</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">cut -d: -f1 /etc/passwd</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">tr 'a-z' 'A-Z' (translate)</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">paste file1 file2</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">wc -l/-w/-c count</tspan>
  </text>
  <!-- Arrow 2→3 -->
  <line x1="518" y1="228" x2="528" y2="228" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arw)"/>
  <!-- Panel 3: Here-Doc + Process Sub (yellow) -->
  <rect x="538" y="78" width="238" height="300" rx="6" fill="url(#gyellow)" filter="url(#glow)" opacity="0.9"/>
  <text x="657" y="98" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold" font-family="sans-serif">
    <tspan x="657" dy="0">Here-Doc · Process Sub</tspan>
    <tspan x="657" dy="15" font-size="9" font-family="monospace" fill="#fef3c7">cat &lt;&lt;EOF</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fef3c7"> multi-line text</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">EOF</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">cat &lt;&lt;'EOF' (no expand)</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">ssh host &lt;&lt;EOF ... EOF</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">cmd &lt;&lt;&lt;"string" (here-str)</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">diff &lt;(cmd1) &lt;(cmd2)</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">tee &gt;(gzip &gt; out.gz)</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">$(cmd) command substitution</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">`cmd` legacy subshell</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">{ cmd1; cmd2; } group</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">( cmd1; cmd2 ) subshell</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">named pipe: mkfifo /tmp/p</tspan>
  </text>
  <!-- Footer -->
  <rect x="22" y="393" width="756" height="78" rx="6" fill="url(#gcyan)" filter="url(#glow)" opacity="0.9"/>
  <text x="400" y="411" text-anchor="middle" fill="#e2e8f0" font-size="10" font-family="monospace">
    <tspan x="400" dy="0">Streams: 0=stdin 1=stdout 2=stderr | Merge: 2&gt;&amp;1 | Silence: &gt;/dev/null 2&gt;&amp;1</tspan>
    <tspan x="400" dy="15">LFCS: cmd &gt; out 2&gt;err | tee -a log | xargs -I{} | diff &lt;(sort f1) &lt;(sort f2)</tspan>
    <tspan x="400" dy="15">Pipeline: ps aux | grep nginx | awk '{print $2}' | xargs kill -9</tspan>
  </text>
</svg>
