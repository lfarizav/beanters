<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 330">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.3"/>
    </pattern>
    <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="440" height="330" fill="url(#grid)" rx="6"/>
  <text x="15" y="22" fill="#38bdf8" font-size="8" font-family="monospace" letter-spacing="1">CLI.PARSING // AWK &amp; SED LOG STREAMING FILTER</text>
  <line x1="15" y1="26" x2="425" y2="26" stroke="#38bdf8" stroke-width="1" opacity="0.2"/>

  <!-- Step 1: Input stream -->
  <g transform="translate(15, 120)">
    <rect width="70" height="42" rx="4" fill="url(#grad-cyan)" stroke="#06b6d4" stroke-width="1.2" filter="url(#glow-cyan)"/>
    <text x="35" y="18" fill="#22d3ee" font-size="8.5" font-weight="bold" font-family="sans-serif" text-anchor="middle">journalctl</text>
    <text x="35" y="32" fill="#cbd5e1" font-size="6.5" font-family="sans-serif" text-anchor="middle">AMF logs</text>
  </g>

  <!-- Step 2: grep filter -->
  <g transform="translate(110, 120)">
    <rect width="65" height="42" rx="4" fill="#0b1329" stroke="#334155" stroke-width="1.2"/>
    <text x="32.5" y="18" fill="#cbd5e1" font-size="8" font-weight="bold" font-family="sans-serif" text-anchor="middle">grep Reject</text>
    <text x="32.5" y="32" fill="#64748b" font-size="6" font-family="monospace" text-anchor="middle">L4 filters</text>
  </g>

  <!-- Step 3: awk columns -->
  <g transform="translate(200, 120)">
    <rect width="65" height="42" rx="4" fill="url(#grad-cyan)" stroke="#06b6d4" stroke-width="1.2"/>
    <text x="32.5" y="16" fill="#e2e8f0" font-size="8.5" font-weight="bold" font-family="sans-serif" text-anchor="middle">awk print</text>
    <text x="32.5" y="26" fill="#cbd5e1" font-size="6" font-family="monospace" text-anchor="middle">col 8, 10</text>
    <text x="32.5" y="34" fill="#0891b2" font-size="5" font-family="monospace" text-anchor="middle">IMSI + Cause</text>
  </g>

  <!-- Step 4: sort/uniq metrics -->
  <g transform="translate(290, 120)">
    <rect width="60" height="42" rx="4" fill="url(#grad-green)" stroke="#10b981" stroke-width="1.2"/>
    <text x="30" y="18" fill="#a7f3d0" font-size="8.5" font-weight="bold" font-family="sans-serif" text-anchor="middle">uniq -c</text>
    <text x="30" y="32" fill="#cbd5e1" font-size="6" font-family="monospace" text-anchor="middle">Rankings</text>
  </g>

  <!-- Step 5: output result -->
  <g transform="translate(365, 115)">
    <rect width="60" height="52" rx="4" fill="url(#grad-green)" stroke="#10b981" stroke-width="1.2"/>
    <text x="30" y="16" fill="#a7f3d0" font-size="8.5" font-weight="bold" font-family="sans-serif" text-anchor="middle">Metrics</text>
    <text x="30" y="28" fill="#cbd5e1" font-size="6" font-family="monospace" text-anchor="middle">15 IMSI_001</text>
    <text x="30" y="38" fill="#cbd5e1" font-size="6" font-family="monospace" text-anchor="middle">8 IMSI_002</text>
  </g>

  <!-- Connectors -->
  <line x1="85" y1="141" x2="110" y2="141" stroke="#06b6d4" stroke-width="1.2"/>
  <line x1="175" y1="141" x2="200" y2="141" stroke="#06b6d4" stroke-width="1.2"/>
  <line x1="265" y1="141" x2="290" y2="141" stroke="#10b981" stroke-width="1.2"/>
  <line x1="350" y1="141" x2="365" y2="141" stroke="#10b981" stroke-width="1.2"/>

  <!-- Command line sample overlay -->
  <g transform="translate(15, 205)">
    <rect width="410" height="34" rx="3" fill="#0b1329" stroke="#1e293b" stroke-width="1"/>
    <text x="15" y="16" fill="#22d3ee" font-size="6.5" font-family="monospace">journalctl -u open5gs-amfd | grep "Reject" | awk '{print $8, $10}' | sort | uniq -c</text>
    <text x="15" y="26" fill="#64748b" font-size="6" font-family="sans-serif">Automated pipeline parsing core logs directly from journald in seconds</text>
  </g>

  <text x="15" y="310" fill="#475569" font-size="7" font-family="monospace">BLUEPRINT // LOG STREAMING PIPELINES PIPES</text>
  <text x="425" y="310" fill="#475569" font-size="7" font-family="monospace" text-anchor="end">UNIX PIPELINES SPEC REFERENCE</text>
</svg>