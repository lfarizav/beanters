<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="gcyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8"/><stop offset="100%" style="stop-color:#0369a1"/></linearGradient>
    <linearGradient id="ggreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399"/><stop offset="100%" style="stop-color:#047857"/></linearGradient>
    <linearGradient id="gyellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/><stop offset="100%" style="stop-color:#b45309"/></linearGradient>
    <linearGradient id="gpurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa"/><stop offset="100%" style="stop-color:#4338ca"/></linearGradient>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/></marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.4"/></pattern>
  </defs>
  <rect width="800" height="500" fill="#0a0f1d"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <rect x="15" y="15" width="770" height="470" rx="8" fill="none" stroke="#1e293b" stroke-width="1.5" opacity="0.6"/>
  <text x="400" y="42" text-anchor="middle" fill="#38bdf8" font-size="17" font-weight="bold" font-family="sans-serif">Git Workflow Reference</text>
  <text x="400" y="62" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="sans-serif">Init · Stage · Commit · Branch · Merge · History | LFCS Essential</text>
  <!-- Panel 1: Init+Stage (cyan) -->
  <rect x="22" y="78" width="178" height="300" rx="6" fill="url(#gcyan)" filter="url(#glow)" opacity="0.9"/>
  <text x="111" y="98" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold" font-family="sans-serif">
    <tspan x="111" dy="0">Init &amp; Stage</tspan>
    <tspan x="111" dy="15" font-size="9" font-family="monospace" fill="#e0f2fe">git init</tspan>
    <tspan x="111" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">git clone &lt;url&gt;</tspan>
    <tspan x="111" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">git clone --depth 1</tspan>
    <tspan x="111" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">git status</tspan>
    <tspan x="111" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">git add file</tspan>
    <tspan x="111" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">git add -p (patch)</tspan>
    <tspan x="111" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">git add -A (all)</tspan>
    <tspan x="111" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">git rm file</tspan>
    <tspan x="111" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">git mv old new</tspan>
    <tspan x="111" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">git restore file</tspan>
    <tspan x="111" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">git restore --staged</tspan>
    <tspan x="111" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">.gitignore patterns</tspan>
    <tspan x="111" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">git config user.email</tspan>
  </text>
  <!-- Arrow 1→2 -->
  <line x1="200" y1="228" x2="210" y2="228" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arw)"/>
  <!-- Panel 2: Commit+Remote (green) -->
  <rect x="212" y="78" width="178" height="300" rx="6" fill="url(#ggreen)" filter="url(#glow)" opacity="0.9"/>
  <text x="301" y="98" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold" font-family="sans-serif">
    <tspan x="301" dy="0">Commit &amp; Remote</tspan>
    <tspan x="301" dy="15" font-size="9" font-family="monospace" fill="#d1fae5">git commit -m "msg"</tspan>
    <tspan x="301" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">git commit --amend</tspan>
    <tspan x="301" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">git push origin main</tspan>
    <tspan x="301" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">git push -u origin feat</tspan>
    <tspan x="301" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">git pull (fetch+merge)</tspan>
    <tspan x="301" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">git fetch origin</tspan>
    <tspan x="301" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">git remote -v</tspan>
    <tspan x="301" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">git remote add origin</tspan>
    <tspan x="301" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">git tag v1.0</tspan>
    <tspan x="301" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">git tag -a v1.0 -m "..."</tspan>
    <tspan x="301" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">git push --tags</tspan>
    <tspan x="301" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">git cherry-pick &lt;sha&gt;</tspan>
    <tspan x="301" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">git shortlog -sn</tspan>
  </text>
  <!-- Arrow 2→3 -->
  <line x1="390" y1="228" x2="400" y2="228" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arw)"/>
  <!-- Panel 3: Branch+Merge (yellow) -->
  <rect x="402" y="78" width="178" height="300" rx="6" fill="url(#gyellow)" filter="url(#glow)" opacity="0.9"/>
  <text x="491" y="98" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold" font-family="sans-serif">
    <tspan x="491" dy="0">Branch &amp; Merge</tspan>
    <tspan x="491" dy="15" font-size="9" font-family="monospace" fill="#fef3c7">git branch feat/x</tspan>
    <tspan x="491" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">git checkout feat/x</tspan>
    <tspan x="491" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">git switch -c feat/x</tspan>
    <tspan x="491" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">git branch -d feat/x</tspan>
    <tspan x="491" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">git branch -a (all)</tspan>
    <tspan x="491" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">git merge feat/x</tspan>
    <tspan x="491" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">git merge --no-ff</tspan>
    <tspan x="491" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">git merge --squash</tspan>
    <tspan x="491" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">git rebase main</tspan>
    <tspan x="491" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">git rebase -i HEAD~3</tspan>
    <tspan x="491" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">git mergetool</tspan>
    <tspan x="491" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">git stash / pop</tspan>
    <tspan x="491" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">git stash list</tspan>
  </text>
  <!-- Arrow 3→4 -->
  <line x1="580" y1="228" x2="590" y2="228" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arw)"/>
  <!-- Panel 4: History+Undo (purple) -->
  <rect x="592" y="78" width="178" height="300" rx="6" fill="url(#gpurple)" filter="url(#glow)" opacity="0.9"/>
  <text x="681" y="98" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold" font-family="sans-serif">
    <tspan x="681" dy="0">History &amp; Undo</tspan>
    <tspan x="681" dy="15" font-size="9" font-family="monospace" fill="#ede9fe">git log --oneline</tspan>
    <tspan x="681" dy="13" font-size="9" font-family="monospace" fill="#ede9fe">git log --graph --all</tspan>
    <tspan x="681" dy="13" font-size="9" font-family="monospace" fill="#ede9fe">git log -p file (diff)</tspan>
    <tspan x="681" dy="13" font-size="9" font-family="monospace" fill="#ede9fe">git diff HEAD~1</tspan>
    <tspan x="681" dy="13" font-size="9" font-family="monospace" fill="#ede9fe">git diff --staged</tspan>
    <tspan x="681" dy="13" font-size="9" font-family="monospace" fill="#ede9fe">git blame file</tspan>
    <tspan x="681" dy="13" font-size="9" font-family="monospace" fill="#ede9fe">git bisect start/good/bad</tspan>
    <tspan x="681" dy="13" font-size="9" font-family="monospace" fill="#ede9fe">git revert &lt;sha&gt;</tspan>
    <tspan x="681" dy="13" font-size="9" font-family="monospace" fill="#ede9fe">git reset --soft HEAD~1</tspan>
    <tspan x="681" dy="13" font-size="9" font-family="monospace" fill="#ede9fe">git reset --hard HEAD~1</tspan>
    <tspan x="681" dy="13" font-size="9" font-family="monospace" fill="#ede9fe">git reflog (all history)</tspan>
    <tspan x="681" dy="13" font-size="9" font-family="monospace" fill="#ede9fe">git show &lt;sha&gt;</tspan>
    <tspan x="681" dy="13" font-size="9" font-family="monospace" fill="#ede9fe">git clean -fd</tspan>
  </text>
  <!-- Footer -->
  <rect x="22" y="393" width="756" height="78" rx="6" fill="url(#gcyan)" filter="url(#glow)" opacity="0.9"/>
  <text x="400" y="411" text-anchor="middle" fill="#e2e8f0" font-size="10" font-family="monospace">
    <tspan x="400" dy="0">Areas: Working Tree → Index (Stage) → Local Repo → Remote Repo</tspan>
    <tspan x="400" dy="15">LFCS: git init | add -p | commit -m | push | branch | merge | rebase -i | stash | log --graph</tspan>
    <tspan x="400" dy="15">Safe undo: revert(new commit) | reset --soft(keep stage) | restore(discard working tree)</tspan>
  </text>
</svg>
