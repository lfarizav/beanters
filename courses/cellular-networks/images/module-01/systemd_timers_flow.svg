<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 330">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.3"/>
    </pattern>
    <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.02"/>
    </linearGradient>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06b6d4"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="440" height="330" fill="url(#grid)" rx="6"/>
  <text x="15" y="22" fill="#38bdf8" font-size="8" font-family="monospace" letter-spacing="1">CRON.TIMER // SYSTEMD AUTOMATION TIMERS</text>
  <line x1="15" y1="26" x2="425" y2="26" stroke="#38bdf8" stroke-width="1" opacity="0.2"/>

  <!-- Actor Boxes -->
  <g transform="translate(25, 40)">
    <rect width="70" height="20" rx="3" fill="url(#grad-cyan)" stroke="#06b6d4" stroke-width="1"/>
    <text x="35" y="12" fill="#22d3ee" font-size="7.5" font-weight="bold" font-family="sans-serif" text-anchor="middle">5g-backup.timer</text>
  </g>
  <g transform="translate(130, 40)">
    <rect width="70" height="20" rx="3" fill="url(#grad-cyan)" stroke="#06b6d4" stroke-width="1"/>
    <text x="35" y="12" fill="#cbd5e1" font-size="7.5" font-weight="bold" font-family="sans-serif" text-anchor="middle">systemd daemon</text>
  </g>
  <g transform="translate(235, 40)">
    <rect width="70" height="20" rx="3" fill="url(#grad-cyan)" stroke="#06b6d4" stroke-width="1"/>
    <text x="35" y="12" fill="#cbd5e1" font-size="7.5" font-weight="bold" font-family="sans-serif" text-anchor="middle">backup-5g.sh</text>
  </g>
  <g transform="translate(340, 40)">
    <rect width="70" height="20" rx="3" fill="url(#grad-cyan)" stroke="#06b6d4" stroke-width="1"/>
    <text x="35" y="12" fill="#cbd5e1" font-size="7.5" font-weight="bold" font-family="sans-serif" text-anchor="middle">journald logs</text>
  </g>

  <!-- Lifelines -->
  <line x1="60" y1="60" x2="60" y2="280" stroke="#475569" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="165" y1="60" x2="165" y2="280" stroke="#475569" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="270" y1="60" x2="270" y2="280" stroke="#475569" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="375" y1="60" x2="375" y2="280" stroke="#475569" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Steps -->
  <!-- Timer Fires -->
  <line x1="60" y1="90" x2="165" y2="90" stroke="#06b6d4" stroke-width="1.2" marker-end="url(#arr-cyan)"/>
  <text x="112.5" y="84" fill="#22d3ee" font-size="6.5" font-family="monospace" text-anchor="middle">OnCalendar 02:00 fires</text>

  <!-- systemd executes script -->
  <line x1="165" y1="125" x2="270" y2="125" stroke="#06b6d4" stroke-width="1.2" marker-end="url(#arr-cyan)"/>
  <text x="217.5" y="119" fill="#22d3ee" font-size="6.5" font-family="monospace" text-anchor="middle">ExecStart (User=operator5g)</text>

  <!-- Backup Execution -->
  <line x1="270" y1="160" x2="270" y2="200" stroke="#475569" stroke-width="1"/>
  <path d="M 270,200 Q 285,180 270,175" fill="none" stroke="#475569" stroke-width="1"/>
  <text x="282" y="187" fill="#cbd5e1" font-size="6" font-family="monospace" text-anchor="start">cp configs to backup/</text>

  <!-- Script finishes -->
  <line x1="270" y1="220" x2="165" y2="220" stroke="#10b981" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <text x="217.5" y="214" fill="#34d399" font-size="6.5" font-family="monospace" text-anchor="middle">exit 0 (Success)</text>

  <!-- Logging finished -->
  <line x1="165" y1="245" x2="375" y2="245" stroke="#10b981" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <text x="270" y="239" fill="#34d399" font-size="6.5" font-family="monospace" text-anchor="middle">unit finished OK logged</text>

  <!-- Note over logger -->
  <g transform="translate(300, 260)">
    <rect width="130" height="20" rx="2" fill="#0b1329" stroke="#1e293b" stroke-width="1"/>
    <text x="65" y="12" fill="#94a3b8" font-size="6" font-family="monospace" text-anchor="middle">journalctl -u 5g-backup</text>
  </g>

  <text x="15" y="310" fill="#475569" font-size="7" font-family="monospace">BLUEPRINT // CHRONOLOGICAL SYSTEMD TIMER LIFECYCLE PATH</text>
  <text x="425" y="310" fill="#475569" font-size="7" font-family="monospace" text-anchor="end">SYSTEMD TIMER SPEC</text>
</svg>