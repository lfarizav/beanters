<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 330">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.3"/>
    </pattern>
    <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.02"/>
    </linearGradient>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06b6d4"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="440" height="330" fill="url(#grid)" rx="6"/>
  <text x="15" y="22" fill="#38bdf8" font-size="8" font-family="monospace" letter-spacing="1">SEC.SSH // HARDENED SSH PUBLIC KEY EXCHANGE</text>
  <line x1="15" y1="26" x2="425" y2="26" stroke="#38bdf8" stroke-width="1" opacity="0.2"/>

  <!-- Actor Boxes -->
  <g transform="translate(30, 40)">
    <rect width="60" height="20" rx="3" fill="url(#grad-cyan)" stroke="#06b6d4" stroke-width="1"/>
    <text x="30" y="12" fill="#22d3ee" font-size="8" font-weight="bold" font-family="sans-serif" text-anchor="middle">Operator</text>
  </g>
  <g transform="translate(130, 40)">
    <rect width="60" height="20" rx="3" fill="url(#grad-cyan)" stroke="#06b6d4" stroke-width="1"/>
    <text x="30" y="12" fill="#cbd5e1" font-size="8" font-weight="bold" font-family="sans-serif" text-anchor="middle">sshd (2222)</text>
  </g>
  <g transform="translate(230, 40)">
    <rect width="60" height="20" rx="3" fill="url(#grad-cyan)" stroke="#06b6d4" stroke-width="1"/>
    <text x="30" y="12" fill="#cbd5e1" font-size="8" font-weight="bold" font-family="sans-serif" text-anchor="middle">Auth keys</text>
  </g>
  <g transform="translate(330, 40)">
    <rect width="60" height="20" rx="3" fill="url(#grad-green)" stroke="#10b981" stroke-width="1"/>
    <text x="30" y="12" fill="#a7f3d0" font-size="8" font-weight="bold" font-family="sans-serif" text-anchor="middle">sudoers</text>
  </g>

  <!-- Lifelines -->
  <line x1="60" y1="60" x2="60" y2="280" stroke="#475569" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="160" y1="60" x2="160" y2="280" stroke="#475569" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="260" y1="60" x2="260" y2="280" stroke="#475569" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="360" y1="60" x2="360" y2="280" stroke="#475569" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Sequence Steps -->
  <!-- Step 1: Connect -->
  <line x1="60" y1="85" x2="160" y2="85" stroke="#06b6d4" stroke-width="1.2" marker-end="url(#arr-cyan)"/>
  <text x="110" y="79" fill="#22d3ee" font-size="6.5" font-family="monospace" text-anchor="middle">Connect: Port 2222</text>

  <!-- Step 2: Request pubkey -->
  <line x1="160" y1="115" x2="60" y2="115" stroke="#06b6d4" stroke-width="1.2" marker-end="url(#arr-cyan)"/>
  <text x="110" y="109" fill="#22d3ee" font-size="6.5" font-family="monospace" text-anchor="middle">Request Pubkey Auth</text>

  <!-- Step 3: Present key -->
  <line x1="60" y1="145" x2="160" y2="145" stroke="#06b6d4" stroke-width="1.2" marker-end="url(#arr-cyan)"/>
  <text x="110" y="139" fill="#22d3ee" font-size="6.5" font-family="monospace" text-anchor="middle">Send Ed25519 Pubkey</text>

  <!-- Step 4: Verify -->
  <line x1="160" y1="175" x2="260" y2="175" stroke="#475569" stroke-width="1" stroke-dasharray="2 2" marker-end="url(#arr-cyan)"/>
  <text x="210" y="169" fill="#cbd5e1" font-size="6.5" font-family="monospace" text-anchor="middle">authorized_keys lookup</text>

  <line x1="260" y1="205" x2="160" y2="205" stroke="#10b981" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <text x="210" y="199" fill="#34d399" font-size="6.5" font-family="monospace" text-anchor="middle">Valid Key ✅</text>

  <!-- Step 5: Sudo restirction check -->
  <line x1="160" y1="235" x2="360" y2="235" stroke="#10b981" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <text x="260" y="229" fill="#34d399" font-size="6.5" font-family="monospace" text-anchor="middle">Sudo execution checked</text>

  <line x1="360" y1="260" x2="60" y2="260" stroke="#10b981" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <text x="210" y="254" fill="#34d399" font-size="6.5" font-family="monospace" text-anchor="middle">Restart open5gs-amfd OK (NOPASSWD)</text>

  <text x="15" y="310" fill="#475569" font-size="7" font-family="monospace">BLUEPRINT // HARDENED SSH SIGNING PROTOCOL SEQUENCE</text>
  <text x="425" y="310" fill="#475569" font-size="7" font-family="monospace" text-anchor="end">RFC 4251 SSH ARCHITECTURE SPEC</text>
</svg>