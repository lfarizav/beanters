<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="gcyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8"/><stop offset="100%" style="stop-color:#0369a1"/></linearGradient>
    <linearGradient id="ggreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399"/><stop offset="100%" style="stop-color:#047857"/></linearGradient>
    <linearGradient id="gyellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/><stop offset="100%" style="stop-color:#b45309"/></linearGradient>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/></marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.4"/></pattern>
  </defs>
  <rect width="800" height="500" fill="#0a0f1d"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <rect x="15" y="15" width="770" height="470" rx="8" fill="none" stroke="#1e293b" stroke-width="1.5" opacity="0.6"/>
  <text x="400" y="42" text-anchor="middle" fill="#38bdf8" font-size="17" font-weight="bold" font-family="sans-serif">Linux File Permissions</text>
  <text x="400" y="62" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="sans-serif">rwx Bits · Octal Notation · Special Flags · ACL | LFCS Essential</text>
  <!-- Panel 1: Permission Structure (cyan) x=22,y=78,w=238,h=300 -->
  <rect x="22" y="78" width="238" height="300" rx="6" fill="url(#gcyan)" filter="url(#glow)" opacity="0.9"/>
  <text x="141" y="98" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold" font-family="sans-serif">
    <tspan x="141" dy="0">Permission Structure</tspan>
    <tspan x="141" dy="15" font-size="9" font-family="monospace" fill="#e0f2fe">-rwxr-xr-- user group</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">│└┬┘└┬┘└┬┘</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">│ u   g   o  (owner/grp/other)</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">type: - file  d dir  l link</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">r=4  w=2  x=1  -=0</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">rwx=7 r-x=5 r--=4</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">chmod 755: u=7 g=5 o=5</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">chmod 644: u=6 g=4 o=4</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">chmod 600: owner rw only</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">umask 022 → default 644</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">ls -l: view permissions</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">stat file: full inode info</tspan>
    <tspan x="141" dy="13" font-size="9" font-family="monospace" fill="#e0f2fe">find -perm 644 -type f</tspan>
  </text>
  <!-- Arrow 1→2 -->
  <line x1="260" y1="228" x2="270" y2="228" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arw)"/>
  <!-- Panel 2: chmod/chown (green) x=280,y=78,w=238,h=300 -->
  <rect x="280" y="78" width="238" height="300" rx="6" fill="url(#ggreen)" filter="url(#glow)" opacity="0.9"/>
  <text x="399" y="98" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold" font-family="sans-serif">
    <tspan x="399" dy="0">chmod · chown · chgrp</tspan>
    <tspan x="399" dy="15" font-size="9" font-family="monospace" fill="#d1fae5">chmod u+x file</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">chmod go-w file</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">chmod a=r file</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">chmod -R 755 dir/</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">chown user:group file</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">chown -R root:root dir/</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">chgrp developers file</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">chmod +t /tmp  (sticky)</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">chmod u+s /usr/bin/su</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">chmod g+s /shared/dir</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">lsattr / chattr +i file</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">find / -perm /4000 -ls</tspan>
    <tspan x="399" dy="13" font-size="9" font-family="monospace" fill="#d1fae5">getfattr -n user.x file</tspan>
  </text>
  <!-- Arrow 2→3 -->
  <line x1="518" y1="228" x2="528" y2="228" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arw)"/>
  <!-- Panel 3: Special Bits + ACL (yellow) x=538,y=78,w=238,h=300 -->
  <rect x="538" y="78" width="238" height="300" rx="6" fill="url(#gyellow)" filter="url(#glow)" opacity="0.9"/>
  <text x="657" y="98" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold" font-family="sans-serif">
    <tspan x="657" dy="0">Special Bits &amp; ACL</tspan>
    <tspan x="657" dy="15" font-size="9" font-family="monospace" fill="#fef3c7">SUID (4): run as owner</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fef3c7"> chmod 4755 /bin/prog</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">SGID (2): run as group</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fef3c7"> chmod 2755 /shared</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">Sticky (1): owner-delete only</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fef3c7"> chmod 1777 /tmp</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">setfacl -m u:bob:rw file</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">setfacl -m g:dev:rx dir</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">setfacl -d -m u:x:r dir</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">getfacl file</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">setfacl -x u:bob file</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">setfacl -b file  (remove all)</tspan>
    <tspan x="657" dy="13" font-size="9" font-family="monospace" fill="#fef3c7">ls -l: + means ACL active</tspan>
  </text>
  <!-- Footer -->
  <rect x="22" y="393" width="756" height="78" rx="6" fill="url(#gcyan)" filter="url(#glow)" opacity="0.9"/>
  <text x="400" y="411" text-anchor="middle" fill="#e2e8f0" font-size="10" font-family="monospace">
    <tspan x="400" dy="0">Octal: 0=---  1=--x  2=-w-  3=-wx  4=r--  5=r-x  6=rw-  7=rwx</tspan>
    <tspan x="400" dy="15">LFCS: chmod 755 / chown root / setfacl -m / find -perm /4000 / umask / lsattr</tspan>
    <tspan x="400" dy="15">Special: SUID(4000) runs as owner · SGID(2000) runs as group · Sticky(1000) /tmp</tspan>
  </text>
</svg>
