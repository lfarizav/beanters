<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 330">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.3"/>
    </pattern>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="grad-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#be123c" stop-opacity="0.02"/>
    </linearGradient>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06b6d4"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f43f5e"/>
    </marker>
  </defs>

  <rect width="440" height="330" fill="url(#grid)" rx="6"/>
  <text x="15" y="22" fill="#38bdf8" font-size="8" font-family="monospace" letter-spacing="1">OPS.STATE // SYSTEMD UNIT STATE MACHINE</text>
  <line x1="15" y1="26" x2="425" y2="26" stroke="#38bdf8" stroke-width="1" opacity="0.2"/>

  <!-- Inactive State -->
  <g transform="translate(40, 130)">
    <rect width="70" height="42" rx="4" fill="#0b1329" stroke="#334155" stroke-width="1.2"/>
    <text x="35" y="20" fill="#94a3b8" font-size="8.5" font-weight="bold" font-family="sans-serif" text-anchor="middle">inactive</text>
    <text x="35" y="32" fill="#64748b" font-size="6" font-family="monospace" text-anchor="middle">Stopped / Idle</text>
  </g>

  <!-- Activating State -->
  <g transform="translate(185, 60)">
    <rect width="70" height="42" rx="4" fill="url(#grad-cyan)" stroke="#06b6d4" stroke-width="1.2" filter="url(#glow-cyan)"/>
    <text x="35" y="20" fill="#22d3ee" font-size="8.5" font-weight="bold" font-family="sans-serif" text-anchor="middle">activating</text>
    <text x="35" y="32" fill="#cbd5e1" font-size="6" font-family="monospace" text-anchor="middle">ExecStartPre</text>
  </g>

  <!-- Active State -->
  <g transform="translate(330, 130)">
    <rect width="70" height="42" rx="4" fill="url(#grad-green)" stroke="#10b981" stroke-width="1.2" filter="url(#glow-green)"/>
    <text x="35" y="20" fill="#a7f3d0" font-size="8.5" font-weight="bold" font-family="sans-serif" text-anchor="middle">active</text>
    <text x="35" y="32" fill="#cbd5e1" font-size="6" font-family="monospace" text-anchor="middle">Running OK</text>
  </g>

  <!-- Failed State -->
  <g transform="translate(185, 200)">
    <rect width="70" height="42" rx="4" fill="url(#grad-red)" stroke="#f43f5e" stroke-width="1.2" filter="url(#glow-red)"/>
    <text x="35" y="20" fill="#fecdd3" font-size="8.5" font-weight="bold" font-family="sans-serif" text-anchor="middle">failed</text>
    <text x="35" y="32" fill="#cbd5e1" font-size="6" font-family="monospace" text-anchor="middle">Exit Code != 0</text>
  </g>

  <!-- Transitions -->
  <!-- Inactive to Activating -->
  <path d="M 110,140 Q 147.5,90 185,81" fill="none" stroke="#06b6d4" stroke-width="1" marker-end="url(#arr-cyan)"/>
  <text x="142" y="105" fill="#22d3ee" font-size="5.5" font-family="monospace" text-anchor="middle">systemctl start</text>

  <!-- Activating to Active -->
  <path d="M 255,81 Q 292.5,90 330,140" fill="none" stroke="#10b981" stroke-width="1" marker-end="url(#arr-green)"/>
  <text x="298" y="105" fill="#34d399" font-size="5.5" font-family="monospace" text-anchor="middle">ExecStart OK</text>

  <!-- Activating to Failed -->
  <line x1="220" y1="102" x2="220" y2="200" stroke="#f43f5e" stroke-width="1" marker-end="url(#arr-red)"/>
  <text x="225" y="150" fill="#fecdd3" font-size="5.5" font-family="monospace" text-anchor="start">ExecStart error</text>

  <!-- Active to Inactive -->
  <path d="M 330,162 Q 220,180 110,162" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="2 2" marker-end="url(#arr-cyan)"/>
  <text x="220" y="172" fill="#cbd5e1" font-size="5.5" font-family="monospace" text-anchor="middle">systemctl stop</text>

  <!-- Active to Failed -->
  <path d="M 365,172 Q 320,221 255,221" fill="none" stroke="#f43f5e" stroke-width="1" marker-end="url(#arr-red)"/>
  <text x="325" y="202" fill="#fecdd3" font-size="5.5" font-family="monospace" text-anchor="middle">Process crash</text>

  <!-- Failed to Activating (Restart) -->
  <path d="M 185,221 Q 130,221 130,190 Q 130,150 185,102" fill="none" stroke="#f43f5e" stroke-width="1" marker-end="url(#arr-red)"/>
  <text x="120" y="175" fill="#fecdd3" font-size="5" font-family="monospace" text-anchor="middle">Restart=on-failure
(RestartSec=3)</text>

  <text x="15" y="310" fill="#475569" font-size="7" font-family="monospace">BLUEPRINT // SYSTEMD LIFECYCLE MANAGEMENT FLOW</text>
  <text x="425" y="310" fill="#475569" font-size="7" font-family="monospace" text-anchor="end">SYSTEMD UNIT SPECIFICATION</text>
</svg>