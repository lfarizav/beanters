<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 330">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.3"/>
    </pattern>
    <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="grad-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#be123c" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="440" height="330" fill="url(#grid)" rx="6"/>
  <text x="15" y="22" fill="#38bdf8" font-size="8" font-family="monospace" letter-spacing="1">CLI.FIND // AUDITING AND FILE HARDENING DIRECTORY CHECK</text>
  <line x1="15" y1="26" x2="425" y2="26" stroke="#38bdf8" stroke-width="1" opacity="0.2"/>

  <!-- find root command -->
  <g transform="translate(155, 45)">
    <rect width="130" height="42" rx="4" fill="url(#grad-cyan)" stroke="#06b6d4" stroke-width="1.5" filter="url(#glow-cyan)"/>
    <text x="65" y="18" fill="#22d3ee" font-size="9" font-weight="bold" font-family="sans-serif" text-anchor="middle">find /etc/open5gs/</text>
    <text x="65" y="32" fill="#cbd5e1" font-size="6.5" font-family="monospace" text-anchor="middle">Scan configs tree</text>
  </g>

  <!-- Branches -->
  <!-- Audit branch -->
  <g transform="translate(15, 125)">
    <rect width="110" height="42" rx="3" fill="url(#grad-cyan)" stroke="#06b6d4" stroke-width="1"/>
    <text x="55" y="16" fill="#cbd5e1" font-size="8" font-weight="bold" font-family="sans-serif" text-anchor="middle">mtime -1 -ls</text>
    <text x="55" y="26" fill="#cbd5e1" font-size="6.5" font-family="sans-serif" text-anchor="middle">Audit Changes</text>
    <text x="55" y="34" fill="#64748b" font-size="5.5" font-family="monospace" text-anchor="middle">Modified last 24h</text>
  </g>

  <!-- Security branch -->
  <g transform="translate(165, 125)">
    <rect width="110" height="42" rx="3" fill="url(#grad-red)" stroke="#f43f5e" stroke-width="1" opacity="0.8"/>
    <text x="55" y="16" fill="#fecdd3" font-size="8" font-weight="bold" font-family="sans-serif" text-anchor="middle">perm -o+w</text>
    <text x="55" y="26" fill="#cbd5e1" font-size="6.5" font-family="sans-serif" text-anchor="middle">Security check</text>
    <text x="55" y="34" fill="#f43f5e" font-size="5.5" font-family="monospace" text-anchor="middle">World-writable risk ⚠️</text>
  </g>

  <!-- Exec Validate branch -->
  <g transform="translate(315, 125)">
    <rect width="110" height="42" rx="3" fill="url(#grad-green)" stroke="#10b981" stroke-width="1"/>
    <text x="55" y="16" fill="#a7f3d0" font-size="8" font-weight="bold" font-family="sans-serif" text-anchor="middle">-exec validate</text>
    <text x="55" y="26" fill="#cbd5e1" font-size="6.5" font-family="sans-serif" text-anchor="middle">Syntax check</text>
    <text x="55" y="34" fill="#34d399" font-size="5.5" font-family="monospace" text-anchor="middle">YAML parse check ✅</text>
  </g>

  <!-- Flows -->
  <path d="M 220,87 L 220,105 L 70,105 L 70,125" fill="none" stroke="#06b6d4" stroke-width="1"/>
  <path d="M 220,87 L 220,125" fill="none" stroke="#f43f5e" stroke-width="1"/>
  <path d="M 220,87 L 220,105 L 370,105 L 370,125" fill="none" stroke="#10b981" stroke-width="1"/>

  <!-- Command list for security/hardening -->
  <g transform="translate(15, 205)">
    <rect width="410" height="52" rx="3" fill="#0b1329" stroke="#1e293b" stroke-width="1"/>
    <text x="15" y="15" fill="#38bdf8" font-size="7.5" font-family="monospace">AUDITING EXAMPLES:</text>
    <text x="15" y="28" fill="#e2e8f0" font-size="7" font-family="monospace"># Comprimir logs > 30 días: find /var/log/5g/ -name "*.log" -mtime +30 -exec gzip {} \;</text>
    <text x="15" y="42" fill="#e2e8f0" font-size="7" font-family="monospace"># Hardening: find /usr/bin/ /usr/sbin/ -perm -4000 -type f (SUID checking)</text>
  </g>

  <text x="15" y="310" fill="#475569" font-size="7" font-family="monospace">BLUEPRINT // MASS DIRECTORY DISCOVERY AND PERMISSION SANITATION</text>
  <text x="425" y="310" fill="#475569" font-size="7" font-family="monospace" text-anchor="end">LINUX AUDITING SPEC</text>
</svg>