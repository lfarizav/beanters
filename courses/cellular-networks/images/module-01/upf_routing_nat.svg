<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.4"/>
    </pattern>
    
    <!-- Glowing filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <linearGradient id="gA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="gB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="gC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="gD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#be123c" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="gE" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4338ca" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="gF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0.05"/>
    </linearGradient>
    
    <!-- Markers -->
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981"/>
    </marker>
    <marker id="arr-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="800" height="450" fill="#0a0f1d"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <rect x="15" y="15" width="770" height="420" rx="8" fill="none" stroke="#1e293b" stroke-width="1.5" opacity="0.6"/>

  <!-- Blueprint Header -->
  <text x="35" y="48" fill="#94a3b8" font-size="13" font-family="monospace" letter-spacing="1.5">LINU.NET // LINUX KERNEL PACKET FLOW &amp; IP POLICY ROUTING PIPELINE</text>
  <line x1="35" y1="58" x2="765" y2="58" stroke="#38bdf8" stroke-width="1.5" opacity="0.3"/>

  <!-- Ingress: N3 Interface -->
  <g transform="translate(30, 180)">
    <rect width="110" height="90" rx="5" fill="url(#gB)" stroke="#38bdf8" stroke-width="1.2" filter="url(#glow-cyan)"/>
    <text x="55" y="24" text-anchor="middle" fill="#e0f2fe" font-size="12" font-weight="bold">Ingress N3 (Rx)</text>
    <text x="55" y="46" text-anchor="middle" fill="#7dd3fc" font-size="9" font-family="monospace">GTP-U UDP:2152</text>
    <text x="55" y="66" text-anchor="middle" fill="#94a3b8" font-size="8.5" font-family="monospace">Encapsulated</text>
  </g>

  <!-- PREROUTING Mark -->
  <g transform="translate(170, 180)">
    <rect width="110" height="90" rx="5" fill="url(#gE)" stroke="#a78bfa" stroke-width="1"/>
    <text x="55" y="24" text-anchor="middle" fill="#fff" font-size="11.5" font-weight="bold">PREROUTING</text>
    <text x="55" y="46" text-anchor="middle" fill="#d1fae5" font-size="9" font-family="monospace">Decap + Mark</text>
    <text x="55" y="66" text-anchor="middle" fill="#94a3b8" font-size="8" font-family="monospace">FWMARK (0x10/20)</text>
  </g>

  <!-- sysctl ip_forward -->
  <g transform="translate(310, 180)">
    <rect width="110" height="90" rx="5" fill="url(#gD)" stroke="#f87171" stroke-width="1" filter="url(#glow-cyan)"/>
    <text x="55" y="24" text-anchor="middle" fill="#fee2e2" font-size="11.5" font-weight="bold">sysctl forward</text>
    <text x="55" y="46" text-anchor="middle" fill="#fca5a5" font-size="9" font-family="monospace">ip_forward = 1</text>
    <text x="55" y="66" text-anchor="middle" fill="#94a3b8" font-size="8" font-family="monospace">Kernel Router</text>
  </g>

  <!-- IP Rule Routing -->
  <g transform="translate(450, 180)">
    <rect width="120" height="90" rx="5" fill="url(#gA)" stroke="#fbbf24" stroke-width="1.2" filter="url(#glow-cyan)"/>
    <text x="60" y="24" text-anchor="middle" fill="#fef3c7" font-size="11.5" font-weight="bold">ip rule lookup</text>
    <text x="60" y="46" text-anchor="middle" fill="#fbbf24" font-size="9" font-family="monospace">fwmark 0x10 -> t100</text>
    <text x="60" y="66" text-anchor="middle" fill="#fbbf24" font-size="9" font-family="monospace">fwmark 0x20 -> t200</text>
  </g>

  <!-- Routing Table 100 -->
  <g transform="translate(600, 95)">
    <rect width="165" height="90" rx="5" fill="url(#gC)" stroke="#10b981" stroke-width="1" filter="url(#glow-green)"/>
    <text x="82.5" y="24" text-anchor="middle" fill="#d1fae5" font-size="11.5" font-weight="bold">Table 100 (eMBB Slice)</text>
    <text x="82.5" y="46" text-anchor="middle" fill="#a7f3d0" font-size="9" font-family="monospace">Default via Gateway A</text>
    <text x="82.5" y="66" text-anchor="middle" fill="#94a3b8" font-size="8" font-family="monospace">N6 NAT Masquerade</text>
  </g>

  <!-- Routing Table 200 -->
  <g transform="translate(600, 255)">
    <rect width="165" height="90" rx="5" fill="url(#gC)" stroke="#10b981" stroke-width="1" filter="url(#glow-green)"/>
    <text x="82.5" y="24" text-anchor="middle" fill="#d1fae5" font-size="11.5" font-weight="bold">Table 200 (URLLC Slice)</text>
    <text x="82.5" y="46" text-anchor="middle" fill="#a7f3d0" font-size="9" font-family="monospace">Default via Gateway B</text>
    <text x="82.5" y="66" text-anchor="middle" fill="#94a3b8" font-size="8" font-family="monospace">N6 NAT Masquerade</text>
  </g>

  <!-- Connectors -->
  <path d="M 140 225 L 170 225" fill="none" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arr-cyan)"/>
  <path d="M 280 225 L 310 225" fill="none" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#arr-cyan)"/>
  <path d="M 420 225 L 450 225" fill="none" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#arr-yellow)"/>
  
  <path d="M 570 225 L 585 225 L 585 140 L 600 140" fill="none" stroke="#10b981" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <path d="M 570 225 L 585 225 L 585 300 L 600 300" fill="none" stroke="#10b981" stroke-width="1.8" marker-end="url(#arr-green)"/>

  <!-- Animated flow dots -->
  <circle r="4" fill="#38bdf8" filter="url(#glow-cyan)">
    <animateMotion dur="2s" repeatCount="indefinite" path="M 140 225 L 170 225" begin="0s"/>
  </circle>
  <circle r="4" fill="#fbbf24" filter="url(#glow-cyan)">
    <animateMotion dur="2.4s" repeatCount="indefinite" path="M 570 225 L 585 225 L 585 140 L 600 140" begin="0.2s"/>
  </circle>
  <circle r="4" fill="#10b981" filter="url(#glow-green)">
    <animateMotion dur="2.4s" repeatCount="indefinite" path="M 570 225 L 585 225 L 585 300 L 600 300" begin="0.8s"/>
  </circle>
</svg>