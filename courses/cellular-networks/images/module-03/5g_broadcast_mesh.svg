<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 350" width="100%" height="100%">
  <defs>
    <!-- Background grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#112240" stroke-width="0.8" opacity="0.5"/>
    </pattern>

    <!-- Glowing filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Grid overlay -->
  <rect width="440" height="350" fill="url(#grid)"/>

  <!-- Blueprint Header -->
  <text x="20" y="25" fill="#38bdf8" font-size="8" font-family="monospace" letter-spacing="1">GRID.MAP // UNICAST VS 5G BROADCAST RESOURCE GRIDS</text>
  <line x1="20" y1="30" x2="420" y2="30" stroke="#38bdf8" stroke-width="1.2" opacity="0.3"/>

  <!-- SECTION 1: 5G UNICAST GRID (TOP) -->
  <text x="20" y="48" fill="#22d3ee" font-size="8" font-weight="bold" font-family="sans-serif">1. 5G UNICAST GRID (DEDICATED PRBs)</text>
  <g transform="translate(20, 55)">
    <rect width="400" height="110" rx="4" fill="none" stroke="#334155" stroke-width="1"/>
    
    <!-- 4x3 Grid (Unicast PRB allocations) -->
    <g transform="translate(15, 15)">
      <!-- Col 1 -->
      <rect x="0" y="0" width="22" height="22" fill="#06b6d4" fill-opacity="0.6" stroke="#040b14"/>
      <rect x="0" y="25" width="22" height="22" fill="#f59e0b" fill-opacity="0.6" stroke="#040b14"/>
      <rect x="0" y="50" width="22" height="22" fill="#ef4444" fill-opacity="0.6" stroke="#040b14"/>
      <!-- Col 2 -->
      <rect x="25" y="0" width="22" height="22" fill="#ef4444" fill-opacity="0.6" stroke="#040b14"/>
      <rect x="25" y="25" width="22" height="22" fill="#06b6d4" fill-opacity="0.6" stroke="#040b14"/>
      <rect x="25" y="50" width="22" height="22" fill="#f59e0b" fill-opacity="0.6" stroke="#040b14"/>
      <!-- Col 3 -->
      <rect x="50" y="0" width="22" height="22" fill="#f59e0b" fill-opacity="0.6" stroke="#040b14"/>
      <rect x="50" y="25" width="22" height="22" fill="#ef4444" fill-opacity="0.6" stroke="#040b14"/>
      <rect x="50" y="50" width="22" height="22" fill="#06b6d4" fill-opacity="0.6" stroke="#040b14"/>
      <!-- Col 4 -->
      <rect x="75" y="0" width="22" height="22" fill="#06b6d4" fill-opacity="0.6" stroke="#040b14"/>
      <rect x="75" y="25" width="22" height="22" fill="#f59e0b" fill-opacity="0.6" stroke="#040b14"/>
      <rect x="75" y="50" width="22" height="22" fill="#ef4444" fill-opacity="0.6" stroke="#040b14"/>
      
      <text x="48" y="85" fill="#475569" font-size="6" font-family="monospace" text-anchor="middle">Dynamic Time / Freq Scheduling</text>
    </g>

    <!-- Explanation list -->
    <g transform="translate(180, 15)">
      <circle cx="10" cy="15" r="3.5" fill="#06b6d4" filter="url(#glow-cyan)"/>
      <text x="22" y="18" fill="#cbd5e1" font-size="8" font-family="sans-serif">UE 1: Web Downlink</text>

      <circle cx="10" cy="40" r="3.5" fill="#f59e0b"/>
      <text x="22" y="43" fill="#cbd5e1" font-size="8" font-family="sans-serif">UE 2: VoLTE Speech</text>

      <circle cx="10" cy="65" r="3.5" fill="#ef4444"/>
      <text x="22" y="68" fill="#cbd5e1" font-size="8" font-family="sans-serif">UE 3: IoT telemetry</text>
    </g>
  </g>

  <!-- SECTION 2: 5G BROADCAST GRID (BOTTOM) -->
  <text x="20" y="193" fill="#34d399" font-size="8" font-weight="bold" font-family="sans-serif">2. 5G BROADCAST GRID (FeMBMS SHARED SUBFRAME)</text>
  <g transform="translate(20, 200)">
    <rect width="400" height="110" rx="4" fill="none" stroke="#334155" stroke-width="1"/>
    
    <!-- Shared Solid Green Block with dashed internal grids -->
    <g transform="translate(15, 15)">
      <rect x="0" y="0" width="97" height="72" rx="2" fill="#10b981" stroke="#040b14" stroke-width="1" fill-opacity="0.35" filter="url(#glow-green)"/>
      <!-- Inner dashed grid lines -->
      <line x1="25" y1="0" x2="25" y2="72" stroke="#10b981" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.4"/>
      <line x1="50" y1="0" x2="50" y2="72" stroke="#10b981" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.4"/>
      <line x1="75" y1="0" x2="75" y2="72" stroke="#10b981" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.4"/>
      <line x1="0" y1="24" x2="97" y2="24" stroke="#10b981" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.4"/>
      <line x1="0" y1="48" x2="97" y2="48" stroke="#10b981" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.4"/>
      
      <text x="48" y="85" fill="#475569" font-size="6" font-family="monospace" text-anchor="middle">Single Stream Multicast Subframe</text>
    </g>

    <!-- Explanation list -->
    <g transform="translate(180, 15)">
      <!-- Antenna Broadcaster symbol -->
      <path d="M 10 20 Q 20 10 30 20" fill="none" stroke="#10b981" stroke-width="1.5" filter="url(#glow-green)"/>
      <path d="M 13 25 Q 20 18 27 25" fill="none" stroke="#10b981" stroke-width="1.5" filter="url(#glow-green)"/>
      <circle cx="20" cy="30" r="2.5" fill="#10b981"/>

      <text x="40" y="28" fill="#a7f3d0" font-size="8" font-family="sans-serif" font-weight="bold">One-to-Many</text>
      
      <text x="10" y="55" fill="#cbd5e1" font-size="8" font-family="sans-serif">All nearby UEs decode identical flow</text>
      <text x="10" y="68" fill="#cbd5e1" font-size="8" font-family="sans-serif">No uplink response or active session needed</text>
    </g>
  </g>

  <!-- Legend -->
  <text x="20" y="335" fill="#475569" font-size="7" font-family="monospace">MODE: FeMBMS (LTE-5G BROADCAST) // COMPATIBILITY: Rel-16+</text>
  <text x="400" y="335" fill="#475569" font-size="7" font-family="monospace" text-anchor="end">3GPP PHY SCALABILITY</text>
</svg>
