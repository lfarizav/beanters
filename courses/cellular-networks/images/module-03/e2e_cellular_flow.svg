<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" width="100%" height="100%">
  <defs>
    <!-- Background grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#112240" stroke-width="0.8" opacity="0.5"/>
    </pattern>

    <!-- Glowing filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Markers -->
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06b6d4"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Grid overlay -->
  <rect width="420" height="380" fill="url(#grid)"/>

  <!-- Blueprint Header -->
  <text x="20" y="25" fill="#38bdf8" font-size="8" font-family="monospace" letter-spacing="1">SYS.FLOW // END-TO-END DATA DELIVERY LOOP</text>
  <line x1="20" y1="30" x2="400" y2="30" stroke="#38bdf8" stroke-width="1.2" opacity="0.3"/>

  <!-- Step 1: IP Backbone -->
  <g transform="translate(110, 45)">
    <rect width="200" height="42" rx="4" fill="url(#grad-cyan)" stroke="#06b6d4" stroke-width="1.2" filter="url(#glow-cyan)"/>
    <text x="100" y="18" fill="#22d3ee" font-size="9" font-weight="bold" font-family="sans-serif" text-anchor="middle">1. IP Backbone Network</text>
    <text x="100" y="32" fill="#cbd5e1" font-size="7" font-family="sans-serif" text-anchor="middle">Transit Routing &amp; Ingress</text>
  </g>

  <!-- Step 2: Core Data Center -->
  <g transform="translate(110, 105)">
    <rect width="200" height="42" rx="4" fill="url(#grad-cyan)" stroke="#06b6d4" stroke-width="1.2" filter="url(#glow-cyan)"/>
    <text x="100" y="18" fill="#22d3ee" font-size="9" font-weight="bold" font-family="sans-serif" text-anchor="middle">2. Core / Edge DC</text>
    <text x="100" y="32" fill="#cbd5e1" font-size="7" font-family="sans-serif" text-anchor="middle">5GC User Plane Anchoring (UPF)</text>
  </g>

  <!-- Step 3: Baseband Unit -->
  <g transform="translate(110, 165)">
    <rect width="200" height="42" rx="4" fill="url(#grad-cyan)" stroke="#06b6d4" stroke-width="1.2" filter="url(#glow-cyan)"/>
    <text x="100" y="18" fill="#22d3ee" font-size="9" font-weight="bold" font-family="sans-serif" text-anchor="middle">3. Baseband Processing (BBU)</text>
    <text x="100" y="32" fill="#cbd5e1" font-size="7" font-family="sans-serif" text-anchor="middle">CU/DU Protocol Stack Mapping</text>
  </g>

  <!-- Step 4: RF Front-End -->
  <g transform="translate(110, 225)">
    <rect width="200" height="42" rx="4" fill="url(#grad-cyan)" stroke="#06b6d4" stroke-width="1.2" filter="url(#glow-cyan)"/>
    <text x="100" y="18" fill="#22d3ee" font-size="9" font-weight="bold" font-family="sans-serif" text-anchor="middle">4. MIMO RF Frontend</text>
    <text x="100" y="32" fill="#cbd5e1" font-size="7" font-family="sans-serif" text-anchor="middle">Active Antenna Array &amp; Beam Sweeps</text>
  </g>

  <!-- Step 5: UE Experience -->
  <g transform="translate(110, 285)">
    <rect width="200" height="42" rx="4" fill="url(#grad-green)" stroke="#10b981" stroke-width="1.5" filter="url(#glow-green)"/>
    <text x="100" y="18" fill="#a7f3d0" font-size="9" font-weight="bold" font-family="sans-serif" text-anchor="middle">5. UE Active Experience</text>
    <text x="100" y="32" fill="#a7f3d0" font-size="7" font-family="sans-serif" text-anchor="middle">Payload Decoding &amp; QoS Verification</text>
  </g>

  <!-- VERTICAL CONNECTING ARROWS WITH SIGNAL LABELS -->
  <line x1="210" y1="87" x2="210" y2="105" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arr-cyan)"/>
  <text x="215" y="98" fill="#06b6d4" font-size="6" font-family="monospace">IP Transit</text>

  <line x1="210" y1="147" x2="210" y2="165" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arr-cyan)"/>
  <text x="215" y="158" fill="#06b6d4" font-size="6" font-family="monospace">GTP Tunnel</text>

  <line x1="210" y1="207" x2="210" y2="225" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arr-cyan)"/>
  <text x="215" y="218" fill="#06b6d4" font-size="6" font-family="monospace">I/Q Samples</text>

  <line x1="210" y1="267" x2="210" y2="285" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="215" y="278" fill="#10b981" font-size="6" font-family="monospace">Air Wave</text>

  <!-- Legend -->
  <text x="20" y="350" fill="#475569" font-size="7" font-family="monospace">E2E TELEMETRY LOOP // ALL-IP ENCAPSULATION</text>
  <text x="400" y="350" fill="#475569" font-size="7" font-family="monospace" text-anchor="end">USER PLANE ANCHOR CONTROL</text>
</svg>
