<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 330" width="100%" height="100%">
  <defs>
    <!-- Background grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#112240" stroke-width="0.8" opacity="0.5"/>
    </pattern>

    <!-- Glowing filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Grid overlay -->
  <rect width="440" height="330" fill="url(#grid)"/>

  <!-- Blueprint Header -->
  <text x="20" y="25" fill="#38bdf8" font-size="8" font-family="monospace" letter-spacing="1">STACK.DIAG // RAN PROTOCOL EVOLUTION STACK</text>
  <line x1="20" y1="30" x2="420" y2="30" stroke="#38bdf8" stroke-width="1.2" opacity="0.3"/>

  <!-- Column Headers -->
  <text x="100" y="52" fill="#22d3ee" font-size="8" font-weight="bold" font-family="sans-serif" text-anchor="middle">4G LTE STACK</text>
  <text x="340" y="52" fill="#34d399" font-size="8" font-weight="bold" font-family="sans-serif" text-anchor="middle">5G NR STACK</text>

  <!-- SDAP Layer -->
  <g transform="translate(10, 65)">
    <rect width="180" height="36" rx="3" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="90" y="18" fill="#475569" font-size="8" font-family="sans-serif" text-anchor="middle">(No SDAP Layer)</text>
    <text x="90" y="28" fill="#475569" font-size="6" font-family="sans-serif" text-anchor="middle">QoS mapped in core</text>
  </g>
  <g transform="translate(250, 65)">
    <rect width="180" height="36" rx="3" fill="url(#grad-green)" stroke="#10b981" stroke-width="1.2" filter="url(#glow-green)"/>
    <text x="90" y="16" fill="#a7f3d0" font-size="8" font-weight="bold" font-family="sans-serif" text-anchor="middle">SDAP</text>
    <text x="90" y="26" fill="#a7f3d0" font-size="6" font-family="monospace" text-anchor="middle">QoS Flow to DRB mapping</text>
  </g>

  <!-- PDCP Layer -->
  <g transform="translate(10, 112)">
    <rect width="180" height="36" rx="3" fill="url(#grad-cyan)" stroke="#06b6d4" stroke-width="1.0"/>
    <text x="90" y="16" fill="#e2e8f0" font-size="8" font-weight="bold" font-family="sans-serif" text-anchor="middle">PDCP</text>
    <text x="90" y="26" fill="#0891b2" font-size="6" font-family="monospace" text-anchor="middle">IP Header Comp / Cipher</text>
  </g>
  <g transform="translate(250, 112)">
    <rect width="180" height="36" rx="3" fill="url(#grad-green)" stroke="#10b981" stroke-width="1.0"/>
    <text x="90" y="16" fill="#a7f3d0" font-size="8" font-weight="bold" font-family="sans-serif" text-anchor="middle">PDCP</text>
    <text x="90" y="26" fill="#34d399" font-size="6" font-family="monospace" text-anchor="middle">Integrity Protection / cipher</text>
  </g>

  <!-- RLC Layer -->
  <g transform="translate(10, 159)">
    <rect width="180" height="36" rx="3" fill="url(#grad-cyan)" stroke="#06b6d4" stroke-width="1.0"/>
    <text x="90" y="16" fill="#e2e8f0" font-size="8" font-weight="bold" font-family="sans-serif" text-anchor="middle">RLC</text>
    <text x="90" y="26" fill="#0891b2" font-size="6" font-family="monospace" text-anchor="middle">In-order Rx / ARQ</text>
  </g>
  <g transform="translate(250, 159)">
    <rect width="180" height="36" rx="3" fill="url(#grad-green)" stroke="#10b981" stroke-width="1.0"/>
    <text x="90" y="16" fill="#a7f3d0" font-size="8" font-weight="bold" font-family="sans-serif" text-anchor="middle">RLC</text>
    <text x="90" y="26" fill="#34d399" font-size="6" font-family="monospace" text-anchor="middle">Decoupled Out-of-Order Option</text>
  </g>

  <!-- MAC Layer -->
  <g transform="translate(10, 206)">
    <rect width="180" height="36" rx="3" fill="url(#grad-cyan)" stroke="#06b6d4" stroke-width="1.0"/>
    <text x="90" y="16" fill="#e2e8f0" font-size="8" font-weight="bold" font-family="sans-serif" text-anchor="middle">MAC</text>
    <text x="90" y="26" fill="#0891b2" font-size="6" font-family="monospace" text-anchor="middle">Scheduling / HARQ</text>
  </g>
  <g transform="translate(250, 206)">
    <rect width="180" height="36" rx="3" fill="url(#grad-green)" stroke="#10b981" stroke-width="1.0"/>
    <text x="90" y="16" fill="#a7f3d0" font-size="8" font-weight="bold" font-family="sans-serif" text-anchor="middle">MAC</text>
    <text x="90" y="26" fill="#34d399" font-size="6" font-family="monospace" text-anchor="middle">Beam Sweeps / Fast HARQ</text>
  </g>

  <!-- PHY Layer -->
  <g transform="translate(10, 253)">
    <rect width="180" height="36" rx="3" fill="url(#grad-cyan)" stroke="#06b6d4" stroke-width="1.0"/>
    <text x="90" y="16" fill="#e2e8f0" font-size="8" font-weight="bold" font-family="sans-serif" text-anchor="middle">PHY</text>
    <text x="90" y="26" fill="#0891b2" font-size="6" font-family="monospace" text-anchor="middle">Fixed 15 kHz subcarrier / Turbo</text>
  </g>
  <g transform="translate(250, 253)">
    <rect width="180" height="36" rx="3" fill="url(#grad-green)" stroke="#10b981" stroke-width="1.2" filter="url(#glow-green)"/>
    <text x="90" y="16" fill="#a7f3d0" font-size="8" font-weight="bold" font-family="sans-serif" text-anchor="middle">PHY</text>
    <text x="90" y="26" fill="#34d399" font-size="6" font-family="monospace" text-anchor="middle">Flexible SCS (15-120 kHz) / LDPC</text>
  </g>

  <!-- Evolutionary Mappings (arrows in the center) -->
  <line x1="195" y1="83" x2="245" y2="83" stroke="#10b981" stroke-width="1" stroke-dasharray="2 2"/>
  <polygon points="218,80 224,83 218,86" fill="#10b981"/>

  <line x1="195" y1="271" x2="245" y2="271" stroke="#10b981" stroke-width="1" stroke-dasharray="2 2"/>
  <polygon points="218,268 224,271 218,274" fill="#10b981"/>

  <!-- Legend -->
  <text x="20" y="315" fill="#475569" font-size="7" font-family="monospace">STACK EVOLUTION // SDAP = SERVICE DATA ADAPTATION PROTOCOL</text>
  <text x="420" y="315" fill="#475569" font-size="7" font-family="monospace" text-anchor="end">3GPP REL 15 REFERENCE</text>
</svg>
