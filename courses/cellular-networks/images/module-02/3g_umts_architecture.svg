<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" width="100%" height="100%">
  <defs>
    <!-- Background grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#112240" stroke-width="0.8" opacity="0.5"/>
    </pattern>

    <!-- Glowing filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Markers -->
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06b6d4"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Grid overlay -->
  <rect width="440" height="360" fill="url(#grid)"/>

  <!-- Blueprint Header -->
  <text x="20" y="25" fill="#38bdf8" font-size="8" font-family="monospace" letter-spacing="1">ARCH.DIAG // 3G UMTS DUAL-DOMAIN ARCHITECTURE</text>
  <line x1="20" y1="30" x2="420" y2="30" stroke="#38bdf8" stroke-width="1.2" opacity="0.3"/>

  <!-- UE 3G -->
  <g transform="translate(130, 45)">
    <rect width="180" height="42" rx="4" fill="url(#grad-cyan)" stroke="#06b6d4" stroke-width="1.2" filter="url(#glow-cyan)"/>
    <text x="90" y="18" fill="#22d3ee" font-size="9" font-weight="bold" font-family="sans-serif" text-anchor="middle">📱 UE 3G (WCDMA)</text>
    <text x="90" y="32" fill="#cbd5e1" font-size="7" font-family="sans-serif" text-anchor="middle">5 MHz Orthogonal Spreading</text>
  </g>

  <!-- Node B -->
  <g transform="translate(130, 105)">
    <rect width="180" height="42" rx="4" fill="url(#grad-cyan)" stroke="#06b6d4" stroke-width="1.2" filter="url(#glow-cyan)"/>
    <text x="90" y="18" fill="#22d3ee" font-size="9" font-weight="bold" font-family="sans-serif" text-anchor="middle">🗼 Node B</text>
    <text x="90" y="32" fill="#cbd5e1" font-size="7" font-family="sans-serif" text-anchor="middle">UMTS Base Station / Uu Link</text>
  </g>

  <!-- RNC -->
  <g transform="translate(130, 165)">
    <rect width="180" height="42" rx="4" fill="url(#grad-cyan)" stroke="#06b6d4" stroke-width="1.2" filter="url(#glow-cyan)"/>
    <text x="90" y="18" fill="#22d3ee" font-size="9" font-weight="bold" font-family="sans-serif" text-anchor="middle">RNC</text>
    <text x="90" y="32" fill="#cbd5e1" font-size="7" font-family="sans-serif" text-anchor="middle">Radio Network Controller / Iub</text>
  </g>

  <!-- SPLIT DOMAINS -->

  <!-- Packet-Switched Domain (Left) -->
  <g transform="translate(10, 240)">
    <rect width="190" height="42" rx="3" fill="url(#grad-green)" stroke="#10b981" stroke-width="1.0" filter="url(#glow-green)"/>
    <text x="95" y="18" fill="#a7f3d0" font-size="9" font-weight="bold" font-family="sans-serif" text-anchor="middle">SGSN → GGSN</text>
    <text x="95" y="32" fill="#34d399" font-size="7" font-family="monospace" text-anchor="middle">🌐 Packet Core (Internet / WAP)</text>
  </g>

  <!-- Circuit-Switched Domain (Right) -->
  <g transform="translate(240, 240)">
    <rect width="190" height="42" rx="3" fill="url(#grad-amber)" stroke="#f59e0b" stroke-width="1.0" filter="url(#glow-amber)"/>
    <text x="95" y="18" fill="#fbbf24" font-size="9" font-weight="bold" font-family="sans-serif" text-anchor="middle">MSC → PSTN</text>
    <text x="95" y="32" fill="#fbbf24" font-size="7" font-family="monospace" text-anchor="middle">☎️ Circuit Core (Voice Calls)</text>
  </g>

  <!-- VERTICAL CONNECTORS -->
  <line x1="220" y1="87" x2="220" y2="105" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arr-cyan)"/>
  <line x1="220" y1="147" x2="220" y2="165" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arr-cyan)"/>

  <!-- Split from RNC -->
  <path d="M 220 207 L 220 225 L 105 225 L 105 240" fill="none" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="180" y="221" fill="#10b981" font-size="6" font-family="monospace" text-anchor="end">Iu-PS (Data)</text>

  <path d="M 220 207 L 220 225 L 335 225 L 335 240" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <text x="260" y="221" fill="#f59e0b" font-size="6" font-family="monospace" text-anchor="start">Iu-CS (Voice)</text>

  <!-- Legend -->
  <text x="20" y="340" fill="#475569" font-size="7" font-family="monospace">MODE: UMTS DUAL-CORE SPLIT // SYSTEM: Rel-99</text>
  <text x="420" y="340" fill="#475569" font-size="7" font-family="monospace" text-anchor="end">3GPP CELLULAR STANDARD</text>
</svg>
