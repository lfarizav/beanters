<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 370" width="100%" height="100%">
  <defs>
    <!-- Background grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#112240" stroke-width="0.8" opacity="0.5"/>
    </pattern>

    <!-- Glowing filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#4338ca" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Markers -->
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06b6d4"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f59e0b"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#a78bfa"/>
    </marker>
  </defs>

  <!-- Grid overlay -->
  <rect width="440" height="370" fill="url(#grid)"/>

  <!-- Blueprint Header -->
  <text x="20" y="25" fill="#38bdf8" font-size="8" font-family="monospace" letter-spacing="1">ARCH.DIAG // 5G NR SBA ARCHITECTURE (3GPP R15/R16)</text>
  <line x1="20" y1="30" x2="420" y2="30" stroke="#38bdf8" stroke-width="1.2" opacity="0.3"/>

  <!-- UE 5G -->
  <g transform="translate(130, 45)">
    <rect width="180" height="42" rx="4" fill="url(#grad-cyan)" stroke="#06b6d4" stroke-width="1.2" filter="url(#glow-cyan)"/>
    <text x="90" y="18" fill="#22d3ee" font-size="9" font-weight="bold" font-family="sans-serif" text-anchor="middle">&#128241; UE 5G (NR)</text>
    <text x="90" y="32" fill="#cbd5e1" font-size="7" font-family="sans-serif" text-anchor="middle">FR1 Sub-6GHz &#183; FR2 mmWave 28GHz</text>
  </g>

  <!-- gNB (NG-RAN) -->
  <g transform="translate(130, 105)">
    <rect width="180" height="42" rx="4" fill="url(#grad-cyan)" stroke="#06b6d4" stroke-width="1.2" filter="url(#glow-cyan)"/>
    <text x="90" y="18" fill="#22d3ee" font-size="9" font-weight="bold" font-family="sans-serif" text-anchor="middle">&#128284; gNB (NG-RAN)</text>
    <text x="90" y="32" fill="#cbd5e1" font-size="7" font-family="sans-serif" text-anchor="middle">CU-DU Split &#183; Massive MIMO 256T256R</text>
  </g>

  <!-- SPLIT PLANES -->

  <!-- Control Plane (Left) — AMF -->
  <g transform="translate(10, 195)">
    <rect width="190" height="52" rx="3" fill="url(#grad-amber)" stroke="#f59e0b" stroke-width="1.0" filter="url(#glow-amber)"/>
    <text x="95" y="18" fill="#fbbf24" font-size="9" font-weight="bold" font-family="sans-serif" text-anchor="middle">AMF (Mobility Control)</text>
    <text x="95" y="32" fill="#fbbf24" font-size="7" font-family="monospace" text-anchor="middle">N2: NAS Signaling &#183; N11: SMF via SBA</text>
    <text x="95" y="44" fill="#fbbf24" font-size="6" font-family="monospace" text-anchor="middle">Replaces: MME (3GPP R15)</text>
  </g>

  <!-- User Plane (Right) — SMF+UPF -->
  <g transform="translate(240, 195)">
    <rect width="190" height="52" rx="3" fill="url(#grad-green)" stroke="#10b981" stroke-width="1.0" filter="url(#glow-green)"/>
    <text x="95" y="18" fill="#a7f3d0" font-size="9" font-weight="bold" font-family="sans-serif" text-anchor="middle">SMF &#8594; UPF</text>
    <text x="95" y="32" fill="#34d399" font-size="7" font-family="monospace" text-anchor="middle">N4: PFCP &#183; N3: GTP-U Binding</text>
    <text x="95" y="44" fill="#34d399" font-size="6" font-family="monospace" text-anchor="middle">Replaces: SGW + PGW &#183; N6 Egress</text>
  </g>

  <!-- N11/N4 coordinating interface -->
  <line x1="200" y1="221" x2="240" y2="221" stroke="#06b6d4" stroke-width="1.0" stroke-dasharray="2 2" marker-end="url(#arr-cyan)"/>
  <text x="220" y="215" fill="#06b6d4" font-size="6" font-family="monospace" text-anchor="middle">N11/N4</text>

  <!-- VERTICAL CONNECTORS -->

  <!-- Uu: UE to gNB -->
  <line x1="220" y1="87" x2="220" y2="105" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arr-cyan)"/>
  <text x="232" y="99" fill="#06b6d4" font-size="6" font-family="monospace">Uu</text>

  <!-- Split from gNB: N2 to AMF (left) -->
  <path d="M 220 147 L 220 175 L 105 175 L 105 195" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <text x="162" y="171" fill="#f59e0b" font-size="6" font-family="monospace" text-anchor="end">N2 (SCTP)</text>

  <!-- Split from gNB: N3 to UPF (right) -->
  <path d="M 220 147 L 220 175 L 335 175 L 335 195" fill="none" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="258" y="171" fill="#10b981" font-size="6" font-family="monospace" text-anchor="start">N3 (GTP-U)</text>

  <!-- AMF to SBA Bus (N8/N10) -->
  <line x1="105" y1="247" x2="105" y2="295" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="115" y="272" fill="#a78bfa" font-size="6" font-family="monospace">N8/N10</text>

  <!-- UPF to Internet (N6) -->
  <line x1="335" y1="247" x2="335" y2="295" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="345" y="272" fill="#a7f3d0" font-size="6" font-family="monospace">N6</text>

  <!-- SBA Service Bus (bottom left) -->
  <g transform="translate(10, 295)">
    <rect width="220" height="30" rx="3" fill="url(#grad-purple)" stroke="#a78bfa" stroke-width="1.2" filter="url(#glow-purple)"/>
    <text x="110" y="14" fill="#c4b5fd" font-size="8" font-weight="bold" font-family="sans-serif" text-anchor="middle">SBA: NRF &#183; UDM &#183; PCF &#183; AUSF</text>
    <text x="110" y="25" fill="#c4b5fd" font-size="6" font-family="monospace" text-anchor="middle">HTTP/2 micro-services (3GPP SBA)</text>
  </g>

  <!-- Internet / DN (bottom right) -->
  <g transform="translate(240, 295)">
    <rect width="190" height="30" rx="3" fill="none" stroke="#10b981" stroke-width="1.2" filter="url(#glow-green)"/>
    <text x="95" y="18" fill="#a7f3d0" font-size="8" font-family="sans-serif" text-anchor="middle" font-weight="bold">&#127760; DN / Internet (N6)</text>
  </g>

  <!-- Footer -->
  <text x="20" y="350" fill="#475569" font-size="7" font-family="monospace">MODE: 5G NR SA &#183; 5GC SBA (HTTP/2) // NG-RAN: CU-DU SPLIT</text>
  <text x="420" y="350" fill="#475569" font-size="7" font-family="monospace" text-anchor="end">3GPP RELEASE 15-18 STANDARD</text>
</svg>
