<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 310" width="100%" height="100%">
  <defs>
    <!-- Background grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#112240" stroke-width="0.8" opacity="0.5"/>
    </pattern>

    <!-- Glowing filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Markers -->
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Grid overlay -->
  <rect width="450" height="310" fill="url(#grid)"/>

  <!-- Blueprint Header -->
  <text x="20" y="25" fill="#38bdf8" font-size="8" font-family="monospace" letter-spacing="1">EVO.MAP // CELLULAR NODE LEGACY EVOLUTION</text>
  <line x1="20" y1="30" x2="430" y2="30" stroke="#38bdf8" stroke-width="1.2" opacity="0.3"/>

  <!-- Column Headers -->
  <text x="90" y="50" fill="#22d3ee" font-size="8" font-weight="bold" font-family="sans-serif" text-anchor="middle">2G GSM NODES</text>
  <text x="350" y="50" fill="#34d399" font-size="8" font-weight="bold" font-family="sans-serif" text-anchor="middle">5GC SBA FUNCTION</text>

  <!-- ROW 1 -->
  <g transform="translate(10, 60)">
    <rect width="160" height="32" rx="3" fill="url(#grad-cyan)" stroke="#06b6d4" stroke-width="1.0" filter="url(#glow-cyan)"/>
    <text x="80" y="16" fill="#e2e8f0" font-size="8" font-weight="bold" font-family="sans-serif" text-anchor="middle">GSM HLR</text>
    <text x="80" y="25" fill="#0891b2" font-size="6" font-family="monospace" text-anchor="middle">Central database</text>
  </g>
  <g transform="translate(270, 60)">
    <rect width="170" height="32" rx="3" fill="url(#grad-green)" stroke="#10b981" stroke-width="1.0" filter="url(#glow-green)"/>
    <text x="85" y="16" fill="#a7f3d0" font-size="8" font-weight="bold" font-family="sans-serif" text-anchor="middle">5GC UDM</text>
    <text x="85" y="25" fill="#34d399" font-size="6" font-family="monospace" text-anchor="middle">HTTP/2 JSON microservice</text>
  </g>
  <path d="M 175 76 L 265 76" fill="none" stroke="#10b981" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#arr-green)"/>

  <!-- ROW 2 -->
  <g transform="translate(10, 110)">
    <rect width="160" height="32" rx="3" fill="url(#grad-cyan)" stroke="#06b6d4" stroke-width="1.0" filter="url(#glow-cyan)"/>
    <text x="80" y="16" fill="#e2e8f0" font-size="8" font-weight="bold" font-family="sans-serif" text-anchor="middle">GSM SIM</text>
    <text x="80" y="25" fill="#0891b2" font-size="6" font-family="monospace" text-anchor="middle">IMSI identity profile</text>
  </g>
  <g transform="translate(270, 110)">
    <rect width="170" height="32" rx="3" fill="url(#grad-green)" stroke="#10b981" stroke-width="1.0"/>
    <text x="85" y="16" fill="#a7f3d0" font-size="8" font-weight="bold" font-family="sans-serif" text-anchor="middle">5GC USIM</text>
    <text x="85" y="25" fill="#34d399" font-size="6" font-family="monospace" text-anchor="middle">SUPI / SUCI encrypted</text>
  </g>
  <path d="M 175 126 L 265 126" fill="none" stroke="#10b981" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#arr-green)"/>

  <!-- ROW 3 -->
  <g transform="translate(10, 160)">
    <rect width="160" height="32" rx="3" fill="url(#grad-cyan)" stroke="#06b6d4" stroke-width="1.0" filter="url(#glow-cyan)"/>
    <text x="80" y="16" fill="#e2e8f0" font-size="8" font-weight="bold" font-family="sans-serif" text-anchor="middle">GSM BSC</text>
    <text x="80" y="25" fill="#0891b2" font-size="6" font-family="monospace" text-anchor="middle">Handover controller</text>
  </g>
  <g transform="translate(270, 160)">
    <rect width="170" height="32" rx="3" fill="url(#grad-green)" stroke="#10b981" stroke-width="1.0"/>
    <text x="85" y="16" fill="#a7f3d0" font-size="8" font-weight="bold" font-family="sans-serif" text-anchor="middle">5GC AMF</text>
    <text x="85" y="25" fill="#34d399" font-size="6" font-family="monospace" text-anchor="middle">SBA mobility service</text>
  </g>
  <path d="M 175 176 L 265 176" fill="none" stroke="#10b981" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#arr-green)"/>

  <!-- ROW 4 -->
  <g transform="translate(10, 210)">
    <rect width="160" height="32" rx="3" fill="url(#grad-cyan)" stroke="#06b6d4" stroke-width="1.0" filter="url(#glow-cyan)"/>
    <text x="80" y="16" fill="#e2e8f0" font-size="8" font-weight="bold" font-family="sans-serif" text-anchor="middle">GSM GGSN</text>
    <text x="80" y="25" fill="#0891b2" font-size="6" font-family="monospace" text-anchor="middle">Internet anchor</text>
  </g>
  <g transform="translate(270, 210)">
    <rect width="170" height="32" rx="3" fill="url(#grad-green)" stroke="#10b981" stroke-width="1.2" filter="url(#glow-green)"/>
    <text x="85" y="16" fill="#a7f3d0" font-size="8" font-weight="bold" font-family="sans-serif" text-anchor="middle">5GC UPF</text>
    <text x="85" y="25" fill="#34d399" font-size="6" font-family="monospace" text-anchor="middle">Decoupled user plane</text>
  </g>
  <path d="M 175 226 L 265 226" fill="none" stroke="#10b981" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#arr-green)"/>

  <!-- Legend -->
  <text x="20" y="295" fill="#475569" font-size="6" font-family="monospace">CONCEPT: LEGACY NODE EVOLUTION // SBA CLOUD-NATIVE</text>
  <text x="430" y="295" fill="#475569" font-size="6" font-family="monospace" text-anchor="end">5G STANDALONE SYSTEM</text>
</svg>
